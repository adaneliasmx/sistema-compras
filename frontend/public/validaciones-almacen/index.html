<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validaciones Almacen | Cuesto-SKF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;min-height:100vh}

/* ── LOGIN ── */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a3a5c 0%,#2c6e9e 100%)}
.login-box{background:#fff;border-radius:12px;padding:40px 48px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.login-box h1{text-align:center;font-size:1.3rem;color:#1a3a5c;margin-bottom:4px}
.login-box .sub{text-align:center;font-size:.85rem;color:#666;margin-bottom:28px}
.login-box label{display:block;font-size:.82rem;font-weight:600;color:#444;margin-bottom:4px}
.login-box input{width:100%;padding:10px 12px;border:1px solid #ccd;border-radius:6px;font-size:.95rem;margin-bottom:16px}
.login-box input:focus{outline:none;border-color:#2c6e9e}
.btn-primary{width:100%;padding:11px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary:hover{background:#2c5f8a}
.login-err{color:#c0392b;font-size:.82rem;text-align:center;margin-top:8px;min-height:18px}

/* ── LAYOUT PRINCIPAL ── */
#appPage{display:none;min-height:100vh;flex-direction:column}
header{background:#1a3a5c;color:#fff;padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1.05rem;font-weight:700;letter-spacing:.3px}
.header-right{display:flex;align-items:center;gap:16px;font-size:.82rem}
.user-badge{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:.82rem}
.btn-logout:hover{background:rgba(255,255,255,.1)}

nav{background:#fff;border-bottom:1px solid #e0e4ea;display:flex;gap:4px;padding:0 20px;overflow-x:auto}
nav button{background:none;border:none;padding:12px 18px;font-size:.88rem;font-weight:500;color:#555;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
nav button:hover{color:#1a3a5c;background:#f5f8ff}
nav button.active{color:#1a3a5c;border-bottom-color:#1a3a5c;font-weight:700}

main{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}

/* ── TARJETAS KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.kpi{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #2c6e9e}
.kpi.red{border-left-color:#c0392b}
.kpi.green{border-left-color:#27ae60}
.kpi.orange{border-left-color:#e67e22}
.kpi label{font-size:.75rem;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
.kpi .val{font-size:2rem;font-weight:700;color:#1a3a5c;line-height:1}
.kpi .sub{font-size:.78rem;color:#888;margin-top:4px}

/* ── FILTROS ── */
.filtros{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filtros label{font-size:.78rem;font-weight:600;color:#555;display:block;margin-bottom:3px}
.filtros input,.filtros select{padding:8px 10px;border:1px solid #ccd;border-radius:6px;font-size:.85rem;min-width:140px}
.filtros .btn-buscar{background:#1a3a5c;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.88rem}
.filtros .btn-buscar:hover{background:#2c5f8a}
.filtros .btn-clear{background:#f0f2f5;color:#555;border:1px solid #ccd;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.85rem}

/* ── TABLA ── */
.tabla-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.tabla-header{padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.tabla-header h3{font-size:.95rem;font-weight:700;color:#1a3a5c}
.tabla-count{font-size:.8rem;color:#888}
table{width:100%;border-collapse:collapse}
thead tr{background:#f5f8ff}
th{padding:10px 14px;font-size:.77rem;font-weight:700;color:#1a3a5c;text-align:left;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #e0e4ea;white-space:nowrap}
td{padding:9px 14px;font-size:.82rem;border-bottom:1px solid #f0f2f5;vertical-align:middle}
tr:hover td{background:#fafbff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700}
.badge.skf{background:#d4e8f7;color:#1a5276}
.badge.cuesto{background:#d5f5e3;color:#1e8449}
.badge.faltante{background:#fce4e4;color:#c0392b}
.badge.sin_qry{background:#fef3cd;color:#b7770d}
.badge.resuelto{background:#d5f5e3;color:#1e8449}
.badge.pendiente{background:#fce4e4;color:#c0392b}
.badge.conforme{background:#d5f5e3;color:#1e8449}
.badge.extra{background:#fef3cd;color:#b7770d}

/* ── PAGINACION ── */
.pagination{display:flex;justify-content:center;gap:8px;padding:16px;align-items:center;font-size:.85rem}
.pagination button{border:1px solid #ccd;background:#fff;padding:5px 12px;border-radius:4px;cursor:pointer}
.pagination button:hover{background:#f0f4ff}
.pagination button.active{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.pagination span{color:#888}

/* ── VACÍO / CARGANDO ── */
.empty{text-align:center;padding:48px 20px;color:#aaa}
.spinner{width:32px;height:32px;border:3px solid #e0e4ea;border-top-color:#1a3a5c;border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MODAL DETALLE ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:28px;max-width:800px;width:95%;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal.wide{max-width:1100px}
.modal h2{font-size:1.05rem;color:#1a3a5c;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #eee}
.modal-close{float:right;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#888;line-height:1}
.modal-close:hover{color:#c0392b}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.detail-item label{font-size:.72rem;font-weight:700;color:#888;text-transform:uppercase;display:block;margin-bottom:2px}
.detail-item span{font-size:.88rem;color:#222}
.section-title{font-size:.82rem;font-weight:700;color:#1a3a5c;text-transform:uppercase;margin:16px 0 8px;border-bottom:1px solid #eee;padding-bottom:4px}

/* ── SECCIONES COLAPSABLES TRAZABILIDAD ── */
.traz-section{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px;overflow:hidden}
.traz-section-header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;border-bottom:1px solid #eee;transition:background .15s}
.traz-section-header:hover{background:#f5f8ff}
.traz-section-header h3{font-size:.95rem;font-weight:700;color:#1a3a5c;display:flex;align-items:center;gap:8px}
.traz-section-header .arrow{transition:transform .2s;font-size:.7rem;color:#888}
.traz-section-header.collapsed .arrow{transform:rotate(-90deg)}
.traz-section-body{transition:max-height .3s ease}
.traz-section-body.collapsed{display:none}
.traz-badge-count{font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:12px;background:#e8f0fe;color:#1a5276}
.scan-nums{font-size:.75rem;color:#555;font-family:'Consolas','Courier New',monospace;word-break:break-all;max-width:400px}
.resumen-total td{font-weight:700;background:#f5f8ff;border-top:2px solid #1a3a5c}
.collapsible-toggle{background:none;border:1px solid #ccd;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;color:#555;margin-top:12px}
.collapsible-toggle:hover{background:#f0f4ff}

/* ── ALERTAS ── */
.alert{padding:12px 16px;border-radius:6px;font-size:.85rem;margin-bottom:16px}
.alert.info{background:#e8f4fd;color:#1a5276;border-left:4px solid #2980b9}
.alert.warn{background:#fef9e7;color:#7d6608;border-left:4px solid #f1c40f}

footer{background:#1a3a5c;color:rgba(255,255,255,.5);font-size:.72rem;text-align:center;padding:8px;margin-top:auto}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="loginPage">
  <div class="login-box">
    <h1>Validaciones Almacen</h1>
    <p class="sub">Sistema Cuesto &mdash; SKF</p>
    <label>Correo electronico</label>
    <input type="email" id="loginEmail" placeholder="usuario@empresa.com" autocomplete="username">
    <label>Contrasena</label>
    <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">Iniciar sesion</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="appPage">
  <header>
    <h1>Validaciones Almacen &nbsp;|&nbsp; Cuesto &mdash; SKF</h1>
    <div class="header-right">
      <span class="user-badge" id="headerUser"></span>
      <button class="btn-logout" onclick="doLogout()">Cerrar sesion</button>
    </div>
  </header>

  <nav>
    <button class="active" onclick="switchTab('resumen')">Dashboard</button>
    <button onclick="switchTab('trazabilidad')">Trazabilidad Online</button>
    <button onclick="switchTab('embarques')">Embarques (Sync)</button>
    <button onclick="switchTab('pendientes')">Pendientes</button>
    <button onclick="switchTab('syncstatus')" id="tabSync" style="display:none">Estado Sync</button>
  </nav>

  <!-- Banner de estado de PCs - siempre visible -->
  <div id="pcStatusBar" style="background:#fff;border-bottom:1px solid #e0e4ea;padding:8px 24px;display:flex;gap:24px;align-items:center;font-size:.82rem">
    <span style="font-weight:700;color:#1a3a5c;font-size:.78rem">PCs:</span>
    <span id="pcCuesto" style="color:#888">CUESTO: cargando...</span>
    <span id="pcSKF" style="color:#888">SKF: cargando...</span>
    <span id="pcLastRefresh" style="margin-left:auto;color:#bbb;font-size:.72rem"></span>
  </div>

  <main id="mainContent">
    <div class="spinner"></div>
  </main>
</div>

<!-- ══════════ MODAL DETALLE ══════════ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <div id="modalBody"></div>
  </div>
</div>

<footer>Validaciones Almacen &nbsp;|&nbsp; (c) Corporativo Cuesto &nbsp;|&nbsp; ft AdanEMX</footer>

<script>
// ── CONFIGURACION ──────────────────────────────────────────────────────────────
const API = '';  // mismo origen

function apiFetch(path, opts = {}) {
  const token = localStorage.getItem('val_token');
  return fetch(API + '/api/val' + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
      ...(opts.headers || {})
    }
  }).then(async r => {
    if (r.status === 401) { doLogout(); return null; }
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.error) || r.statusText);
    return data;
  });
}

// ── AUTH ───────────────────────────────────────────────────────────────────────
let currentUser = null;

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try {
    const d = await fetch('/api/val/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    }).then(r => r.json());
    if (!d.token) throw new Error(d.error || 'Error de login');
    localStorage.setItem('val_token', d.token);
    localStorage.setItem('val_user', JSON.stringify(d.user));
    startApp(d.user);
  } catch(e) {
    document.getElementById('loginErr').textContent = e.message;
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') doLogin();
});

function doLogout() {
  localStorage.removeItem('val_token');
  localStorage.removeItem('val_user');
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appPage').style.display = 'none';
  currentUser = null;
}

function startApp(user) {
  currentUser = user;
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'flex';
  document.getElementById('appPage').style.flexDirection = 'column';
  document.getElementById('headerUser').textContent = user.nombre + ' (' + user.role + ')';
  if (user.role === 'admin') document.getElementById('tabSync').style.display = '';
  startPCPolling();
  switchTab('resumen');
}

// Verificar si ya hay sesion activa
(function checkSession() {
  const token = localStorage.getItem('val_token');
  const user  = localStorage.getItem('val_user');
  if (token && user) {
    try { startApp(JSON.parse(user)); } catch(_) { doLogout(); }
  }
})();

// ── NAVEGACION ─────────────────────────────────────────────────────────────────
let activeTab = '';
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => {
    if (b.textContent.toLowerCase().includes(tab === 'resumen' ? 'dashboard' : tab === 'admin' ? 'usuarios' : tab))
      b.classList.add('active');
  });
  const m = document.getElementById('mainContent');
  m.innerHTML = '<div class="spinner"></div>';
  if (tab === 'resumen')       renderResumen();
  if (tab === 'trazabilidad')  renderTrazabilidad();
  if (tab === 'embarques')     renderEmbarques();
  if (tab === 'pendientes')    renderPendientes();
  if (tab === 'syncstatus')    renderSyncStatus();
}

// ── DASHBOARD / RESUMEN ────────────────────────────────────────────────────────
async function renderResumen() {
  const m = document.getElementById('mainContent');
  const [d, embOnline] = await Promise.all([
    apiFetch('/resumen'),
    apiFetch('/embarques-online').catch(() => [])
  ]);
  if (!d) return;

  const skf = d.skf || {};
  const cu  = d.cuesto || {};
  const totalPend = (skf.pendientes_faltante||0)+(skf.pendientes_sin_qry||0)+(cu.pendientes_faltante||0)+(cu.pendientes_sin_qry||0);
  const embEnviados = (embOnline||[]).filter(e => e.estado === 'ENVIADO').length;
  const embValidados = (embOnline||[]).filter(e => e.estado === 'VALIDADO').length;

  // Cargar estado de PCs para el dashboard
  let appsHtml = '';
  try {
    const apps = await apiFetch('/app/status');
    if (apps && apps.length > 0) {
      appsHtml = `
        <h3 style="margin-bottom:14px;color:#1a3a5c;font-size:1rem">Apps Conectadas</h3>
        <div class="kpi-grid" style="margin-bottom:28px">
          ${apps.map(a => {
            const color = a.online ? 'green' : 'red';
            const dot   = a.online ? '🟢' : '🔴';
            const st    = a.online ? 'Online' : 'Offline';
            return `<div class="kpi ${color}">
              <label>${a.side.toUpperCase()}</label>
              <div class="val" style="font-size:1.4rem">${dot} ${st}</div>
              <div class="sub">v${a.version} &nbsp;|&nbsp; ${a.operador || '—'} &nbsp;|&nbsp; ${a.hostname || '—'}</div>
              <div class="sub" style="margin-top:2px;color:#aaa">${a.hace}</div>
            </div>`;
          }).join('')}
        </div>`;
    }
  } catch(_) {}

  m.innerHTML = `
    <div class="alert info">Datos sincronizados desde las apps de escritorio + embarques registrados en tiempo real.</div>

    ${appsHtml}

    <h3 style="margin-bottom:14px;color:#1a3a5c;font-size:1rem">Vista General</h3>
    <div class="kpi-grid">
      <div class="kpi blue">
        <label>Pzas SKF enviadas</label>
        <div class="val">${(skf.pzas_enviadas||0).toLocaleString()}</div>
        <div class="sub">Almacen SKF &rarr; CUESTO</div>
      </div>
      <div class="kpi green">
        <label>Pzas ingresadas CUESTO</label>
        <div class="val">${(cu.pzas_ingresadas||0).toLocaleString()}</div>
        <div class="sub">Recibidas en CUESTO de SKF</div>
      </div>
      <div class="kpi blue">
        <label>Pzas PT CUESTO enviadas</label>
        <div class="val">${(cu.pzas_enviadas||0).toLocaleString()}</div>
        <div class="sub">CUESTO &rarr; SKF</div>
      </div>
      <div class="kpi green">
        <label>Pzas PT recibidas SKF</label>
        <div class="val">${(skf.pzas_recibidas||0).toLocaleString()}</div>
        <div class="sub">Recibidas en SKF de CUESTO</div>
      </div>
      <div class="${totalPend > 0 ? 'kpi red' : 'kpi green'}">
        <label>Pendientes totales</label>
        <div class="val">${totalPend}</div>
        <div class="sub">Faltantes + Sin QRY activos</div>
      </div>
      <div class="kpi">
        <label>Embarques SKF</label>
        <div class="val">${skf.embarques||0}</div>
        <div class="sub">Numeros de embarque registrados</div>
      </div>
      <div class="kpi">
        <label>Embarques CUESTO</label>
        <div class="val">${cu.embarques||0}</div>
        <div class="sub">Codigos de envio registrados</div>
      </div>
      <div class="kpi orange">
        <label>Peso enviado SKF</label>
        <div class="val">${(skf.peso_enviado_kg||0).toLocaleString()}</div>
        <div class="sub">Kg totales de almacen SKF</div>
      </div>
    </div>

    <h3 style="margin:20px 0 14px;color:#1a3a5c;font-size:1rem">Embarques Online (Trazabilidad)</h3>
    <div class="kpi-grid">
      <div class="kpi"><label>Total registrados</label><div class="val">${(embOnline||[]).length}</div><div class="sub">Embarques con UUID</div></div>
      <div class="kpi ${embEnviados > 0 ? 'orange' : 'green'}"><label>En transito</label><div class="val">${embEnviados}</div><div class="sub">Pendientes de validar</div></div>
      <div class="kpi green"><label>Validados</label><div class="val">${embValidados}</div><div class="sub">Recibidos y confirmados</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px">
      <div class="tabla-wrap">
        <div class="tabla-header">
          <h3>Pendientes SKF</h3>
          <span class="tabla-count">${(skf.pendientes_faltante||0)+(skf.pendientes_sin_qry||0)} activos</span>
        </div>
        <table>
          <thead><tr><th>Tipo</th><th>Cantidad</th></tr></thead>
          <tbody>
            <tr><td><span class="badge faltante">FALTANTE</span></td><td>${skf.pendientes_faltante||0}</td></tr>
            <tr><td><span class="badge sin_qry">SIN QRY</span></td><td>${skf.pendientes_sin_qry||0}</td></tr>
          </tbody>
        </table>
      </div>
      <div class="tabla-wrap">
        <div class="tabla-header">
          <h3>Pendientes CUESTO</h3>
          <span class="tabla-count">${(cu.pendientes_faltante||0)+(cu.pendientes_sin_qry||0)} activos</span>
        </div>
        <table>
          <thead><tr><th>Tipo</th><th>Cantidad</th></tr></thead>
          <tbody>
            <tr><td><span class="badge faltante">FALTANTE</span></td><td>${cu.pendientes_faltante||0}</td></tr>
            <tr><td><span class="badge sin_qry">SIN QRY</span></td><td>${cu.pendientes_sin_qry||0}</td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
}

// ── TRAZABILIDAD ONLINE ─────────────────────────────────────────────────────────
let _trazRows = [];

function _extraerTurno(numEmbarque) {
  if (!numEmbarque) return null;
  const m = String(numEmbarque).match(/^(\d+)\./);
  return m ? parseInt(m[1]) : null;
}

async function renderTrazabilidad() {
  const m = document.getElementById('mainContent');
  m.innerHTML = `
    <div class="filtros">
      <div><label>Flujo</label>
        <select id="tFlujo"><option value="">Todos</option><option value="cuesto_a_skf">Cuesto &rarr; SKF</option><option value="skf_a_cuesto">SKF &rarr; Cuesto</option></select>
      </div>
      <div><label>Estado</label>
        <select id="tEstado"><option value="">Todos</option><option value="ENVIADO">Enviado</option><option value="VALIDADO">Validado</option></select>
      </div>
      <div><label>Desde</label><input type="date" id="tDesde"></div>
      <div><label>Hasta</label><input type="date" id="tHasta"></div>
      <div><label>Turno</label>
        <select id="tTurno"><option value="">Todos</option><option value="1">Turno 1 (1.x)</option><option value="2">Turno 2 (2.x)</option><option value="3">Turno 3 (3.x)</option></select>
      </div>
      <button class="btn-buscar" onclick="cargarTrazabilidad()">Buscar</button>
      <button class="btn-clear" onclick="limpiarFiltrosTraz()">Limpiar</button>
    </div>
    <div id="trazTabla"><div class="spinner"></div></div>`;
  cargarTrazabilidad();
}

function limpiarFiltrosTraz() {
  ['tDesde','tHasta'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  ['tFlujo','tEstado','tTurno'].forEach(id => { const el = document.getElementById(id); if (el) el.selectedIndex = 0; });
  cargarTrazabilidad();
}

async function cargarTrazabilidad() {
  const tablaEl = document.getElementById('trazTabla');
  tablaEl.innerHTML = '<div class="spinner"></div>';

  // Traer todos del servidor (filtro flujo/estado server-side)
  const params = new URLSearchParams();
  const flujo  = document.getElementById('tFlujo')?.value;
  const estado = document.getElementById('tEstado')?.value;
  if (flujo)  params.set('flujo', flujo);
  if (estado) params.set('estado', estado);

  const rows = await apiFetch('/embarques-online?' + params.toString());
  if (!rows) return;

  // Filtros client-side: fecha y turno
  const desde = document.getElementById('tDesde')?.value;
  const hasta = document.getElementById('tHasta')?.value;
  const turno = document.getElementById('tTurno')?.value;

  let filtered = rows;
  if (desde) filtered = filtered.filter(r => (r.fecha_envio || '') >= desde);
  if (hasta) filtered = filtered.filter(r => (r.fecha_envio || '') <= hasta);
  if (turno) filtered = filtered.filter(r => _extraerTurno(r.numero_embarque) === parseInt(turno));

  _trazRows = filtered;

  // Separar por flujo
  const skfACue = filtered.filter(r => r.flujo === 'skf_a_cuesto');
  const cueASkf = filtered.filter(r => r.flujo === 'cuesto_a_skf');

  // KPIs
  const skfEnv = skfACue.filter(r => r.estado === 'ENVIADO').length;
  const skfVal = skfACue.filter(r => r.estado === 'VALIDADO').length;
  const cueEnv = cueASkf.filter(r => r.estado === 'ENVIADO').length;
  const cueVal = cueASkf.filter(r => r.estado === 'VALIDADO').length;

  tablaEl.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div style="display:flex;gap:12px">
        <div class="kpi" style="flex:1"><label>SKF &rarr; Cuesto</label><div class="val">${skfACue.length}</div><div class="sub">embarques</div></div>
        <div class="kpi orange" style="flex:1"><label>En transito</label><div class="val">${skfEnv}</div></div>
        <div class="kpi green" style="flex:1"><label>Validados</label><div class="val">${skfVal}</div></div>
      </div>
      <div style="display:flex;gap:12px">
        <div class="kpi" style="flex:1"><label>Cuesto &rarr; SKF</label><div class="val">${cueASkf.length}</div><div class="sub">embarques</div></div>
        <div class="kpi orange" style="flex:1"><label>En transito</label><div class="val">${cueEnv}</div></div>
        <div class="kpi green" style="flex:1"><label>Validados</label><div class="val">${cueVal}</div></div>
      </div>
    </div>

    ${_renderTrazSection('skf_a_cuesto', 'SKF &rarr; Cuesto (material de almacen)', skfACue)}
    ${_renderTrazSection('cuesto_a_skf', 'Cuesto &rarr; SKF (producto terminado)', cueASkf)}
  `;
}

        <div style="display:flex;gap:8px;align-items:center">
          <span class="traz-badge-count">${rows.length} embarques</span>

          ${validados > 0 ? '<span class="badge conforme">' + validados + ' validados</span>' : ''}
        </div>
      </div>
      <div class="traz-section-body" id="body_${id}">
        <div style="overflow-x:auto"><table>
          <thead>
            <tr><th>UUID</th><th>No. Embarque</th><th>Operador</th><th>Fecha</th><th>Hora</th>
            <th>Piezas</th><th>Items</th><th>Estado</th><th>Anomalias</th><th></th></tr>
          </thead>

            ${rows.length === 0 ? '<tr><td colspan="10" class="empty">Sin embarques en este flujo</td></tr>' :
              rows.map(r => {

                return `<tr>
                  <td style="font-size:.75rem;font-family:monospace;color:#1a5276">${r.uuid}</td>

                  <td>${r.operador_envio || '-'}</td>

                  <td style="text-align:right">${r.total_items || 0}</td>
                  <td><span class="badge ${estadoBadge}">${r.estado}</span>${r.operador_recepcion ? '<br><span style="font-size:.7rem;color:#888">' + r.operador_recepcion + '</span>' : ''}</td>

                  <td style="white-space:nowrap"><button style="background:#1a3a5c;color:#fff;border:none;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:.78rem;font-weight:600" onclick="verDetalleTraz('${r.uuid}')">Detalle</button>${currentUser && currentUser.role === 'admin' ? ' <button style="background:#c0392b;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:.75rem;margin-left:4px" onclick="eliminarEmbarque(\'' + r.uuid + '\')">Eliminar</button>' : ''}</td>
                </tr>`;
              }).join('')}
          </tbody>
        </table></div>
      </div>
    </div>`;
}

function toggleTrazSection(id) {
  const body = document.getElementById('body_' + id);
  const arrow = document.getElementById('arrow_' + id);
  if (!body) return;
  body.classList.toggle('collapsed');
  if (arrow) {
    arrow.parentElement.parentElement.classList.toggle('collapsed');
  }
}

// ── DETALLE TRAZABILIDAD (modal extenso con resumen agrupado) ───────────────
async function verDetalleTraz(uuid) {
  const body = document.getElementById('modalBody');
  const modal = document.getElementById('modalContent');
  modal.classList.add('wide');
  body.innerHTML = '<div class="spinner"></div>';
  document.getElementById('modalOverlay').classList.add('open');

  const e = await apiFetch('/embarques-online/' + encodeURIComponent(uuid));
  if (!e) return;

  const flujoLabel = e.flujo === 'cuesto_a_skf' ? 'CUESTO &rarr; SKF' : 'SKF &rarr; CUESTO';
  const items = e.items || [];
  const esSKF = e.flujo === 'skf_a_cuesto';

  // Extraer faltantes/sobrantes del detalle de validacion
  const vd = e.validacion_detalle || {};
  const rawFaltantes = vd.faltantes || [];
  const rawSobrantes = vd.sobrantes || [];

  // Construir set de IDs faltantes para cruzar con items
  // SKF→CUE: faltantes son DISPACHs (strings)
  // CUE→SKF: faltantes son objetos {codigo, ...} o strings
  const faltanteIds = new Set(rawFaltantes.map(f => typeof f === 'string' ? f : (f.codigo || f.DISPACH || '')));

  // Agrupar items por componente + marcar faltantes
  const grupos = {};
  for (const it of items) {
    const comp = (esSKF ? it.COMPONENTE : it.componente) || 'SIN COMPONENTE';
    const qty  = parseInt(esSKF ? (it.QTY || 0) : (it.cantidad || 0)) || 0;
    const scan = esSKF ? (it.DISPACH || '') : (it.codigo || '');
    if (!grupos[comp]) grupos[comp] = { componente: comp, contenedores: 0, piezas: 0, scans: [], faltantes: 0 };
    grupos[comp].contenedores++;
    grupos[comp].piezas += qty;
    if (scan) grupos[comp].scans.push(String(scan));
  }

  // Cruzar faltantes con componentes: buscar en items originales a qué componente pertenece cada faltante
  for (const fId of faltanteIds) {
    if (!fId) continue;
    const itemOrig = items.find(it => (esSKF ? it.DISPACH : it.codigo) === fId);
    if (itemOrig) {
      const comp = (esSKF ? itemOrig.COMPONENTE : itemOrig.componente) || 'SIN COMPONENTE';
      if (grupos[comp]) grupos[comp].faltantes++;
    } else {
      // Faltante sin match en items enviados (puede pasar con datos de QRY)
      // Intentar extraer componente del objeto faltante si es objeto
      const fObj = rawFaltantes.find(f => (typeof f === 'object') && ((f.codigo || f.DISPACH) === fId));
      const comp = fObj ? (fObj.componente || fObj.COMPONENTE || 'SIN COMPONENTE') : 'SIN COMPONENTE';
      if (!grupos[comp]) grupos[comp] = { componente: comp, contenedores: 0, piezas: 0, scans: [], faltantes: 0 };
      grupos[comp].faltantes++;
    }
  }

  const gruposList = Object.values(grupos).sort((a,b) => a.componente.localeCompare(b.componente));
  const totalCont = gruposList.reduce((s,g) => s + g.contenedores, 0);
  const totalPzas = gruposList.reduce((s,g) => s + g.piezas, 0);
  const totalFalt = gruposList.reduce((s,g) => s + g.faltantes, 0);
  const hayDiferencias = rawFaltantes.length > 0 || rawSobrantes.length > 0;

  body.innerHTML = `
    <h2>Detalle: <span style="color:#c0392b;font-family:monospace">${e.uuid}</span></h2>

    <div class="detail-grid">
      <div class="detail-item"><label>Flujo</label><span>${flujoLabel}</span></div>
      <div class="detail-item"><label>No. Embarque</label><span style="font-weight:700;font-size:1.1rem">${e.numero_embarque}</span></div>
      <div class="detail-item"><label>Operador Envio</label><span>${e.operador_envio}</span></div>
      <div class="detail-item"><label>Fecha / Hora Envio</label><span>${e.fecha_envio || '-'} &nbsp; ${e.hora_envio || ''}</span></div>
      <div class="detail-item"><label>Total Piezas</label><span style="font-weight:700;font-size:1.1rem;color:#1a3a5c">${e.total_piezas}</span></div>
      <div class="detail-item"><label>Estado</label><span class="badge ${e.estado==='VALIDADO'?'conforme':'pendiente'}">${e.estado}</span></div>
      ${e.operador_recepcion ? `<div class="detail-item"><label>Operador Recepcion</label><span>${e.operador_recepcion}</span></div>` : ''}
      ${e.fecha_recepcion ? `<div class="detail-item"><label>Fecha Recepcion</label><span>${e.fecha_recepcion} ${e.hora_recepcion || ''}</span></div>` : ''}
      ${e.resultado_validacion ? `<div class="detail-item"><label>Resultado</label><span class="badge ${e.resultado_validacion==='CONFORME'?'conforme':'faltante'}">${e.resultado_validacion}</span></div>` : ''}
    </div>

    ${hayDiferencias ? '<div class="alert warn" style="margin-top:4px"><b>Este embarque tiene diferencias:</b> ' + rawFaltantes.length + ' faltante(s), ' + rawSobrantes.length + ' sobrante(s)</div>' : ''}

    <div class="section-title">Resumen por Componente</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Componente</th><th style="text-align:center">Contenedores</th><th style="text-align:right">Piezas</th><th>Dispatch</th>${hayDiferencias ? '<th style="text-align:center">Faltantes</th>' : ''}</tr></thead>
      <tbody>
        ${gruposList.map(g => {
          const rowStyle = g.faltantes > 0 ? 'background:#fce4e4' : '';
          return `<tr style="${rowStyle}">
          <td style="font-weight:600">${g.componente}${g.faltantes > 0 ? ' <span class="badge faltante" style="margin-left:6px">FALTA</span>' : ''}</td>
          <td style="text-align:center">${g.contenedores}</td>
          <td style="text-align:right;font-weight:600">${g.piezas}</td>
          <td><span class="scan-nums">${g.scans.join(', ')}</span></td>
          ${hayDiferencias ? '<td style="text-align:center;font-weight:700;color:' + (g.faltantes > 0 ? '#c0392b' : '#27ae60') + '">' + g.faltantes + '</td>' : ''}
        </tr>`;}).join('')}
        <tr class="resumen-total">
          <td>TOTAL</td>
          <td style="text-align:center">${totalCont}</td>
          <td style="text-align:right">${totalPzas}</td>
          <td></td>
          ${hayDiferencias ? '<td style="text-align:center;color:#c0392b">' + totalFalt + '</td>' : ''}
        </tr>
      </tbody>
    </table></div>

    ${rawFaltantes.length > 0 ? `
      <div class="section-title" style="color:#c0392b">Material Faltante (${rawFaltantes.length}) &mdash; en QRY pero NO recibido</div>
      <div style="overflow-x:auto"><table>
        <thead><tr style="background:#fce4e4">${esSKF
          ? '<th>Codigo</th><th>Componente</th><th>Lote</th><th>Proceso</th>'
          : '<th>Dispatch</th><th>Componente</th>'
        }</tr></thead>
        <tbody>${rawFaltantes.map(f => {
          if (typeof f === 'object') {
            return '<tr style="background:#fff5f5"><td>' + (f.codigo || f.DISPACH || '-') + '</td><td>' + (f.componente || f.COMPONENTE || '-') + '</td>' + (f.lote ? '<td>' + f.lote + '</td>' : '') + (f.proceso ? '<td>' + f.proceso + '</td>' : '') + '</tr>';
          }
          // faltante es string (DISPACH) - buscar en items el componente
          const itemOrig = items.find(it => (esSKF ? it.DISPACH : it.codigo) === f);
          const comp = itemOrig ? (esSKF ? itemOrig.COMPONENTE : itemOrig.componente) : '-';
          return '<tr style="background:#fff5f5"><td>' + f + '</td><td>' + (comp || '-') + '</td></tr>';
        }).join('')}</tbody>
      </table></div>` : ''}

    ${rawSobrantes.length > 0 ? `
      <div class="section-title" style="color:#e67e22">Material Extra (${rawSobrantes.length}) &mdash; recibido pero NO en QRY</div>
      <div style="overflow-x:auto"><table>
        <thead><tr style="background:#fef3cd"><th>ID</th></tr></thead>
        <tbody>${rawSobrantes.map(s => '<tr style="background:#fffcf0"><td>' + (typeof s === 'object' ? JSON.stringify(s) : s) + '</td></tr>').join('')}</tbody>
      </table></div>` : ''}

    <button class="collapsible-toggle" onclick="toggleItemsDetalle()">Mostrar/Ocultar items individuales (${items.length})</button>
    <div id="itemsDetalleWrap" style="display:none;margin-top:12px">
      <div style="overflow-x:auto"><table>
        <thead><tr>${Object.keys(items[0]||{}).map(k => '<th>'+k+'</th>').join('')}</tr></thead>
        <tbody>${items.map(it => '<tr>' + Object.values(it).map(v => '<td>'+v+'</td>').join('') + '</tr>').join('')}</tbody>
      </table></div>
    </div>`;
}

function toggleItemsDetalle() {
  const el = document.getElementById('itemsDetalleWrap');
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function eliminarEmbarque(uuid) {
  if (!confirm('¿Seguro que desea ELIMINAR el embarque?\n\n' + uuid + '\n\nEsta accion no se puede deshacer.')) return;
  try {
    const r = await apiFetch('/embarques-online/' + encodeURIComponent(uuid), { method: 'DELETE' });
    if (r && r.ok) {
      alert('Embarque eliminado: ' + uuid);
      closeModal();
      cargarTrazabilidad();
    } else {
      alert('Error al eliminar: ' + (r?.error || 'desconocido'));
    }
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

let embPage = 1;
async function renderEmbarques(page = 1) {
  embPage = page;
  const m = document.getElementById('mainContent');

  const desde    = document.getElementById('fDesde')?.value || '';
  const hasta    = document.getElementById('fHasta')?.value || '';
  const operador = document.getElementById('fOperador')?.value || '';

  const side     = document.getElementById('fSide')?.value || '';
  const tipo     = document.getElementById('fTipo')?.value || '';

  if (hasta)    params.set('hasta', hasta);
  if (operador) params.set('operador', operador);
  if (embarque) params.set('embarque', embarque);

              const peso   = r.PESO || r.peso || '-';
              const lote   = r.LOTE || r.lote || '-';
              const oper   = r.OPERADOR || r.operador_envio || r.operador_recepcion || '-';
              const emb    = r['NUMERO EMBARQUE'] || r.numero_embarque || r.codigo_envio || r['CODIGO ENVIO'] || '-';
              const fecha  = r['FECHA ENVIO'] || r.fecha_envio || r.fecha_recepcion || r.fecha || '-';

function clearFiltros() {
  ['fDesde','fHasta','fOperador','fEmbarque'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  ['fSide','fTipo'].forEach(id => {
    const el = document.getElementById(id); if (el) el.selectedIndex = 0;

}

      <tbody>${f1.enviado_skf.registros.map(r => `
        <tr><td>${r['NO. SKF']||'-'}</td><td>${r.COMPONENTE||'-'}</td><td>${r.LOTE||'-'}</td>
        <td>${r.QTY||'-'}</td><td>${r.PESO||'-'}</td><td>${r.DISPACH||'-'}</td><td>${r['FECHA ENVIO']||'-'}</td></tr>`).join('')}
      </tbody>
    </table></div>` : ''}

    ${f2.enviado_cuesto.registros.length > 0 ? `
    <div class="section-title">Piezas PT enviadas por CUESTO (${f2.enviado_cuesto.registros.length})</div>

        <tr><td>${r.codigo||'-'}</td><td>${r.componente||'-'}</td><td>${r.lote||'-'}</td>
        <td>${r.cantidad||'-'}</td><td>${r.proceso||'-'}</td><td>${r.fecha_envio||r.fecha||'-'}</td></tr>`).join('')}

}

// ── PENDIENTES ─────────────────────────────────────────────────────────────────
async function renderPendientes() {
  const m = document.getElementById('mainContent');
  m.innerHTML = `
    <div class="filtros">
      <div><label>Empresa</label>
        <select id="pSide"><option value="">Todos</option><option value="skf">SKF</option><option value="cuesto">CUESTO</option></select>
      </div>
      <div><label>Tipo</label>
        <select id="pTipo"><option value="">Todos</option><option value="FALTANTE">FALTANTE</option><option value="SIN_QRY">SIN QRY</option></select>
      </div>
      <div><label>Estado</label>
        <select id="pEstado"><option value="PENDIENTE">Solo activos</option><option value="">Todos</option><option value="RESUELTO">Resueltos</option></select>
      </div>
      <div><label>Desde</label><input type="date" id="pDesde"></div>
      <div><label>Hasta</label><input type="date" id="pHasta"></div>
      <button class="btn-buscar" onclick="cargarPendientes()">Buscar</button>
    </div>
    <div id="pendTabla"><div class="spinner"></div></div>`;

  cargarPendientes();
}

async function cargarPendientes() {
  const params = new URLSearchParams();
  const side   = document.getElementById('pSide')?.value;
  const tipo   = document.getElementById('pTipo')?.value;
  const estado = document.getElementById('pEstado')?.value;
  const desde  = document.getElementById('pDesde')?.value;
  const hasta  = document.getElementById('pHasta')?.value;
  if (side)   params.set('side', side);
  if (tipo)   params.set('tipo', tipo);
  if (estado) params.set('estado', estado);
  if (desde)  params.set('desde', desde);
  if (hasta)  params.set('hasta', hasta);

  const tablaEl = document.getElementById('pendTabla');
  tablaEl.innerHTML = '<div class="spinner"></div>';

  const rows = await apiFetch('/pendientes?' + params.toString());
  if (!rows) return;

  tablaEl.innerHTML = `
    <div class="tabla-wrap">
      <div class="tabla-header">
        <h3>Pendientes inter-embarque</h3>
        <span class="tabla-count">${rows.length} registros</span>
      </div>
      <div style="overflow-x:auto"><table>
        <thead>
          <tr><th>Empresa</th><th>Tipo</th><th>ID</th><th>Componente</th><th>Lote</th>
          <th>Embarque deteccion</th><th>Fecha</th><th>Estado</th><th>Resolucion</th></tr>
        </thead>
        <tbody>
          ${rows.length === 0 ? '<tr><td colspan="9" class="empty">Sin pendientes</td></tr>' :
            rows.map(r => `<tr>
              <td><span class="badge ${(r._side||'').toLowerCase()}">${r._side||''}</span></td>
              <td><span class="badge ${(r.tipo||'').toLowerCase().replace('_','-')}">${r.tipo||'-'}</span></td>
              <td style="font-size:.78rem">${r.dispach||r.codigo||'-'}</td>
              <td>${r.componente||'-'}</td>
              <td>${r.lote||'-'}</td>
              <td>${r.embarque||'-'}</td>
              <td>${r.fecha_deteccion||'-'}</td>
              <td><span class="badge ${(r.estado||'PENDIENTE').toLowerCase()}">${r.estado||'PENDIENTE'}</span></td>
              <td style="font-size:.78rem">${r.embarque_resolucion||'-'}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

// ── ESTADO PCs CONECTADAS ────────────────────────────────────────────────────
let _pcInterval = null;

async function refreshPCStatus() {
  try {
    const apps = await apiFetch('/app/status');
    if (!apps) return;

    const cuesto = apps.find(a => a.side === 'cuesto');
    const skf    = apps.find(a => a.side === 'skf');

    const elC = document.getElementById('pcCuesto');
    const elS = document.getElementById('pcSKF');

    if (elC) {
      if (cuesto) {
        const dot = cuesto.online ? '🟢' : '🔴';
        const st  = cuesto.online ? 'Online' : 'Offline';
        elC.innerHTML = `${dot} <b>CUESTO</b>: ${st} &nbsp;v${cuesto.version} &nbsp;|&nbsp; ${cuesto.operador || '—'} &nbsp;<span style="color:#aaa">(${cuesto.hace})</span>`;
        elC.style.color = cuesto.online ? '#1e8449' : '#c0392b';
      } else {
        elC.innerHTML = '⚪ <b>CUESTO</b>: sin registro';
        elC.style.color = '#888';
      }
    }

    if (elS) {
      if (skf) {
        const dot = skf.online ? '🟢' : '🔴';
        const st  = skf.online ? 'Online' : 'Offline';
        elS.innerHTML = `${dot} <b>SKF</b>: ${st} &nbsp;v${skf.version} &nbsp;|&nbsp; ${skf.operador || '—'} &nbsp;<span style="color:#aaa">(${skf.hace})</span>`;
        elS.style.color = skf.online ? '#1e8449' : '#c0392b';
      } else {
        elS.innerHTML = '⚪ <b>SKF</b>: sin registro';
        elS.style.color = '#888';
      }
    }

    const elR = document.getElementById('pcLastRefresh');
    if (elR) {
      const now = new Date();
      elR.textContent = `Actualizado: ${now.toLocaleTimeString('es-MX')}`;
    }
  } catch(e) {
    // silenciar errores de red
  }
}

function startPCPolling() {
  refreshPCStatus();
  if (_pcInterval) clearInterval(_pcInterval);
  _pcInterval = setInterval(refreshPCStatus, 15000);  // cada 15s
}

// ── MODAL ──────────────────────────────────────────────────────────────────────
function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalContent').classList.remove('wide');
  }
}
