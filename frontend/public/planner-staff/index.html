  // sub-fields retrolavado
  aplica:'Aplica', realizado:'¿Se realizó?', evidencia_url:'Evidencia URL',
  razones:'Razones', plan_accion:'Plan de acción',
  // resumen sub
  total_paros:'Total paros', total_min:'Minutos totales',
  ots_dia_anterior:'OTs dia anterior', pendientes_global:'Pendientes global',
  items_alerta:'Items en alerta', bajo_minimo:'Bajo mínimo',
  pos_activas:'POs activas', total_items:'Items totales'
};

// Formularios tipo "tarea" que no guardan datos sino que gestionan actividades
var DS_TASK_FORMS = [
  'necesidades_personal','rechazos_cliente','problemas_calidad','liberaciones_pendientes',
  'correctivos_pendientes','preventivo_programado','equipos_criticos','riesgos_falla',
  'refacciones_criticas','compras_urgentes',
  'no_conformidades','8ds_abiertos','documentos_pendientes','indicadores_fuera','cumplimiento_sgc',
  'prioridades_dia','pedidos_criticos',
  'problemas_proceso','estudios_pruebas','mejoras_implementaciones'
];

function dsLabel(k) {
  return DS_LABELS[k] || k.replace(/_/g, ' ').replace(/^\w/, function(c) { return c.toUpperCase(); });
}

function dsVal(val) {
  if (val === true || val === 'true') return '<span style="color:#fff;background:var(--green);padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700">SI</span>';
  if (val === false || val === 'false') return '<span style="color:#fff;background:var(--red);padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700">NO</span>';
  if (val == null || val === '') return '<span style="color:var(--muted)">—</span>';
  if (Array.isArray(val)) {
    if (!val.length) return '<span style="color:var(--muted)">—</span>';
    if (typeof val[0] === 'object') {
      var cols = Object.keys(val[0]);
      return '<table style="font-size:11px;width:100%;margin-top:6px;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:8px;overflow:hidden"><thead><tr>' +
        cols.map(function(c) { return '<th style="text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;color:var(--muted);background:var(--bg);font-weight:700">' + esc(dsLabel(c)) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        val.map(function(row, ri) { return '<tr style="background:' + (ri%2?'var(--bg)':'var(--card)') + '">' + cols.map(function(c) { return '<td style="padding:5px 8px">' + dsVal(row[c]) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table>';
    }
    return esc(val.join(', '));
  }
  if (typeof val === 'object' && val !== null) {
    var entries = Object.entries(val);
    if (!entries.length) return '<span style="color:var(--muted)">—</span>';
    return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:2px">' + entries.map(function(e) {
      return '<span style="background:var(--bg);padding:3px 10px;border-radius:6px;font-size:11px"><b style="color:var(--muted)">' + esc(dsLabel(e[0])) + ':</b> ' + dsVal(e[1]) + '</span>';
    }).join('') + '</div>';
  }
  return esc(String(val));
}

function dsFormBody(datos) {
  var keys = Object.keys(datos).filter(function(k) { return k.charAt(0) !== '_'; });
  if (!keys.length) return '<div style="color:var(--muted);font-size:14px;text-align:center;padding:30px">Sin datos registrados</div>';
  var h = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">';
  keys.forEach(function(k, idx) {
    var val = datos[k];
    var wide = Array.isArray(val) && val.length && typeof val[0] === 'object';
    var isObj = typeof val === 'object' && val !== null && !Array.isArray(val);
    var bg = idx % 2 === 0 ? 'var(--card)' : 'var(--bg)';
    h += '<div style="padding:10px 14px;' + (wide || isObj ? 'grid-column:1/-1;' : '') + 'background:' + bg + ';border-bottom:1px solid var(--line)">' +
      '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:3px">' + esc(dsLabel(k)) + '</div>' +
      '<div style="font-size:13px;font-weight:600">' + dsVal(val) + '</div></div>';
  });
  return h + '</div>';
}

// ── Helpers de presentacion para slides ──
function dsKpiGrid(items) {
  var cols = Math.min(items.length, 4);
  var h = '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:10px;margin-bottom:14px">';
  items.forEach(function(it) {
    var val = it[0], label = it[1], color = it[2] || 'var(--primary)';
    h += '<div style="border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center">' +
      '<div style="font-size:28px;font-weight:800;color:' + color + '">' + val + '</div>' +
      '<div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:4px">' + esc(String(label)) + '</div></div>';
  });
  return h + '</div>';
}
function dsObsBox(text) {
  if (!text) return '';
  return '<div style="padding:10px 14px;background:var(--bg);border-radius:8px;border:1px solid var(--line);margin-top:8px">' +
    '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:3px">Observaciones</div>' +
    '<div style="font-size:13px">' + esc(text) + '</div></div>';
}
function dsCpkBadge(v) {
  if (v == null) return '<span style="color:var(--muted)">—</span>';
  v = Math.round(v * 100) / 100;
  var c = v >= 1.33 ? '#059669' : v >= 1.0 ? '#b45309' : '#b91c1c';
  return '<span style="color:' + c + ';font-weight:700">' + v.toFixed(2) + '</span>';
}

function dsCustomRender(formId, datos) {
  if (!datos || !Object.keys(datos).length) return null;
  var LINEAS = ['Baker', 'L1', 'L3', 'L4'];
  var h = '';

  // ── Per-line cards: eficiencias, piezas_procesadas, rechazos_internos, disponibilidad ──
  var hasLineObj = LINEAS.some(function(l) { return datos[l] !== undefined && typeof datos[l] === 'object'; });
  if (hasLineObj) {
    var isPiezas = formId === 'piezas_procesadas';
    h = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">';
    LINEAS.forEach(function(l) {
      var v = datos[l]; if (!v || typeof v !== 'object') return;
      // Piezas procesadas: rojo/verde vs objetivo
      if (isPiezas) {
        var proc = Number(v.procesadas) || 0;
        var obj = Number(v.objetivo) || 0;
        var okPz = obj > 0 ? proc >= obj : null;
        var borderPz = okPz == null ? '1px solid var(--line)' : okPz ? '2px solid var(--green)' : '2px solid var(--red)';
        var bgPz = okPz == null ? '#f5f7f8' : okPz ? '#f0fdf4' : '#fef2f2';
        h += '<div style="border:' + borderPz + ';border-radius:10px;padding:14px;text-align:center;background:' + bgPz + '">' +
          '<b style="font-size:15px;color:var(--primary)">' + l + '</b>' +
          '<div style="margin-top:8px"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700">Procesadas</div>' +
          '<div style="font-size:32px;font-weight:800;color:' + (okPz ? 'var(--green)' : 'var(--red)') + '">' + proc + '</div></div>' +
          '<div style="margin-top:4px"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700">Objetivo</div>' +
          '<div style="font-size:16px;font-weight:700;color:var(--muted)">' + obj + '</div></div></div>';
      } else {
        h += '<div style="border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center">' +
          '<b style="font-size:15px;color:var(--primary)">' + l + '</b>';
        Object.keys(v).forEach(function(k) {
          var val = v[k];
          var isPct = /eficiencia|calidad|disponibilidad/.test(k);
          var color = isPct ? plannerMetricColor(l, k, val) : 'var(--primary)';
          h += '<div style="margin-top:6px"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700">' + esc(dsLabel(k)) + '</div>' +
            '<div style="font-size:28px;font-weight:800;color:' + color + '">' + val + (isPct ? '%' : '') + '</div></div>';
        });
        h += '</div>';
      }
    });
    h += '</div>';
    return h + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);
  }

  // ── Reprocesos (Baker:1.5 numeros directos) ──
  if (formId === 'reprocesos') {
    h = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">';
    LINEAS.forEach(function(l) {
      if (datos[l] === undefined) return;
      var v = Number(datos[l]) || 0;
      h += '<div style="border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center">' +
        '<b style="font-size:14px;color:var(--primary)">' + l + '</b>' +
        '<div style="font-size:32px;font-weight:800;color:' + (v <= 1 ? 'var(--green)' : v <= 3 ? 'var(--orange)' : 'var(--red)') + ';margin-top:6px">' + v + '%</div></div>';
    });
    h += '</div>';
    return h + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);
  }

  // ── PTAR ──
  if (datos.litros_ingresados_ptar !== undefined) {
    h = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
    [['litros_ingresados_ptar','Lts ingresados PTAR'],['litros_ingresados_pipas','Lts ingresados pipas'],
     ['litros_tratados_ptar','Lts tratados PTAR'],['litros_tratados_salida','Lts tratados salida']].forEach(function(p) {
      h += '<div style="border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center">' +
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700">' + p[1] + '</div>' +
        '<div style="font-size:28px;font-weight:800;color:var(--primary);margin-top:4px">' + (datos[p[0]] || 0) + '</div></div>';
    });
    h += '</div>';
    h += '<section class="planner-lodos-metric"><span>Lodos de PTAR</span><strong>' + plannerFmt(datos.cantidad_lodos_kg, 2) + ' <small>kg</small></strong><p>' + (datos.cantidad_lodos_kg == null ? 'Sin captura de lodos' : 'Cantidad registrada del día') + '</p></section>';
    var r = datos.retrolavado;
    if (r && typeof r === 'object') {
      h += '<div style="padding:12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px">' +
        '<b style="font-size:13px;color:var(--primary)">Retrolavado</b>';
      if (r.aplica === false) h += ' <span style="color:var(--muted);font-size:12px">— No aplica este dia</span>';
      else {
        h += '<div style="margin-top:6px">' + dsVal(r.realizado) + '</div>';
        if (r.razones) h += '<div style="font-size:12px;margin-top:4px"><b>Razones:</b> ' + esc(r.razones) + '</div>';
        if (r.plan_accion) h += '<div style="font-size:12px;margin-top:2px"><b>Plan:</b> ' + esc(r.plan_accion) + '</div>';
      }
      h += '</div>';
    }
    return h;
  }

  // ── Ausentismo KPIs ──
  if (datos.retardos !== undefined && datos.faltas !== undefined) {
    h = dsKpiGrid([
      [datos.retardos||0,'Retardos',datos.retardos>0?'var(--red)':'var(--green)'],
      [datos.faltas||0,'Faltas',datos.faltas>0?'var(--red)':'var(--green)'],
      [datos.vacaciones||0,'Vacaciones','var(--accent)'],
      [datos.incapacidad||0,'Incapacidad',datos.incapacidad>0?'var(--orange)':'var(--green)'],
      [datos.permisos||0,'Permisos','var(--primary)'],
      [datos.otros||0,'Otros','var(--muted)']
    ]);
    return h + dsObsBox(datos.notas);
  }

  // ── Personal disponible ──
  if (datos.requeridos !== undefined && datos.disponibles !== undefined) {
    var pct = datos.porcentaje || 0;
    h = dsKpiGrid([
      [datos.requeridos||0,'Requerido','var(--primary)'],
      [datos.disponibles||0,'Actual','var(--primary)'],
      [pct+'%','% Cobertura',pct>=100?'var(--green)':'var(--red)'],
      [datos.vacantes_abiertas||0,'Vacantes',datos.vacantes_abiertas>0?'var(--red)':'var(--green)']
    ]);
    return h + dsObsBox(datos.detalle);
  }

  // ── Horas extra ──
  if (datos.horas_autorizadas !== undefined && datos.personas !== undefined) {
    h = dsKpiGrid([
      [datos.horas_autorizadas||0,'Hrs. autorizadas','var(--green)'],
      [datos.horas_pendientes||0,'Hrs. pendientes','var(--orange)'],
      [datos.personas||0,'Personas','var(--primary)']
    ]);
    return h + dsObsBox(datos.notas);
  }

  // ── Paros de lineas (con datos guardados por linea) ──
  if (formId === 'paros_lineas' && datos.lineas) {
    var rs = datos.resumen || {};
    h = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">' +
      '<div style="border:2px solid var(--red);border-radius:10px;padding:14px;text-align:center;background:#fef2f2">' +
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700">Total paros</div>' +
        '<div style="font-size:36px;font-weight:800;color:var(--red)">' + (rs.total_paros||0) + '</div></div>' +
      '<div style="border:2px solid var(--red);border-radius:10px;padding:14px;text-align:center;background:#fef2f2">' +
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700">Minutos totales</div>' +
        '<div style="font-size:36px;font-weight:800;color:var(--red)">' + (rs.total_min||0) + '</div></div></div>';
    // Resumen acumulado por linea
    h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">';
    LINEAS.forEach(function(l) {
      var ld = datos.lineas[l];
      var minT = ld ? (ld.minutos_total||0) : 0;
      var cnt = ld ? (ld.total||0) : 0;
      h += '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center">' +
        '<b style="font-size:14px;color:var(--primary)">' + l + '</b>' +
        '<div style="font-size:28px;font-weight:800;color:' + (minT > 0 ? 'var(--red)' : 'var(--green)') + ';margin-top:6px">' + minT + '</div>' +
        '<div style="font-size:10px;color:var(--muted);font-weight:600">min (' + cnt + ' paros)</div>' + (ld?.por_turno || []).map(t => '<div style="font-size:14px;margin-top:8px">' + esc(t.turno) + ': <b>' + t.minutos + ' min</b></div>').join('') + '</div>';
    });
    h += '</div>';
    return h + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);
  }

  // ── Paros falla OTs ──
  if (formId === 'paros_falla' && datos.ordenes) {
    var rs = datos.resumen || {};
    h = dsKpiGrid([[rs.ots_dia_anterior||0,'OTs dia anterior','var(--primary)'],[rs.pendientes_global||0,'Pendientes global','var(--red)']]);
    if (datos.ordenes.length) {
      h += '<table style="font-size:11px;width:100%;margin-bottom:10px"><thead><tr><th>Folio</th><th>Tipo</th><th>Equipo</th><th>Falla</th><th>Urgencia</th><th>Status</th></tr></thead><tbody>' +
        datos.ordenes.map(function(o) { return '<tr><td style="font-family:monospace;font-weight:700">' + esc(o.folio||'') + '</td><td>' + esc(o.tipo||'') + '</td><td>' + esc(o.equipo||'') + '</td><td style="max-width:180px">' + esc(o.falla||'') + '</td><td><span class="badge ' + esc(o.urgencia||'') + '">' + esc(o.urgencia||'') + '</span></td><td><span class="badge ' + (o.status==='cerrada'?'cerrada':o.status==='en_proceso'?'en_proceso':'sin_empezar') + '" style="font-size:10px">' + esc(o.status||'') + '</span></td></tr>'; }).join('') +
        '</tbody></table>';
    } else h += '<div class="empty">Sin OTs registradas</div>';
    return h + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);
  }

  // ── Materias criticas con detalle ──
  if (formId === 'materias_criticas' && datos.items_detalle) {
    var rs = datos.resumen || {};
    h = dsKpiGrid([[rs.fuera_min||0,'Bajo minimo','var(--red)'],[rs.sin_conteo||0,'Sin conteo','var(--orange)'],[rs.items_alerta||0,'Total alertas','var(--primary)']]);
    if (datos.items_detalle.length) {
      h += '<table style="font-size:11px;width:100%;margin-bottom:10px"><thead><tr><th>Item</th><th>Tipo</th><th>Stock</th><th>Min</th><th>Max</th><th>Estado</th></tr></thead><tbody>' +
        datos.items_detalle.map(function(i) { return '<tr><td><b>' + esc(i.nombre||'') + '</b></td><td style="font-size:10px">' + esc(i.tipo||'') + '</td><td style="font-weight:700;color:' + (i.fuera_min?'var(--red)':i.fuera_max?'var(--orange)':'var(--muted)') + '">' + (i.stock!=null?i.stock+' '+esc(i.unidad||''):'—') + '</td><td>' + (i.min!=null?i.min:'—') + '</td><td>' + (i.max!=null?i.max:'—') + '</td><td>' + (i.fuera_min?'<span class="badge atrasada" style="font-size:10px">Bajo min</span>':i.fuera_max?'<span class="badge en_proceso" style="font-size:10px">Sobre max</span>':'<span class="badge sin_empezar" style="font-size:10px">Sin conteo</span>') + '</td></tr>'; }).join('') +
        '</tbody></table>';
    } else h += '<div class="empty">Sin alertas</div>';
    return h + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);
  }

  // ── Ordenes compra con desglose ──
  if (formId === 'ordenes_compra' && datos.por_estatus) return plannerPurchasesHtml(datos) + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);

  // ── Inventarios criticos con detalle ──
  if (formId === 'inventarios_criticos' && datos.items_detalle) {
    var rs = datos.resumen || {};
    h = dsKpiGrid([[rs.bajo_minimo||0,'Bajo minimo','var(--red)']]);
    if (datos.items_detalle.length) {
      h += '<table style="font-size:11px;width:100%;margin-bottom:10px"><thead><tr><th>Material</th><th>Stock</th><th>Minimo</th><th>Deficit</th></tr></thead><tbody>' +
        datos.items_detalle.map(function(i) { return '<tr><td><b>' + esc(i.nombre||'') + '</b></td><td style="color:var(--red);font-weight:700">' + i.stock + ' ' + esc(i.unidad||'') + '</td><td>' + i.min + ' ' + esc(i.unidad||'') + '</td><td style="font-weight:700;color:var(--red)">' + i.deficit + ' ' + esc(i.unidad||'') + '</td></tr>'; }).join('') +
        '</tbody></table>';
    } else h += '<div class="empty">Ningun material bajo minimo</div>';
    return h + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);
  }

  // ── CPK con titulaciones y empaque ──
  if (formId === 'cpk' && (datos.titulaciones || datos.cpk_params || datos.empaque_partes)) {
    if (datos.titulaciones) {
      h += '<h4 style="margin:0 0 8px;font-size:14px;color:var(--primary)">Titulaciones por Proceso</h4>';
      Object.keys(datos.titulaciones).forEach(function(l) {
        var hdrs = datos.titulaciones[l];
        if (!hdrs || !hdrs.length) { h += '<div style="font-size:12px;color:var(--muted);margin-bottom:6px"><b>' + l + ':</b> Sin titulaciones</div>'; return; }
        h += '<div style="margin-bottom:10px;border:1px solid var(--line);border-radius:8px;padding:10px"><b style="color:var(--primary)">' + l + '</b>' +
          '<table style="font-size:11px;margin-top:4px;width:100%"><thead><tr><th>Fecha</th><th>Turno</th><th>#</th><th>Estado</th><th>Params</th><th>Fuera</th></tr></thead><tbody>' +
          hdrs.map(function(r) { return '<tr><td>' + esc(r.fecha||'') + '</td><td>' + esc(r.turno||'') + '</td><td>' + r.numero + '</td><td><span class="badge ' + (r.estado==='completo'?'cerrada':r.estado==='fuera_de_rango'?'atrasada':'sin_empezar') + '" style="font-size:10px">' + esc(r.estado||'') + '</span></td><td>' + r.parametros_total + '</td><td style="color:' + (r.parametros_fuera>0?'var(--red)':'var(--green)') + ';font-weight:700">' + r.parametros_fuera + '</td></tr>'; }).join('') +
          '</tbody></table></div>';
      });
    }
    if (datos.cpk_params && datos.cpk_params.length) {
      h += '<h4 style="margin:12px 0 8px;font-size:14px;color:var(--primary)">CPK Peso Fosfato</h4>' +
        '<table style="font-size:11px;width:100%"><thead><tr><th>Tanque</th><th>n</th><th>Media</th><th>Sigma</th><th>Cp</th><th>Cpk</th></tr></thead><tbody>' +
        datos.cpk_params.map(function(p) { return '<tr><td><b>' + esc(p.tanque||'') + '</b></td><td>' + p.n + '</td><td>' + (p.mean!=null?p.mean:'—') + '</td><td>' + (p.sigma!=null?p.sigma:'—') + '</td><td>' + dsCpkBadge(p.cp) + '</td><td>' + dsCpkBadge(p.cpk) + '</td></tr>'; }).join('') +
        '</tbody></table>';
    }
    if (datos.empaque_partes && datos.empaque_partes.length) {
      h += '<h4 style="margin:12px 0 8px;font-size:14px;color:var(--primary)">CPK Empaque (Tenneco)</h4>' +
        '<table style="font-size:11px;width:100%"><thead><tr><th>N. Parte</th><th>n</th><th>Rug. CPK</th><th>Alt. CPK</th></tr></thead><tbody>' +

// Common presentation and capture helpers.
function plannerFmt(value, decimals = 1) {
  return value == null || value === '' || !Number.isFinite(Number(value)) ? '—' : Number(value).toLocaleString('en-US', { maximumFractionDigits: decimals });
}
function plannerDate(value) {
  return /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? new Date(value + 'T12:00:00Z').toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : 'Sin fecha';
}
function plannerLabel(value) {
  return ({ sin_empezar: 'Por iniciar', en_proceso: 'En proceso', atrasada: 'Vencida', pospuesta: 'Pospuesta', cerrada: 'Cerrada', cancelada: 'Cancelada' })[value] || String(value || '').replaceAll('_', ' ');
}

}
function plannerFormatVisibleNumbers(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    if (node.parentElement.closest('button,input,textarea,select,script,canvas,.planner-slide-comments')) return;
    const match = node.textContent.match(/^(\s*)(-?\d{4,}(?:\.\d+)?)(\s*(?:%|h|min|piezas)?\s*)$/);
    if (match) node.textContent = match[1] + plannerFmt(match[2], 2) + match[3];
  });
}

function plannerCpkCalendarRange(fecha) {
  const day = new Date(fecha + 'T12:00:00Z').getUTCDay();
  const ini = plannerDateShift(fecha, day === 0 ? -6 : 1 - day);
  return { ini, fin: plannerDateShift(ini, 6) };
}
function plannerCpkSlideHtml(slide) {
  const c = slide.cpk;
  const controls = `<div class="planner-period-controls"><div class="planner-actions"><label for="slide_cpk_desde">Desde</label><input type="date" id="slide_cpk_desde" value="${esc(c.range.ini)}"><label for="slide_cpk_hasta">Hasta</label><input type="date" id="slide_cpk_hasta" value="${esc(c.range.fin)}"><button class="btn btn-primary" onclick="refreshPlannerCpkSlide()" ${c.loading ? 'disabled' : ''}>Consultar todos los CPK</button></div></div><p class="planner-help">Un mismo periodo para peso de fosfato, rugosidad y altura axial. Esta consulta no modifica la captura Daily.</p>`;
  let body = c.loading || !c.loaded ? '<div role="status">Consultando todos los CPK…</div>' : c.error ? '<p role="alert" style="color:var(--red)">' + esc(c.error) + '</p>' : `<h3>Periodo consultado: ${plannerDate(c.range.ini)} al ${plannerDate(c.range.fin)}</h3>${dsCustomRender('cpk', { cpk_params: c.data.cpk_params, empaque_partes: c.data.empaque_partes }) || ''}<details style="margin-top:20px"><summary>Titulaciones del mismo periodo</summary>${dsCustomRender('cpk', { titulaciones: c.data.titulaciones }) || '<p>Sin titulaciones en el periodo.</p>'}</details>`;
  if (c.loaded && !c.error && !c.loading && !c.data.cpk_params.length && !c.data.empaque_partes.length) body += '<p class="planner-help">Sin muestras de CPK en el periodo seleccionado.</p>';
  return controls + body + c.notesHtml + c.tasksHtml;
}
async function refreshPlannerCpkSlide(initialSlide) {
  const slide = initialSlide || _ds.slides[_ds.idx];
  if (!slide?.cpk) return;
  const c = slide.cpk;
  const range = initialSlide ? c.range : { ini: document.getElementById('slide_cpk_desde')?.value, fin: document.getElementById('slide_cpk_hasta')?.value };
  if (!range.ini || !range.fin) { alert('Selecciona ambas fechas: Desde y Hasta.'); return; }
  if (range.ini > range.fin) { alert('La fecha Desde no puede ser posterior a la fecha Hasta.'); return; }
  const requestId = (c.requestId || 0) + 1;
  Object.assign(c, { requestId, range, loading: true, error: null });
  slide.html = plannerCpkSlideHtml(slide);
  if (_ds.slides[_ds.idx] === slide) paintSlide();
  try {
    const qs = '?desde=' + encodeURIComponent(range.ini) + '&hasta=' + encodeURIComponent(range.fin);
    const [fosfato, empaque] = await Promise.all([apiFetch('/api/planner/integracion/vales/cpk' + qs), apiFetch('/api/planner/integracion/empaque/cpk' + qs)]);
    if (!fosfato || !empaque) throw new Error('No fue posible consultar todos los CPK. Reintenta.');
    if ([fosfato, empaque].some(data => data.semana?.ini !== range.ini || data.semana?.fin !== range.fin)) throw new Error('Los periodos recibidos no coinciden. Reintenta la consulta.');
    if (c.requestId !== requestId) return;
    c.data = { titulaciones: fosfato.titulaciones || {}, cpk_params: fosfato.cpk_params || [], empaque_partes: (empaque.partes || []).map(p => ({numero_parte:p.numero_parte,muestras:p.muestras,rug_cpk:p.rugosidad?.cpk,rug_na:!!p.rugosidad?.na,alt_cpk:p.altura_axial?.cpk})) };
  } catch (err) {
    if (c.requestId !== requestId) return;
    c.error = err.message;
  }
  if (c.requestId !== requestId) return;
  c.loaded = true; c.loading = false;
  slide.html = plannerCpkSlideHtml(slide);
  if (_ds.slides[_ds.idx] === slide) paintSlide();
}

function plannerDailyCommentField(id, value) {
  return `<div class="form-group planner-comment-field"><label for="${id}">Comentarios para la reunión</label><textarea id="${id}" rows="4" placeholder="Escribe aquí los comentarios que se mostrarán en el slide de este tema.">${esc(value || '')}</textarea><small>Al guardar, estos comentarios aparecen completos en la presentación.</small></div>`;

function plannerSplitSlideNotes(datos) {
  const notes = [];
  function visit(value, path) {
    if (Array.isArray(value)) return value.map((row, i) => visit(row, path.concat(row?.nombre || row?.numero_parte || row?.puesto || row?.cliente || 'Registro ' + (i + 1))));
    if (!value || typeof value !== 'object') return value;
    const result = {};
    for (const [key, entry] of Object.entries(value)) {
      if (['comentarios', 'comentario', 'observaciones', 'observacion', 'notas', 'notes'].includes(key) && typeof entry === 'string') {
        if (entry.trim()) notes.push({ label: [...path, dsLabel(key)].join(' · '), texto: entry });
      } else result[key] = visit(entry, path.concat(dsLabel(key)));
    }
    return result;
  }
  return { datos: visit(datos || {}, []), notes };
}
function plannerSlideNotes(notes, title = 'Comentarios y observaciones') {
  if (!notes.length) return '';
  return `<section class="planner-slide-comments"><h3>${esc(title)}</h3>${notes.map(n => `<article><h4>${esc(n.label)}</h4><div class="planner-comment-text">${plannerComment(n.texto)}</div></article>`).join('')}</section>`;
}
function plannerActivityComments(act) {

}
function plannerPeriodComments(wdata) {
  const rows = (wdata.historico || []).map(r => ({ ...r, notes: plannerSplitSlideNotes(r.datos).notes })).filter(r => r.notes.length);
  if (!rows.length) return '';

    const data = await apiFetch('/api/planner/dashboard/smya?fecha=' + fecha);
    if (document.getElementById('scrapWeeklySummary') !== container || fecha !== _dailyDate) return;
    container.innerHTML = data?.scrap_semana ? plannerScrapSummary(data.scrap_semana) : '<p class="planner-help">No se pudo cargar el avance semanal.</p>';
  } catch (_) {
    if (document.getElementById('scrapWeeklySummary') === container) container.innerHTML = '<p class="planner-help">No se pudo cargar el avance semanal. <button type="button" class="btn btn-outline btn-sm" onclick="refreshScrapSummary()">Reintentar</button></p>';
  }
}
function plannerScrapSummary(week) {
  const rows = week.diario || [], max = Math.max(1, ...rows.map(d => d.piezas || 0));
  return `<section class="planner-scrap-summary"><div class="planner-scrap-title"><span class="planner-eyebrow">SMYA · SCRAP</span><h3>Avance semanal</h3><p>${plannerDate(week.inicio)} al ${plannerDate(week.fin)} · lunes a domingo</p></div>
    <div class="planner-scrap-metrics"><div><span>Scrap del día · ${plannerDate(week.hasta)}</span><strong>${plannerFmt(week.dia, 0)} <small>piezas</small></strong></div><div><span>Acumulado hasta ${plannerDate(week.hasta)}</span><strong>${plannerFmt(week.acumulado, 0)} <small>piezas</small></strong><p>${week.dias_capturados} día(s) con captura</p></div></div>
    <div class="planner-scrap-days" role="list" aria-label="Scrap diario de lunes a domingo">${rows.map(d => `<article role="listitem" class="${d.fecha === week.hasta ? 'selected' : ''}"><span>${new Date(d.fecha + 'T12:00:00Z').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',timeZone:'UTC'})}</span><strong>${plannerFmt(d.piezas, 0)}</strong><div class="planner-scrap-bar" aria-hidden="true"><i style="width:${d.piezas == null ? 0 : d.piezas / max * 100}%"></i></div><small>${d.piezas == null ? 'Sin captura' : 'piezas registradas'}</small><small>Acum. ${plannerFmt(d.acumulado, 0)}</small></article>`).join('')}</div>
    <p class="planner-help">El acumulado suma las capturas desde el lunes hasta la fecha seleccionada. — indica que no hay captura; 0 indica que no hubo scrap.</p></section>`;
}

function plannerSnapshotTable(rows, columns) {
  if (!rows?.length) return '<p class="planner-help">Sin registros en la captura guardada.</p>';
  return '<table><thead><tr>' + columns.map(c => '<th>' + esc(c[1]) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(row => '<tr>' + columns.map(c => '<td>' + esc(String(row[c[0]] ?? '—')) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}
function plannerNumber(id) {
  const value = document.getElementById(id)?.value;
  return value === '' || value == null ? null : Number(value);
}
function plannerDateShift(fecha, dias) {
  const date = new Date(fecha + 'T12:00:00Z');
  date.setUTCDate(date.getUTCDate() + dias);
  return date.toISOString().slice(0, 10);
}
function plannerFormOf(a) {
  return a.correlacion_daily?.formulario || (a.origen_formulario === '8d' ? '8ds_abiertos' : a.origen_formulario);
}
function plannerComment(text) {
  return esc(text).replace(/@\[([^\]]+)\]\((\d+)\)/g, '<span class="planner-mention">@$1</span>');
}
function plannerMetricColor(linea, key, value) {
  const target = _plannerObjectives[linea]?.[key];
  if (value == null || target == null) return 'var(--muted)';
  return Number(value) >= Number(target) ? 'var(--green)' : 'var(--red)';
}
function renderMyTasks(acts) {
  const uid = currentUser.usuario_id;
  const table = (title, rows, sub) => `<section class="planner-task-group"><h3>${title} <span class="badge">${rows.length}</span></h3>${rows.length ? `<table><thead><tr><th>Actividad</th><th>Compromiso</th><th>Estatus</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(sub ? r.nombre : r.titulo)}</b><br><small>${esc(sub ? r.parentTitle + ' · ' + r.id : r.id)}</small></td><td>${esc(r.fecha_compromiso || 'Sin fecha')}</td><td><span class="badge ${r.estatus}">${esc(r.estatus.replaceAll('_', ' '))}</span></td><td><button class="btn btn-outline btn-sm" onclick="${sub ? `openEditSubModal('${r.parentId}','${r.id}')` : `verDetalle('${r.id}')`}">Abrir</button></td></tr>`).join('')}</tbody></table>` : '<p class="empty">Sin actividades en este grupo.</p>'}</section>`;
  const mine = acts.filter(a => a.responsable_id === uid);
  const subs = acts.flatMap(a => (a.mis_subactividades || []).map(s => ({ ...s, parentId: a.id, parentTitle: a.titulo })));
  const collab = acts.filter(a => a.responsable_id !== uid && (a.colaboradores || []).some(c => c.id === uid));
  return table('Mis tareas', mine, false) + table('Mis subtareas', subs, true) + (collab.length ? table('Colaboro en', collab, false) : '');
}
function renderPiezasClientes(container, datos) {
  const clientes = ['SKF', 'Amsted', 'Tenneco'];
  const legacy = ['Baker', 'L1', 'L3', 'L4'].filter(l => datos[l]);
  container.innerHTML = dailyFormWrap('Piezas procesadas por cliente', `
    <p class="planner-help">Captura las cantidades de ${esc(_dailyDate)}. Deja el objetivo vacío cuando no esté definido.</p>
    <div class="planner-metric-grid">${clientes.map(c => `<div class="planner-form-card"><h3>${c}</h3><label>Piezas procesadas</label><input type="number" min="0" id="pz_${c}" value="${datos.clientes?.[c]?.procesadas ?? ''}"><label>Objetivo del día</label><input type="number" min="0" id="obj_${c}" value="${datos.clientes?.[c]?.objetivo ?? ''}"></div>`).join('')}</div>
    ${legacy.length ? `<details><summary>Registro anterior por línea</summary><p>Estos valores se conservan; no se asignan automáticamente a un cliente.</p>${legacy.map(l => `<p>${l}: ${datos[l].procesadas ?? '—'} piezas</p>`).join('')}</details>` : ''}
    <label>Observaciones</label><textarea id="df_obs_pz">${esc(datos.observaciones || '')}</textarea>`, () => ({ ...datos,
      clientes: Object.fromEntries(clientes.map(c => [c, { procesadas: plannerNumber('pz_' + c), objetivo: plannerNumber('obj_' + c) }])),
      observaciones: document.getElementById('df_obs_pz').value.trim()
    }));
}
async function renderReprocesosCalculados(container, datos) {
  const result = await apiFetch('/api/planner/integracion/calidad/reprocesos?fecha=' + _dailyDate);
  if (!result) return;
  const detalle = result.detalle;
  container.innerHTML = dailyFormWrap('Reprocesos del día', `<p class="planner-help">Se calcula con las piezas rechazadas y procesadas del formulario Rechazos internos. Sin denominador se muestra “Sin datos”.</p><div class="planner-metric-grid">${Object.entries(detalle).map(([l, d]) => `<div class="planner-form-card"><h3>${l}</h3><strong class="planner-big-number">${d.porcentaje == null ? '—' : d.porcentaje + '%'}</strong><p>${d.rechazadas ?? '—'} rechazadas / ${d.procesadas ?? '—'} procesadas</p></div>`).join('')}</div><label>Observaciones</label><textarea id="df_obs_rep">${esc(datos.observaciones || '')}</textarea>`, () => ({ detalle, ...Object.fromEntries(Object.entries(detalle).map(([l, d]) => [l, d.porcentaje])), observaciones: document.getElementById('df_obs_rep').value.trim() }));
}
function createDailyTask(depto, form, titulo) {
  const datos = _currentDailyGetData ? _currentDailyGetData() : {};
  openNewActModal({ titulo, descripcion: [datos.que_paso, datos.que_se_hizo, datos.quien_no_cumplio].filter(Boolean).join('\n'), departamento: depto, correlacion_daily: { departamento: depto, formulario: form, fecha: _dailyDate } });
}
function plannerTaskLinksButton(depto, form) {
  return `<div class="planner-actions"><button class="btn btn-accent" onclick="createDailyTask('${depto}','${form}','Seguimiento ${form.replaceAll('_', ' ')}')">Crear actividad de seguimiento</button><button class="btn btn-outline" onclick="viewDailyLinkedTasks('${depto}','${form}')">Ver actividades vinculadas</button></div>`;
}
async function viewDailyLinkedTasks(depto, form) {
  const acts = await apiFetch('/api/planner/actividades?depto=' + depto);
  if (!acts) return;
  const rows = acts.filter(a => plannerFormOf(a) === form);
  document.getElementById('linkedTasksModal')?.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="modal-overlay open" id="linkedTasksModal"><div class="modal-box wide"><div class="modal-header"><h3>Actividades vinculadas</h3><button onclick="closeModal('linkedTasksModal')">Cerrar</button></div><div class="modal-body">${rows.length ? rows.map(a => `<p><button class="btn btn-outline" onclick="closeModal('linkedTasksModal');verDetalle('${a.id}')">${esc(a.id)} · ${esc(a.titulo)}</button> ${esc(a.estatus)}</p>`).join('') : '<p>Sin actividades vinculadas.</p>'}</div></div></div>`);
}
function plannerHistoryMarkup(rows) {
  return rows.map(r => `<article class="planner-history-entry"><div><b>${esc(r.fecha)}</b> · ${esc(r.llenado_por_nombre || '')} <span>${esc(r.formulario || '')}</span></div>${formatDailyDatos(r.datos || {})}${(r.revisiones || []).length ? `<details><summary>${r.revisiones.length} versiones anteriores</summary>${r.revisiones.map(v => `<div class="planner-revision"><b>${esc(v.fecha_llenado)} ${esc(v.hora_llenado)} · ${esc(v.llenado_por_nombre)}</b>${formatDailyDatos(v.datos || {})}</div>`).join('')}</details>` : ''}</article>`).join('');
}
function plannerPresentation(formId, datos) {
  if (formId === 'piezas_procesadas' && datos.clientes) {
    return `<div class="planner-metric-grid">${Object.entries(datos.clientes).map(([cliente, d]) => {
      const defined = d.objetivo != null && d.objetivo > 0 && d.procesadas != null;
      const state = !defined ? 'neutral' : d.procesadas >= d.objetivo ? 'good' : 'bad';
      return `<article class="planner-metric ${state}"><span class="planner-eyebrow">${esc(cliente)}</span><strong>${d.procesadas ?? '—'}</strong><span>piezas procesadas</span><footer>${d.objetivo > 0 ? 'Objetivo ' + d.objetivo : 'Sin objetivo definido'}</footer></article>`;
    }).join('')}</div>` + dsObsBox(datos.observaciones) + dsObsBox(datos.comentarios);
  }
  if (formId === 'reprocesos') return `<div class="planner-metric-grid">${['Baker', 'L1', 'L3', 'L4'].map(l => `<article class="planner-metric neutral"><span class="planner-eyebrow">${l}</span><strong>${datos[l] == null ? '—' : datos[l] + '%'}</strong><span>${datos[l] == null ? 'Sin datos suficientes' : 'Reprocesos'}</span></article>`).join('')}</div>` + dsObsBox(datos.comentarios);
  const result = dsCustomRender(formId, datos) || dsFormBody(datos);
  return result + (datos.comentarios && !result.includes(esc(datos.comentarios)) ? dsObsBox(datos.comentarios) : '');
}
function plannerPeriodControls(depto, idx) {
  return `<div class="planner-period-controls"><label>Periodo <select id="plannerPeriod" onchange="_ds.periodo=this.value;dsLoadWeeklySlide('${depto}',${idx})"><option value="dia" ${_ds.periodo === 'dia' ? 'selected' : ''}>Día</option><option value="semana" ${!_ds.periodo || _ds.periodo === 'semana' ? 'selected' : ''}>Semana</option><option value="mes" ${_ds.periodo === 'mes' ? 'selected' : ''}>Mes</option></select></label><span>Fecha de referencia: ${plannerDate(_ds.fecha)}</span></div>`;
}
function plannerRenderPeriodHistory(wdata) {
  const rows = (wdata.historico || []).filter(r => ['rechazos_cliente', 'problemas_calidad', 'liberaciones_pendientes', 'reprocesos', 'personal_disponible', 'personal_capacitacion', 'incapacidades'].includes(r.formulario));
  return `<details class="planner-period-history"><summary>Registros del periodo · ${rows.length}</summary>${rows.length ? plannerHistoryMarkup(rows) : '<p>Sin registros en el periodo seleccionado.</p>'}</details>`;
}
function plannerParetoChart(element, rows, key, unit) {
  if (!element || !rows.length) return;
  const total = rows.reduce((s, r) => s + Number(r[key] || 0), 0);
  let accum = 0;
  new Chart(element, { type: 'bar', data: { labels: rows.map(r => r.motivo), datasets: [
    { label: unit, data: rows.map(r => r[key]), backgroundColor: '#218b9f', yAxisID: 'y' },
    { label: '% acumulado', type: 'line', data: rows.map(r => { accum += Number(r[key] || 0); return total ? Math.round(accum / total * 1000) / 10 : 0; }), borderColor: '#ce7c28', yAxisID: 'pct', pointRadius: 3 }
  ] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true }, pct: { position: 'right', min: 0, max: 100, grid: { drawOnChartArea: false } } } } });
}
function plannerKpiDatasets(int, labels, key, colors) {
  const rows = int.kpis_por_dia || [];
  return ['Baker', 'L1', 'L3', 'L4'].flatMap(l => [
    { label: l, data: rows.map(d => d.kpis[l]?.[key] ?? null), borderColor: colors[l], backgroundColor: 'transparent', tension: .2, pointRadius: 3, spanGaps: false },
    { label: 'Meta ' + l, data: labels.map(() => int.objetivos?.[l]?.[key] ?? null), borderColor: colors[l], borderDash: [5, 5], pointRadius: 0, borderWidth: 1 }
  ]);
}

// ── Init ─────────────────────────────────────────────────────────────────────
if (typeof Chart !== 'undefined') Chart.defaults.locale = 'en-US';
initApp();
</script>
</body>
</html>
