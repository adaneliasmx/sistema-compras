<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Staff — CUESTO</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--primary:#1a3a5c;--primary-light:#2c5f8a;--accent:#2980b9;--text:#1e1e1e;--muted:#888;--line:#e0e4ea;--green:#27ae60;--red:#c0392b;--orange:#e67e22;--yellow:#f1c40f;--tag-alta:#fce4e4;--tag-media:#fef9e7;--tag-baja:#d5f5e3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--accent);text-decoration:none}

/* Layout */
.app{display:flex;height:100vh}
.sidebar{width:230px;background:var(--primary);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-header{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar-header h2{font-size:15px;font-weight:700;letter-spacing:.5px}
.sidebar-header small{font-size:11px;opacity:.6}
.nav-item{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:background .15s}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:rgba(255,255,255,.15);border-left:3px solid #fff}
.nav-group-title{padding:14px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.45;font-weight:700}
.nav-sub{padding:7px 16px 7px 36px;cursor:pointer;font-size:12px;opacity:.75;transition:background .15s}
.nav-sub:hover{background:rgba(255,255,255,.08);opacity:1}
.nav-sub.active{background:rgba(255,255,255,.12);opacity:1}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;opacity:.5}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-title{font-size:15px;font-weight:700;color:var(--primary)}
.topbar-user{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar-user button{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* Cards & KPIs */
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:var(--card);border-radius:10px;padding:14px 18px;min-width:120px;flex:1;border:1px solid var(--line)}
.kpi label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;color:var(--primary);margin-top:2px}
.kpi .sub{font-size:11px;color:var(--muted)}
.kpi.red .val{color:var(--red)}
.kpi.green .val{color:var(--green)}
.kpi.orange .val{color:var(--orange)}

/* Table */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;font-size:13px}
thead{background:#f0f3f7}
th{padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:hover{background:#f8fafc}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge.alta{background:var(--tag-alta);color:var(--red)}
.badge.media{background:var(--tag-media);color:#b7770d}
.badge.baja{background:var(--tag-baja);color:var(--green)}
.badge.sin_empezar{background:#eaecee;color:#7f8c8d}
.badge.en_proceso{background:#d6eaf8;color:#2471a3}
.badge.cerrada{background:#d5f5e3;color:#1e8449}
.badge.atrasada{background:var(--tag-alta);color:var(--red)}
.badge.pospuesta{background:#f5eef8;color:#7d3c98}
.badge.cancelada{background:#f2f3f4;color:#95a5a6;text-decoration:line-through}

/* Buttons */
.btn{padding:7px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:none;border:1.5px solid var(--line);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:12px}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding:14px;background:var(--card);border-radius:10px;border:1px solid var(--line)}
.filters label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;font-weight:600;text-transform:uppercase}
.filters select,.filters input[type=text],.filters input[type=date]{padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:13px;background:#fff}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--muted);transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:flex-start;padding-top:60px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border-radius:12px;width:95%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box.wide{max-width:900px}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-header h3{font-size:15px;font-weight:700;color:var(--primary)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:0 4px}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Trazabilidad */
.traza-list{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px}
.traza-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
.traza-item:last-child{border-bottom:none}
.traza-fecha{color:var(--muted);white-space:nowrap;min-width:100px}
.traza-user{font-weight:600;min-width:110px;color:var(--primary)}
.traza-detalle{color:var(--text)}

/* Sub-actividades */
.sub-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sub-item{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.sub-item:last-child{border-bottom:none}
.sub-item:hover{background:#f8fafc}

/* Spinner */
.spinner{border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;width:28px;height:28px;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Login */
.login-wrap{display:flex;justify-content:center;align-items:center;height:100vh;background:var(--bg)}
.login-box{background:var(--card);border-radius:14px;padding:36px;width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-box h2{font-size:18px;color:var(--primary);margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:20px}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}

/* Responsive */
@media(max-width:768px){.sidebar{width:56px}.sidebar-header h2,.sidebar-header small,.nav-item span,.nav-sub,.nav-group-title,.sidebar-footer{display:none}.nav-item{justify-content:center;padding:12px}.content{padding:12px}.filters{flex-direction:column}.form-row{grid-template-columns:1fr}.kpi-row{flex-direction:column}}

/* Empty */
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
<script>
const API = '';
let token = localStorage.getItem('planner_token');
let currentUser = null;
let _currentView = 'tareas';
let _currentDepto = '';
let _actividadesCache = [];

// ── Auth ─────────────────────────────────────────────────────────────────────

function apiFetch(path, opts = {}) {
  return fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
      ...(opts.headers || {})
    }
  }).then(async r => {
    if (r.status === 401) { doLogout(); return null; }
    if (r.status === 403) {
      const d = await r.json().catch(() => null);
      alert(d?.error || 'Sin permisos');
      return null;
    }
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.error) || r.statusText);
    return data;
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function tryLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if (!r.ok || !d.token) throw new Error(d.error || 'Error de login');
    token = d.token;
    localStorage.setItem('planner_token', token);
    await initApp();
  } catch (e) {
    document.getElementById('loginErr').textContent = e.message;
  }
}

function doLogout() {
  token = null;
  currentUser = null;
  localStorage.removeItem('planner_token');
  renderLogin();
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h2>Planner Staff</h2>
        <p>Inicia sesion con tu cuenta del sistema</p>
        <div class="form-group"><label>Correo</label><input type="text" id="loginEmail" onkeydown="if(event.key==='Enter')tryLogin()"></div>
        <div class="form-group"><label>Contrasena</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter')tryLogin()"></div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="tryLogin()">Iniciar sesion</button>
        <div class="login-err" id="loginErr"></div>
      </div>
    </div>`;
}

async function initApp() {
  if (!token) return renderLogin();
  try {
    currentUser = await apiFetch('/api/planner/me');
    if (!currentUser) return renderLogin();
    renderApp();
    navigateTo('tareas');
  } catch (e) {
    renderLogin();
  }
}

// ── Layout principal ─────────────────────────────────────────────────────────

const DEPTOS = [
  { id: 'smya', nombre: 'SMYA', icon: '🛡' },
  { id: 'rhh', nombre: 'RHH', icon: '👥' },
  { id: 'produccion', nombre: 'Produccion', icon: '🏭' },
  { id: 'calidad', nombre: 'Calidad', icon: '✅' },
  { id: 'mantenimiento', nombre: 'Mantenimiento', icon: '🔧' },
  { id: 'procesos', nombre: 'Procesos/Ing.', icon: '⚙' },
  { id: 'compras', nombre: 'Compras', icon: '🛒' },
  { id: 'sgc', nombre: 'SGC', icon: '📋' },
  { id: 'operaciones', nombre: 'Operaciones', icon: '📊' }
];

function renderApp() {
  document.getElementById('app').innerHTML = `
    <div class="app">
      <div class="sidebar">
        <div class="sidebar-header">
          <h2>PLANNER</h2>
          <small>Staff CUESTO</small>
        </div>
        <div class="nav-item active" data-view="tareas" onclick="navigateTo('tareas')">
          <span>📋</span> <span>Tareas del STAFF</span>
        </div>
        <div class="nav-group-title">Daily</div>
        ${DEPTOS.map(d => `
          <div class="nav-sub" data-view="daily-${d.id}" onclick="navigateTo('daily-${d.id}')">
            ${d.icon} ${d.nombre}
          </div>
        `).join('')}
        <div class="nav-item" data-view="dashboard" onclick="navigateTo('dashboard')" style="margin-top:8px">
          <span>📊</span> <span>Dashboard</span>
        </div>
        ${currentUser.planner_role === 'admin' ? `
        <div class="nav-item" data-view="equipo" onclick="navigateTo('equipo')" style="margin-top:4px">
          <span>👥</span> <span>Equipo</span>
        </div>` : ''}
        <div class="sidebar-footer">v1.0 — Planner Staff</div>
      </div>
      <div class="main">
        <div class="topbar">
          <div class="topbar-title" id="topbarTitle">Tareas del STAFF</div>
          <div class="topbar-user">
            <span>${esc(currentUser.nombre)}</span>
            <span class="badge ${currentUser.planner_role === 'admin' ? 'en_proceso' : 'sin_empezar'}">${currentUser.planner_role}</span>
            <button onclick="doLogout()">Salir</button>
          </div>
        </div>
        <div class="content" id="mainContent">
          <div class="spinner"></div>
        </div>
      </div>
    </div>`;
}

function navigateTo(view) {
  _currentView = view;
  // Update sidebar active
  document.querySelectorAll('.nav-item,.nav-sub').forEach(el => el.classList.remove('active'));
  const navEl = document.querySelector(`[data-view="${view}"]`);
  if (navEl) navEl.classList.add('active');

  const titles = { tareas: 'Tareas del STAFF', dashboard: 'Dashboard', equipo: 'Gestión de Equipo' };
  if (view.startsWith('daily-')) {
    const d = DEPTOS.find(x => x.id === view.replace('daily-', ''));
    document.getElementById('topbarTitle').textContent = `Daily ${d ? d.nombre : ''}`;
  } else {
    document.getElementById('topbarTitle').textContent = titles[view] || view;
  }

  if (view === 'tareas') renderTareas();
  else if (view === 'dashboard') renderDashboard();
  else if (view === 'equipo') renderEquipo();
  else if (view.startsWith('daily-')) renderDaily(view.replace('daily-', ''));
}

// ── VISTA: Tareas del STAFF ──────────────────────────────────────────────────

async function renderTareas() {
  const m = document.getElementById('mainContent');
  m.innerHTML = `
    <div class="filters">
      <div><label>Departamento</label>
        <select id="fDepto" onchange="cargarActividades()">
          <option value="">Todos</option>
          ${DEPTOS.map(d => `<option value="${d.id}">${d.nombre}</option>`).join('')}
        </select>
      </div>
      <div><label>Estatus</label>
        <select id="fEstatus" onchange="cargarActividades()">
          <option value="">Todos</option>
          <option value="sin_empezar">Sin empezar</option>
          <option value="en_proceso">En proceso</option>
          <option value="cerrada">Cerrada</option>
          <option value="atrasada">Atrasada</option>
          <option value="pospuesta">Pospuesta</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
      <div><label>Urgencia</label>
        <select id="fUrgencia" onchange="cargarActividades()">
          <option value="">Todas</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
      <div><label>Buscar</label><input type="text" id="fBuscar" placeholder="ID, titulo, responsable..." onkeydown="if(event.key==='Enter')cargarActividades()"></div>
      <button class="btn btn-primary btn-sm" onclick="cargarActividades()">Buscar</button>
      <button class="btn btn-outline btn-sm" onclick="limpiarFiltros()">Limpiar</button>
      <div style="margin-left:auto"><button class="btn btn-accent" onclick="openNewActModal()">+ Nueva Actividad</button></div>
    </div>
    <div id="kpisRow"></div>
    <div id="tareasTabla"><div class="spinner"></div></div>`;

  if (_currentDepto) {
    const sel = document.getElementById('fDepto');
    if (sel) sel.value = _currentDepto;
  }
  cargarActividades();
}

function limpiarFiltros() {
  ['fDepto', 'fEstatus', 'fUrgencia'].forEach(id => { const el = document.getElementById(id); if (el) el.selectedIndex = 0; });
  const buscar = document.getElementById('fBuscar'); if (buscar) buscar.value = '';
  _currentDepto = '';
  cargarActividades();
}

async function cargarActividades() {
  const tabla = document.getElementById('tareasTabla');
  if (tabla) tabla.innerHTML = '<div class="spinner"></div>';

  const params = new URLSearchParams();
  const depto = document.getElementById('fDepto')?.value;
  const estatus = document.getElementById('fEstatus')?.value;
  const urgencia = document.getElementById('fUrgencia')?.value;
  const buscar = document.getElementById('fBuscar')?.value;
  if (depto) params.set('depto', depto);
  if (estatus) params.set('estatus', estatus);
  if (urgencia) params.set('urgencia', urgencia);
  if (buscar) params.set('buscar', buscar);

  const data = await apiFetch('/api/planner/actividades?' + params.toString());
  if (!data) return;
  _actividadesCache = data;

  // KPIs
  const kpisEl = document.getElementById('kpisRow');
  if (kpisEl) {
    const total = data.length;
    const sinEmp = data.filter(a => a.estatus === 'sin_empezar').length;
    const enProc = data.filter(a => a.estatus === 'en_proceso').length;
    const cerradas = data.filter(a => a.estatus === 'cerrada').length;
    const atrasadas = data.filter(a => a.estatus === 'atrasada').length;
    kpisEl.innerHTML = `
      <div class="kpi-row">
        <div class="kpi"><label>Total</label><div class="val">${total}</div></div>
        <div class="kpi"><label>Sin empezar</label><div class="val">${sinEmp}</div></div>
        <div class="kpi orange"><label>En proceso</label><div class="val">${enProc}</div></div>
        <div class="kpi green"><label>Cerradas</label><div class="val">${cerradas}</div></div>
        <div class="kpi red"><label>Atrasadas</label><div class="val">${atrasadas}</div></div>
      </div>`;
  }

  if (!tabla) return;
  if (data.length === 0) {
    tabla.innerHTML = '<div class="empty">No hay actividades que mostrar</div>';
    return;
  }

  tabla.innerHTML = `
    <table>
      <thead><tr>
        <th>ID</th><th>Actividad</th><th>Responsable</th><th>Depto</th><th>Compromiso</th><th>Urgencia</th><th>Estatus</th><th>Avance</th><th></th>
      </tr></thead>
      <tbody>
        ${data.map(a => {
          const deptoName = (DEPTOS.find(d => d.id === a.departamento) || {}).nombre || a.departamento;
          const dailyTag = a.correlacion_daily ? `<br><span style="font-size:10px;color:var(--accent)">[Daily: ${a.correlacion_daily.departamento}]</span>` : '';
          return `<tr>
            <td style="font-family:monospace;font-size:12px;font-weight:700;color:var(--primary)">${esc(a.id)}</td>
            <td><b>${esc(a.titulo)}</b>${dailyTag}</td>
            <td>${esc(a.responsable_nombre)}</td>
            <td style="font-size:12px">${esc(deptoName)}</td>
            <td style="font-size:12px;white-space:nowrap">${a.fecha_compromiso || '<span style="color:var(--muted)">—</span>'}</td>
            <td><span class="badge ${a.urgencia}">${a.urgencia}</span></td>
            <td><span class="badge ${a.estatus}">${a.estatus.replace('_', ' ')}</span></td>
            <td style="text-align:center">${a.avance}%</td>
            <td style="white-space:nowrap">
              <button class="btn btn-primary btn-sm" onclick="verDetalle('${a.id}')">Detalle</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// ── MODAL: Nueva Actividad ───────────────────────────────────────────────────

let _staffDisponibles = [];

async function openNewActModal(presets) {
  if (!_staffDisponibles.length) {
    _staffDisponibles = await apiFetch('/api/planner/staff/disponibles') || [];
  }
  const p = presets || {};
  window._newActPresets = p;

  const html = `
    <div class="modal-overlay open" id="newActModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Nueva Actividad</h3>
          <button class="modal-close" onclick="closeModal('newActModal')">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Actividad *</label>
            <input type="text" id="naTitle" value="${esc(p.titulo || '')}">
          </div>
          <div class="form-group">
            <label>Descripcion</label>
            <textarea id="naDesc">${esc(p.descripcion || '')}</textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Responsable *</label>
              <select id="naResp">
                <option value="">Seleccionar...</option>
                ${_staffDisponibles.map(s => `<option value="${s.id}" ${p.responsable_id === s.id ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Departamento *</label>
              <select id="naDepto">

async function saveNewAct(sendEmail) {
  const titulo = document.getElementById('naTitle').value.trim();
  const descripcion = document.getElementById('naDesc').value.trim();
  const responsable_id = Number(document.getElementById('naResp').value);
  const departamento = document.getElementById('naDepto').value;
  const fecha_compromiso = document.getElementById('naFecha').value || null;
  const urgencia = document.getElementById('naUrg').value;

  if (!titulo || !responsable_id || !departamento) {
    document.getElementById('naErr').textContent = 'Completa los campos obligatorios';
    return;
  }

  try {
    const act = await apiFetch('/api/planner/actividades', {
      method: 'POST',
      body: JSON.stringify({ titulo, descripcion, responsable_id, departamento, fecha_compromiso, urgencia, correlacion_daily: window._newActPresets?.correlacion_daily || null })
    });
    if (!act) return;

    if (sendEmail) {
      const r = await apiFetch(`/api/planner/actividades/${act.id}/mailto?accion=Nueva+actividad+asignada`);
      if (r && r.mailto) window.open(r.mailto, '_blank');
    }

    closeModal('newActModal');
    alert('Actividad creada: ' + act.id);
    if (_currentView === 'tareas') cargarActividades();
  } catch (e) {
    document.getElementById('naErr').textContent = e.message;
  }
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

const VALID_URGENCIAS = ['alta', 'media', 'baja'];
const VALID_ESTADOS = ['sin_empezar', 'en_proceso', 'cerrada', 'atrasada', 'pospuesta', 'cancelada'];

async function guardarDetalle(actId) {
  const titulo = document.getElementById('deTitulo').value.trim();
  const estatus = document.getElementById('deEstatus').value;
  const urgencia = document.getElementById('deUrg').value;
  const avance = Number(document.getElementById('deAvance').value);
  const fecha_compromiso = document.getElementById('deFecha').value || null;
  const fecha_inicio = document.getElementById('deFechaInicio').value || null;
  const fecha_fin = document.getElementById('deFechaFin').value || null;

  if (!titulo) { alert('El titulo no puede estar vacio'); return; }

  try {
    const r = await apiFetch('/api/planner/actividades/' + actId, {
      method: 'PATCH',
      body: JSON.stringify({ titulo, estatus, urgencia, avance, fecha_compromiso, fecha_inicio, fecha_fin })
    });
    if (!r) return;

    if (r.mailto) {
      if (confirm('Se actualizo la actividad. ¿Desea enviar correo de notificacion al responsable?')) {
        window.open(r.mailto, '_blank');
      }
    }

    closeModal('detalleModal');
    if (_currentView === 'tareas') cargarActividades();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function enviarCorreo(actId) {
  try {
    const r = await apiFetch(`/api/planner/actividades/${actId}/mailto?accion=Actualizacion+de+actividad`);
    if (r && r.mailto) window.open(r.mailto, '_blank');
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function eliminarActividad(actId) {
  if (!confirm('¿Eliminar actividad ' + actId + '? Esta accion no se puede deshacer.')) return;
  try {
    const r = await apiFetch('/api/planner/actividades/' + actId, { method: 'DELETE' });
    if (r && r.ok) {
      closeModal('detalleModal');
      alert('Actividad eliminada');
      if (_currentView === 'tareas') cargarActividades();
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

  try {
    await apiFetch(`/api/planner/actividades/${actId}/sub`, {

function getDailyForms(deptoId) {
  return DAILY_FORMS_META[deptoId] || null;
}

async function renderDaily(deptoId) {
  _dailyDepto = deptoId;
  _dailyDate = _dailyDate || yesterdayMx();
  _dailyActiveForm = '';
  _dailyRegistro = null;

  const forms = getDailyForms(deptoId);
  if (!forms) {
    renderDailyPlaceholder(deptoId);
    return;
  }

  const m = document.getElementById('mainContent');
  m.innerHTML = '<div class="spinner"></div>';

  _dailyResumen = await apiFetch(`/api/planner/daily/${deptoId}/resumen?fecha=${_dailyDate}`);
  if (!_dailyResumen) return;

  const d = DEPTOS.find(x => x.id === deptoId);
  const llenados = _dailyResumen.formularios.filter(f => f.llenado).length;
  const total = _dailyResumen.formularios.length;

  m.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap">
      <div class="form-group" style="margin:0">
        <label>Fecha</label>
        <input type="date" id="dailyDatePick" value="${_dailyDate}" onchange="_dailyDate=this.value;renderDaily('${deptoId}')" style="padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:13px">
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:24px">${d ? d.icon : ''}</span>
        <span style="font-weight:700;font-size:15px;color:var(--primary)">${d ? d.nombre : deptoId}</span>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <span class="badge ${llenados === total ? 'cerrada' : llenados > 0 ? 'en_proceso' : 'sin_empezar'}" style="font-size:12px;padding:5px 12px">
          ${llenados}/${total} formularios
        </span>
      </div>
    </div>
    <div class="tabs" id="dailyTabs">
      ${forms.map(f => {
        const info = _dailyResumen.formularios.find(x => x.id === f.id);
        const dot = info && info.llenado ? '🟢' : '⚪';
        return `<div class="tab" data-form="${f.id}" onclick="selectDailyForm('${deptoId}','${f.id}')">${dot} ${f.icon} ${f.nombre}</div>`;
      }).join('')}
    </div>
    <div id="dailyFormContent">
      <div class="empty">Selecciona un formulario arriba</div>
    </div>`;
}

function todayMx() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
}
function yesterdayMx() {
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Mexico_City' }));
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

async function selectDailyForm(deptoId, formId) {
  _dailyActiveForm = formId;
  document.querySelectorAll('#dailyTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.form === formId));

  const container = document.getElementById('dailyFormContent');
  container.innerHTML = '<div class="spinner"></div>';

  const data = await apiFetch(`/api/planner/daily/${deptoId}/${formId}?fecha=${_dailyDate}`);
  if (!data) return;
  _dailyRegistro = data.registro;

  // Render form based on department + form
  if (deptoId === 'smya') renderSmyaForm(formId, container);
  else if (deptoId === 'rhh') renderRhhForm(formId, container);
  else if (deptoId === 'produccion') renderProduccionForm(formId, container);
  else if (deptoId === 'calidad') renderCalidadForm(formId, container);
  else if (deptoId === 'mantenimiento') renderMantenimientoForm(formId, container);
  else if (deptoId === 'compras') renderComprasForm(formId, container);
  else if (deptoId === 'procesos') renderProcesosForm(formId, container);
  else if (deptoId === 'sgc') renderSgcForm(formId, container);
  else if (deptoId === 'operaciones') renderOperacionesForm(formId, container);
  else container.innerHTML = '<div class="empty">Formulario no disponible aun</div>';
}

async function renderPtarForm(container, datos) {
  if (!_ptarConfig) {
    _ptarConfig = await apiFetch('/api/planner/config/ptar');
  }
  const diasRetro = (_ptarConfig && _ptarConfig.dias_retrolavado) || [1, 3, 5];
  const dayNames = ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'];
  const dateObj = new Date(_dailyDate + 'T12:00:00');
  const dayOfWeek = dateObj.getDay();
  const retroAplica = diasRetro.includes(dayOfWeek);
  const retro = datos.retrolavado || {};

  container.innerHTML = dailyFormWrap('PTAR — Planta de Tratamiento de Aguas Residuales', `
    <div class="form-row">
      <div class="form-group">
        <label>Litros ingresados PTAR</label>
        <input type="number" id="df_lit_ing_ptar" min="0" value="${datos.litros_ingresados_ptar || 0}">
      </div>
      <div class="form-group">
        <label>Litros ingresados pipas</label>
        <input type="number" id="df_lit_ing_pipas" min="0" value="${datos.litros_ingresados_pipas || 0}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Litros tratados PTAR</label>
        <input type="number" id="df_lit_trat_ptar" min="0" value="${datos.litros_tratados_ptar || 0}">
      </div>
      <div class="form-group">
        <label>Litros tratados salida</label>
        <input type="number" id="df_lit_trat_sal" min="0" value="${datos.litros_tratados_salida || 0}">
      </div>
    </div>

    <div style="margin-top:16px;padding:14px;border:1.5px solid ${retroAplica ? 'var(--accent)' : 'var(--line)'};border-radius:8px;background:${retroAplica ? '#eaf2f8' : '#f8fafc'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b style="font-size:13px;color:var(--primary)">Retrolavado</b>
        <span class="badge ${retroAplica ? 'en_proceso' : 'sin_empezar'}" style="font-size:11px">
          ${retroAplica ? 'Aplica hoy (' + dayNames[dayOfWeek] + ')' : 'No aplica hoy (' + dayNames[dayOfWeek] + ')'}
        </span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
        Dias programados: ${diasRetro.map(d => dayNames[d]).join(', ')}
        <button class="btn btn-outline btn-sm" onclick="openPtarConfigModal()" style="margin-left:8px;font-size:10px">Configurar</button>
      </div>
      ${retroAplica ? `
        <div class="form-group">
          <label>¿Se realizo el retrolavado?</label>
          <select id="df_retro_realizado" onchange="toggleDailyFields('df_retro_realizado','df_retro_no_block',true)">
            <option value="true" ${retro.realizado !== false ? 'selected' : ''}>Si</option>
            <option value="false" ${retro.realizado === false ? 'selected' : ''}>No</option>
          </select>
        </div>
        <div class="form-group">
          <label>Evidencia (URL)</label>
          <input type="text" id="df_retro_evidencia" value="${esc(retro.evidencia_url || '')}" placeholder="https://onedrive.com/...">
        </div>
        <div id="df_retro_no_block" style="display:${retro.realizado === false ? 'block' : 'none'}">
          <div class="form-group">
            <label>Razones por las que no se realizo</label>
            <textarea id="df_retro_razones" rows="2">${esc(retro.razones || '')}</textarea>
          </div>
          <div class="form-group">
            <label>Plan de accion</label>
            <textarea id="df_retro_plan" rows="2">${esc(retro.plan_accion || '')}</textarea>
          </div>
        </div>
      ` : `<div style="font-size:12px;color:var(--muted)">El retrolavado no esta programado para este dia.</div>`}
    </div>
  `, () => {
    const result = {
      litros_ingresados_ptar: Number(document.getElementById('df_lit_ing_ptar').value) || 0,
      litros_ingresados_pipas: Number(document.getElementById('df_lit_ing_pipas').value) || 0,
      litros_tratados_ptar: Number(document.getElementById('df_lit_trat_ptar').value) || 0,
      litros_tratados_salida: Number(document.getElementById('df_lit_trat_sal').value) || 0,
      retrolavado: {}
    };
    if (retroAplica) {
      result.retrolavado = {
        aplica: true,
        realizado: document.getElementById('df_retro_realizado').value === 'true',
        evidencia_url: document.getElementById('df_retro_evidencia')?.value?.trim() || '',
        razones: document.getElementById('df_retro_razones')?.value?.trim() || '',
        plan_accion: document.getElementById('df_retro_plan')?.value?.trim() || ''
      };
    } else {
      result.retrolavado = { aplica: false };
    }
    return result;
  });
}

function openPtarConfigModal() {
  const cfg = (_ptarConfig && _ptarConfig.dias_retrolavado) || [1, 3, 5];
  const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado'];
  const html = `
    <div class="modal-overlay open" id="ptarConfigModal" style="z-index:1100">
      <div class="modal-box" style="max-width:400px">
        <div class="modal-header">
          <h3>Config. Retrolavado PTAR</h3>
          <button class="modal-close" onclick="closeModal('ptarConfigModal')">&times;</button>
        </div>
        <div class="modal-body">
          <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Selecciona los dias de la semana en que aplica retrolavado:</p>
          ${dayNames.map((name, i) => `
            <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;cursor:pointer">
              <input type="checkbox" class="ptarDayChk" value="${i}" ${cfg.includes(i) ? 'checked' : ''}>
              ${name}
            </label>
          `).join('')}
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal('ptarConfigModal')">Cancelar</button>
          <button class="btn btn-primary" onclick="savePtarConfig()">Guardar</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function savePtarConfig() {
  const checked = [...document.querySelectorAll('.ptarDayChk:checked')].map(c => Number(c.value));
  try {
    const r = await apiFetch('/api/planner/config/ptar', {
      method: 'PATCH',
      body: JSON.stringify({ dias_retrolavado: checked })
    });
    if (r && r.ok) {
      _ptarConfig = r.config_ptar;
      closeModal('ptarConfigModal');
      selectDailyForm(_dailyDepto, 'ptar');
    }
  } catch (e) { alert(e.message); }
}

const STATUS_LABELS = {
  retardo: 'Retardo', falta: 'Falta', vacaciones: 'Vacaciones', incapacidad: 'Incapacidad',
  permiso: 'Permiso', permiso_con_goce: 'Permiso C/G', permiso_sin_goce: 'Permiso S/G',
  tiempo_extra: 'Tiempo Extra', cumpleanos: 'Cumpleaños'
};

async function _loadRhhAusentismo() {
  const data = await apiFetch('/api/planner/integracion/rhh/ausentismo?fecha=' + _dailyDate);
  if (!data) return;
  const { registros, resumen } = data;

  // Update KPI counters
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('df_kpi_retardos', resumen.retardo || 0);
  set('df_kpi_faltas', resumen.falta || 0);
  set('df_kpi_vac', resumen.vacaciones || 0);
  set('df_kpi_incap', resumen.incapacidad || 0);
  const permisos = (resumen.permiso || 0) + (resumen.permiso_con_goce || 0) + (resumen.permiso_sin_goce || 0);
  set('df_kpi_perm', permisos);
  const otros = (resumen.tiempo_extra || 0) + (resumen.cumpleanos || 0);
  set('df_kpi_otros', otros);

  // Hidden inputs
  const si = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  si('df_retardos', resumen.retardo || 0);
  si('df_faltas', resumen.falta || 0);
  si('df_vacaciones', resumen.vacaciones || 0);
  si('df_incapacidad', resumen.incapacidad || 0);
  si('df_permisos', permisos);
  si('df_otros', otros);
  si('df_registros_json', JSON.stringify(registros));

  // Build table
  const tbl = document.getElementById('df_ausen_table');
  if (tbl) {
    if (registros.length === 0) {
      tbl.innerHTML = '<p style="color:var(--green);font-weight:600">Sin incidencias registradas para este dia</p>';
    } else {
      tbl.innerHTML = '<table style="width:100%;font-size:12px"><thead><tr><th>Nombre</th><th>Puesto</th><th>Incidencia</th><th>Notas</th></tr></thead><tbody>' +
        registros.map(r => '<tr><td><strong>' + esc(r.nombre) + '</strong></td><td style="color:var(--muted)">' + esc(r.puesto_nombre || '') + '</td><td><span class="badge atrasada" style="font-size:10px">' + (STATUS_LABELS[r.status] || r.status) + '</span></td><td style="color:var(--muted);font-size:11px">' + esc(r.notes || '') + '</td></tr>').join('') +
        '</tbody></table>';
    }
  }
}

async function _loadRhhPlantilla() {
  const data = await apiFetch('/api/planner/integracion/rhh/plantilla');
  if (!data) return;
  const { puestos, resumen } = data;

  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('df_kpi_req', resumen.total_requerido);
  set('df_kpi_act', resumen.total_actual);
  set('df_kpi_cob', resumen.porcentaje_global + '%');
  const cobEl = document.getElementById('df_kpi_cob');
  if (cobEl) cobEl.style.color = resumen.porcentaje_global >= 100 ? 'var(--green)' : 'var(--red)';
  set('df_kpi_vacantes', resumen.vacantes_abiertas);

  const si = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  si('df_requeridos', resumen.total_requerido);
  si('df_disponibles', resumen.total_actual);
  si('df_vacantes_ab', resumen.vacantes_abiertas);

  const tbl = document.getElementById('df_plantilla_table');
  if (tbl) {
    const vacantes = puestos.filter(p => p.vacantes_abiertas > 0);
    if (vacantes.length === 0) {
      tbl.innerHTML = '<p style="color:var(--green);font-weight:600">Plantilla completa — sin vacantes abiertas</p>';
    } else {
      tbl.innerHTML = '<table style="width:100%;font-size:12px"><thead><tr><th>Puesto</th><th>Depto</th><th style="text-align:center">Req</th><th style="text-align:center">Act</th><th style="text-align:center">%</th><th style="text-align:center">Vacantes</th></tr></thead><tbody>' +
        vacantes.map(p => '<tr><td><strong>' + esc(p.puesto) + '</strong></td><td style="color:var(--muted)">' + esc(p.departamento) + '</td><td style="text-align:center">' + p.requerido + '</td><td style="text-align:center">' + p.actual + '</td><td style="text-align:center;color:' + (p.porcentaje >= 100 ? 'var(--green)' : 'var(--red)') + ';font-weight:700">' + p.porcentaje + '%</td><td style="text-align:center;color:var(--red);font-weight:700">' + p.vacantes_abiertas + '</td></tr>').join('') +
        '</tbody></table>';
    }
  }
}

async function _loadRhhVacantes() {
  const data = await apiFetch('/api/planner/integracion/rhh/plantilla');
  if (!data) return;
  const vacantes = data.puestos.filter(p => p.vacantes_abiertas > 0);
  const list = document.getElementById('df_vacantes_list');
  if (!list) return;
  list.innerHTML = '';
  vacantes.forEach(v => {
    for (let i = 0; i < v.vacantes_abiertas; i++) {
      list.insertAdjacentHTML('beforeend', vacantRow(0, { puesto: v.puesto + ' (' + v.departamento + ')', fecha_apertura: '', prioridad: 'media' }));
    }
  });
  if (vacantes.length === 0) {
    list.innerHTML = '<p style="color:var(--green);font-size:12px">Sin vacantes abiertas segun plantilla</p>';
  }
}

async function _loadRhhHorasExtra() {
  const data = await apiFetch('/api/planner/integracion/rhh/horas-extra?fecha=' + _dailyDate);
  if (!data) return;

  const si = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  si('df_total_he', (resumen.horas_autorizadas || 0) + (resumen.horas_pendientes || 0));
  si('df_personas_he', resumen.total || 0);
  si('df_hrs_aut', resumen.horas_autorizadas || 0);

  if (tbl) {

      tbl.innerHTML = '<p style="font-size:11px;color:var(--muted);margin-bottom:6px">Semana: ' + data.semana.inicio + ' a ' + data.semana.fin + '</p>' +
        '<table style="width:100%;font-size:12px"><thead><tr><th>Nombre</th><th>Fecha</th><th>Horas</th><th>Razon</th><th>Status</th></tr></thead><tbody>' +
        registros.map(r => '<tr><td><strong>' + esc(r.nombre) + '</strong></td><td>' + r.fecha + '</td><td style="font-weight:700">' + r.horas + 'h</td><td style="color:var(--muted)">' + esc(r.razon || '') + '</td><td><span class="badge ' + statusBadge(r.status) + '" style="font-size:10px">' + r.status + '</span></td></tr>').join('') +
        '</tbody></table>';

async function renderCpkForm(container) {
  const datos = (_dailyRegistro && _dailyRegistro.datos) || {};
  container.innerHTML = '<div class="spinner"></div>';
  const [cpkData, empData] = await Promise.all([
    apiFetch('/api/planner/integracion/vales/cpk'),
    apiFetch('/api/planner/integracion/empaque/cpk')
  ]);
  const tits = cpkData ? cpkData.titulaciones : {};
  const cpkParamsList = cpkData ? (cpkData.cpk_params || []) : [];
  const cpkSemana = cpkData && cpkData.semana ? cpkData.semana : null;
  const empPartes = empData ? empData.partes : [];
  const lineas = ['Baker', 'L1', 'L3', 'L4'];

  function cpkBadge(val) {
    if (val == null) return '<span style="color:var(--muted)">—</span>';
    const v = Math.round(val * 100) / 100;
    if (v >= 1.67) return '<span style="color:#059669;font-weight:700">' + v.toFixed(2) + '</span>';
    if (v >= 1.33) return '<span style="color:#059669;font-weight:600">' + v.toFixed(2) + '</span>';
    if (v >= 1.0) return '<span style="color:#b45309;font-weight:600">' + v.toFixed(2) + '</span>';
    return '<span style="color:#b91c1c;font-weight:700">' + v.toFixed(2) + '</span>';
  }

  container.innerHTML = dailyFormWrap('CP / CPK — Titulaciones + Empaque', `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <p style="font-size:12px;color:var(--muted);margin:0">Datos de Vales/Calidad + Flujo Materiales (Empaque)</p>
      <button class="btn btn-outline btn-sm" onclick="renderCpkForm(document.getElementById('dailyFormContent'))">Recargar</button>
    </div>
    <h4 style="margin:0 0 10px;font-size:14px;color:var(--primary)">Titulaciones por Proceso</h4>
    ${lineas.map(l => {
      const headers = tits[l] || [];
      if (headers.length === 0) return '<div style="font-size:12px;color:var(--muted);margin-bottom:8px"><b>' + l + ':</b> Sin titulaciones recientes</div>';
      return '<div style="margin-bottom:14px;border:1px solid var(--line);border-radius:8px;padding:12px">' +
        '<b style="font-size:13px;color:var(--primary)">' + l + '</b>' +
        '<table style="font-size:11px;margin-top:6px"><thead><tr><th>Fecha</th><th>Turno</th><th>#</th><th>Estado</th><th>Params</th><th>Fuera</th><th>Analista</th></tr></thead><tbody>' +
        headers.map(h => '<tr><td>' + h.fecha + '</td><td>' + h.turno + '</td><td>' + h.numero + '</td>' +
          '<td><span class="badge ' + (h.estado === 'completo' ? 'cerrada' : h.estado === 'fuera_de_rango' ? 'atrasada' : 'sin_empezar') + '" style="font-size:10px">' + h.estado + '</span></td>' +
          '<td>' + h.parametros_total + '</td><td style="color:' + (h.parametros_fuera > 0 ? 'var(--red)' : 'var(--green)') + ';font-weight:700">' + h.parametros_fuera + '</td>' +
          '<td style="font-size:10px">' + esc(h.analista || '') + '</td></tr>').join('') +
        '</tbody></table></div>';
    }).join('')}
    <h4 style="margin:20px 0 10px;font-size:14px;color:var(--primary)">CPK Peso Fosfato ${cpkSemana ? '<span style="font-size:11px;color:var(--muted);font-weight:400">(Semana ' + cpkSemana.ini + ' al ' + cpkSemana.fin + ')</span>' : ''}</h4>
    ${cpkParamsList.length === 0 ? '<p style="font-size:12px;color:var(--muted)">Sin datos de Peso Fosfato disponibles</p>' :
      '<table style="font-size:11px;width:100%"><thead><tr><th>Tanque</th><th>n</th><th style="text-align:center">Media</th><th style="text-align:center">Sigma</th><th style="text-align:center">LSL – USL</th><th style="text-align:center">Cp</th><th style="text-align:center">Cpk</th></tr></thead><tbody>' +
      cpkParamsList.map(p => '<tr>' +
        '<td><strong>' + esc(p.tanque || '') + '</strong> <span style="font-size:10px;color:var(--muted)">' + esc(p.unidad || '') + '</span></td>' +
        '<td>' + p.n + '</td>' +
        '<td style="text-align:center">' + (p.mean != null ? p.mean : '—') + '</td>' +
        '<td style="text-align:center">' + (p.sigma != null ? p.sigma : '—') + '</td>' +
        '<td style="text-align:center;font-size:10px;color:var(--muted)">' + (p.lsl ?? '—') + ' – ' + (p.usl ?? '—') + '</td>' +
        '<td style="text-align:center">' + cpkBadge(p.cp) + '</td>' +
        '<td style="text-align:center">' + cpkBadge(p.cpk) + '</td>' +
      '</tr>').join('') +
      '</tbody></table>'}
    <h4 style="margin:20px 0 10px;font-size:14px;color:var(--primary)">CPK Empaque (Tenneco)</h4>
    ${empPartes.length === 0 ? '<p style="font-size:12px;color:var(--muted)">Sin datos de empaque disponibles</p>' :
      '<table style="font-size:11px;width:100%"><thead><tr><th>N. Parte</th><th>n</th><th style="text-align:center">Rugosidad CPK</th><th style="text-align:center">Rug. Media</th><th style="text-align:center">Rug. Limites</th><th style="text-align:center">Alt. Axial CPK</th><th style="text-align:center">Alt. Media</th><th style="text-align:center">Alt. Limites</th></tr></thead><tbody>' +
      empPartes.map(p => '<tr>' +
        '<td><strong>' + esc(p.numero_parte) + '</strong></td>' +
        '<td>' + p.muestras + '</td>' +
        '<td style="text-align:center">' + (p.rugosidad.na ? '<span style="color:var(--muted)">N/A</span>' : cpkBadge(p.rugosidad.cpk)) + '</td>' +
        '<td style="text-align:center">' + (p.rugosidad.mean != null ? p.rugosidad.mean : '—') + '</td>' +
        '<td style="text-align:center;font-size:10px;color:var(--muted)">' + (p.rugosidad.na ? 'N/A' : (p.rugosidad.lsl ?? '—') + ' – ' + (p.rugosidad.usl ?? '—')) + '</td>' +
        '<td style="text-align:center">' + cpkBadge(p.altura_axial.cpk) + '</td>' +
        '<td style="text-align:center">' + (p.altura_axial.mean != null ? p.altura_axial.mean : '—') + '</td>' +
        '<td style="text-align:center;font-size:10px;color:var(--muted)">' + (p.altura_axial.lsl ?? '—') + ' – ' + (p.altura_axial.usl ?? '—') + '</td>' +
      '</tr>').join('') +
      '</tbody></table>'}
    <div class="form-group" style="margin-top:12px"><label>Observaciones</label><textarea id="df_obs_cpk" rows="2">${esc(datos.observaciones || '')}</textarea></div>
  `, () => ({
    observaciones: document.getElementById('df_obs_cpk').value.trim()
  }));
}

async function save8D() {
  const cliente = document.getElementById('d8Cliente').value;
  const componente = document.getElementById('d8Componente').value.trim();
  const problema = document.getElementById('d8Problema').value.trim();
  const fecha_reclamo = document.getElementById('d8FechaReclamo').value;
  const responsable_id = Number(document.getElementById('d8Resp').value);
  const errEl = document.getElementById('d8Err');

  if (!cliente || !componente || !problema || !fecha_reclamo || !responsable_id) {
    errEl.textContent = 'Completa todos los campos obligatorios';
    return;
  }

  try {
    errEl.textContent = 'Creando 8D...';
    errEl.style.color = 'var(--accent)';
    const act = await apiFetch('/api/planner/actividades/8d', {
      method: 'POST',
      body: JSON.stringify({ cliente, componente, problema, fecha_reclamo, responsable_id })
    });
    if (!act) { errEl.textContent = 'Error al crear'; errEl.style.color = 'var(--red)'; return; }

    closeModal('modal8D');
    alert('8D creado: ' + act.id + ' con 6 sub-tareas');
    // Refresh 8D list
    const container = document.getElementById('dailyFormContent');
    if (container) render8DForm(container);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.color = 'var(--red)';
  }
}

async function saveEdit8D(actId) {
  const cliente = document.getElementById('e8dCliente').value;
  const componente = document.getElementById('e8dComponente').value.trim();
  const problema = document.getElementById('e8dProblema').value.trim();
  const fecha_reclamo = document.getElementById('e8dFechaReclamo').value;

  if (!cliente || !componente || !problema || !fecha_reclamo) {

  try {

    errEl.style.color = 'var(--accent)';
    const r = await apiFetch('/api/planner/actividades/' + actId + '/8d', {
      method: 'PATCH',
      body: JSON.stringify({ cliente, componente, problema, fecha_reclamo })
    });

    errEl.style.color = 'var(--red)';

}

function toggleDailyFields(selectId, blockId, invertLogic) {
  const val = document.getElementById(selectId).value === 'true';
  const show = invertLogic ? !val : val;
  document.getElementById(blockId).style.display = show ? 'block' : 'none';
}

async function saveDailyForm() {
  if (!_currentDailyGetData) return;
  const datos = _currentDailyGetData();
  const msg = document.getElementById('dailySaveMsg');

  try {
    msg.textContent = 'Guardando...';
    msg.style.color = 'var(--accent)';
    const r = await apiFetch(`/api/planner/daily/${_dailyDepto}/${_dailyActiveForm}`, {
      method: 'POST',
      body: JSON.stringify({ fecha: _dailyDate, datos })
    });
    if (r && r.ok) {
      msg.textContent = 'Guardado correctamente';
      msg.style.color = 'var(--green)';
      // Refresh resumen badges
      const resumen = await apiFetch(`/api/planner/daily/${_dailyDepto}/resumen?fecha=${_dailyDate}`);
      if (resumen) {
        _dailyResumen = resumen;
        const tabs = document.querySelectorAll('#dailyTabs .tab');
        tabs.forEach(t => {
          const fid = t.dataset.form;
          const info = resumen.formularios.find(x => x.id === fid);
          const forms = getDailyForms(_dailyDepto);
          const fm = forms.find(f => f.id === fid);
          if (info && fm) {
            const dot = info.llenado ? '🟢' : '⚪';
            t.innerHTML = `${dot} ${fm.icon} ${fm.nombre}`;
          }
        });
        // Update header badge
        const llenados = resumen.formularios.filter(f => f.llenado).length;
        const total = resumen.formularios.length;
        const headerBadge = document.querySelector('.content .badge');
        if (headerBadge) {
          headerBadge.className = `badge ${llenados === total ? 'cerrada' : llenados > 0 ? 'en_proceso' : 'sin_empezar'}`;
          headerBadge.textContent = `${llenados}/${total} formularios`;
        }
      }
    }
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = 'var(--red)';
  }
}

  if (!_dailyDepto || !_dailyActiveForm) return;

  const lbl = cb.parentElement;

    lbl.style.color = '#fff';
  } else {
    lbl.style.background = 'var(--bg-alt)';
    lbl.style.color = 'var(--text)';
  }
}

async function guardarAsignacion(userId) {
  const roleEl = document.getElementById('eq-role-' + userId);
  const deptoCont = document.getElementById('eq-deptos-' + userId);
  if (!roleEl || !deptoCont) return;

  const planner_role = roleEl.value || null;
  const departamentos = [...deptoCont.querySelectorAll('input:checked')].map(c => c.value);

  const res = await apiFetch('/api/planner/staff/asignar', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario_id: userId, planner_role, departamentos })
  });
  if (res && res.ok) {
    const row = document.getElementById('eq-row-' + userId);
    if (row) {
      row.style.transition = 'background .3s';
      row.style.background = 'rgba(16,185,129,.12)';
      setTimeout(() => { row.style.background = ''; }, 1200);
    }
  }
}

function renderDashCharts(tendencia) {
  if (typeof Chart === 'undefined') return;

  const labels = tendencia.map(t => t.fecha.slice(5));

  // Chart: Actividades creadas vs cerradas
  const ctx1 = document.getElementById('chartActividades');
  if (ctx1) {
    new Chart(ctx1, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Creadas', data: tendencia.map(t => t.creadas), backgroundColor: 'rgba(41,128,185,.7)', borderRadius: 4 },
          { label: 'Cerradas', data: tendencia.map(t => t.cerradas), backgroundColor: 'rgba(39,174,96,.7)', borderRadius: 4 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } } },
          x: { ticks: { font: { size: 11 } } }
        }
      }
    });
  }

  // Chart: Daily fill rate
  const ctx2 = document.getElementById('chartDaily');
  if (ctx2) {
    const pcts = tendencia.map(t => t.daily_total > 0 ? Math.round(t.daily_llenados / t.daily_total * 100) : 0);
    new Chart(ctx2, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: '% Formularios llenados',
          data: pcts,
          borderColor: 'rgba(41,128,185,1)',
          backgroundColor: 'rgba(41,128,185,.1)',
          fill: true,
          tension: .3,
          pointRadius: 4,
          pointBackgroundColor: pcts.map(p => p === 100 ? 'var(--green)' : p > 0 ? 'var(--orange)' : '#ccc')
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', font: { size: 11 } } },
          x: { ticks: { font: { size: 11 } } }
        }
      }
    });
  }
}

// ── Dashboard Slides v3 — presentacion por departamento ─────────────────────

var _ds = { deptoId: '', fecha: '', slides: [], idx: 0 };

// Keyboard nav
document.addEventListener('keydown', function(e) {
  if (!_ds.slides.length || _currentView !== 'dashboard') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (_ds.idx < _ds.slides.length - 1) { _ds.idx++; paintSlide(); } }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (_ds.idx > 0) { _ds.idx--; paintSlide(); } }
  else if (e.key === 'Home') { e.preventDefault(); _ds.idx = 0; paintSlide(); }
  else if (e.key === 'End') { e.preventDefault(); _ds.idx = _ds.slides.length - 1; paintSlide(); }
});

  observaciones:'Observaciones', notas:'Notas', detalle:'Detalle / Observaciones',

  hubo:'¿Se presentaron?', que_paso:'¿Qué pasó?', que_se_hizo:'¿Qué se hizo?',
  cumplimiento:'¿Cumplimiento 100%?', porcentaje:'% Cumplimiento',
  quien_no_cumplio:'¿Quién no cumplió?',
  // PTAR
  litros_ingresados_ptar:'Litros ingresados PTAR', litros_ingresados_pipas:'Litros ingresados pipas',
  litros_tratados_ptar:'Litros tratados PTAR', litros_tratados_salida:'Litros tratados salida',
  retrolavado:'Retrolavado',
  // RHH
  retardos:'Retardos', faltas:'Faltas', vacaciones:'Vacaciones',
  incapacidad:'Incapacidad', permisos:'Permisos', otros:'Otros',
  requeridos:'Personal requerido', disponibles:'Personal disponible',
  vacantes_abiertas:'Vacantes abiertas', vacantes:'Vacantes',
  total_horas:'Total horas', horas_autorizadas:'Hrs. autorizadas',
  horas_pendientes:'Hrs. pendientes', personas:'Personas',
  registros:'Registros',
  // Produccion
  procesadas:'Piezas procesadas', objetivo:'Objetivo',
  eficiencia:'Eficiencia %', calidad:'Calidad %', disponibilidad:'Disponibilidad %',
  // Calidad
  rechazadas:'Pzas rechazadas', issues:'Registros',
  // Mantenimiento
  equipos:'Equipos',
  // Common nested
  resumen:'Resumen', items:'Items',
  nombre:'Nombre', puesto:'Puesto', tipo:'Tipo', area:'Área',
  fecha_inicio:'Fecha inicio', fecha_fin:'Fecha fin',
  fecha_apertura:'Fecha apertura', prioridad:'Prioridad',
  cliente:'Cliente', numero_parte:'No. parte', cantidad:'Cantidad',
  descripcion:'Descripción', impacto:'Impacto',
  diagnostico:'Diagnóstico', fecha_inhabilitado:'Fecha inhabilitado',
  problema:'Problema', fecha:'Fecha', comentario:'Comentario',
  // sub-fields retrolavado
  aplica:'Aplica', realizado:'¿Se realizó?', evidencia_url:'Evidencia URL',
  razones:'Razones', plan_accion:'Plan de acción',
  // resumen sub
  total_paros:'Total paros', total_min:'Minutos totales',
  ots_dia_anterior:'OTs dia anterior', pendientes_global:'Pendientes global',
  items_alerta:'Items en alerta', bajo_minimo:'Bajo mínimo',
  pos_activas:'POs activas', total_items:'Items totales'
};

// Formularios tipo "tarea" que no guardan datos sino que gestionan actividades
var DS_TASK_FORMS = [
  'necesidades_personal','rechazos_cliente','problemas_calidad','liberaciones_pendientes',
  'correctivos_pendientes','preventivo_programado','equipos_criticos','riesgos_falla',
  'refacciones_criticas','compras_urgentes',
  'no_conformidades','8ds_abiertos','documentos_pendientes','indicadores_fuera','cumplimiento_sgc',
  'prioridades_dia','pedidos_criticos',
  'problemas_proceso','estudios_pruebas','mejoras_implementaciones'
];

function dsLabel(k) {
  return DS_LABELS[k] || k.replace(/_/g, ' ').replace(/^\w/, function(c) { return c.toUpperCase(); });
}

function dsVal(val) {
  if (val === true || val === 'true') return '<span style="color:#fff;background:var(--green);padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700">SI</span>';
  if (val === false || val === 'false') return '<span style="color:#fff;background:var(--red);padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700">NO</span>';
  if (val == null || val === '') return '<span style="color:var(--muted)">—</span>';
  if (Array.isArray(val)) {
    if (!val.length) return '<span style="color:var(--muted)">—</span>';
    if (typeof val[0] === 'object') {
      var cols = Object.keys(val[0]);
      return '<table style="font-size:11px;width:100%;margin-top:6px;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:8px;overflow:hidden"><thead><tr>' +
        cols.map(function(c) { return '<th style="text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;color:var(--muted);background:var(--bg);font-weight:700">' + esc(dsLabel(c)) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        val.map(function(row, ri) { return '<tr style="background:' + (ri%2?'var(--bg)':'var(--card)') + '">' + cols.map(function(c) { return '<td style="padding:5px 8px">' + dsVal(row[c]) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table>';
    }
    return esc(val.join(', '));
  }
  if (typeof val === 'object' && val !== null) {
    var entries = Object.entries(val);
    if (!entries.length) return '<span style="color:var(--muted)">—</span>';
    return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:2px">' + entries.map(function(e) {
      return '<span style="background:var(--bg);padding:3px 10px;border-radius:6px;font-size:11px"><b style="color:var(--muted)">' + esc(dsLabel(e[0])) + ':</b> ' + dsVal(e[1]) + '</span>';
    }).join('') + '</div>';
  }
  return esc(String(val));
}

function dsFormBody(datos) {
  var keys = Object.keys(datos).filter(function(k) { return k.charAt(0) !== '_'; });
  if (!keys.length) return '<div style="color:var(--muted);font-size:14px;text-align:center;padding:30px">Sin datos registrados</div>';
  var h = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">';
  keys.forEach(function(k, idx) {
    var val = datos[k];
    var wide = Array.isArray(val) && val.length && typeof val[0] === 'object';
    var isObj = typeof val === 'object' && val !== null && !Array.isArray(val);
    var bg = idx % 2 === 0 ? 'var(--card)' : 'var(--bg)';
    h += '<div style="padding:10px 14px;' + (wide || isObj ? 'grid-column:1/-1;' : '') + 'background:' + bg + ';border-bottom:1px solid var(--line)">' +
      '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:3px">' + esc(dsLabel(k)) + '</div>' +
      '<div style="font-size:13px;font-weight:600">' + dsVal(val) + '</div></div>';
  });
  return h + '</div>';
}

function dsActRow(a) {
  var isLate = a.estatus === 'atrasada';
  return '<tr style="' + (isLate ? 'background:#fef2f2;' : '') + '">' +
    '<td style="font-family:monospace;font-size:11px;font-weight:700;color:var(--primary)">' + esc(a.id) + '</td>' +
    '<td style="font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(a.titulo) + '</td>' +
    '<td style="font-size:12px">' + esc(a.responsable) + '</td>' +
    '<td style="font-size:11px;color:' + (isLate ? 'var(--red)' : 'inherit') + ';font-weight:' + (isLate ? '700' : '400') + '">' + (a.fecha_compromiso || '—') + '</td>' +
    '<td><span class="badge ' + (isLate ? 'atrasada' : a.estatus) + '">' + (isLate ? a.urgencia : (a.estatus||'').replace('_',' ')) + '</span></td>' +
    '<td><button class="btn btn-primary btn-sm" onclick="verDetalle(\'' + a.id + '\')" style="font-size:10px;padding:3px 10px">Ver</button></td></tr>';
}

function dsChangeDate(delta) {
  var d = new Date(_ds.fecha + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  _ds.fecha = d.toISOString().slice(0, 10);
  openDeptoSlides(_ds.deptoId);
}

async function openDeptoSlides(deptoId) {
  var m = document.getElementById('mainContent');
  m.innerHTML = '<div class="spinner"></div>';

  if (!_ds.fecha) _ds.fecha = yesterdayMx();
  var data = await apiFetch('/api/planner/dashboard/' + deptoId + '?fecha=' + _ds.fecha);
  if (!data) { renderDashboard(); return; }

  _ds.deptoId = deptoId;
  _ds.fecha = data.fecha;
  _ds.slides = [];

  var di = DEPTOS.find(function(x) { return x.id === deptoId; }) || {};
  var forms = data.formularios || [];
  var acts = data.actividades || {};
  var llenados = forms.filter(function(f) { return f.llenado; }).length;
  var pct = forms.length ? Math.round(llenados / forms.length * 100) : 0;

  // ── Slide 0: Portada ──
  var kpiCard = function(valor, label, color) {
    return '<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;text-align:center;min-width:100px">' +
      '<div style="font-size:36px;font-weight:800;color:' + color + ';line-height:1">' + valor + '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:4px;font-weight:600">' + label + '</div></div>';
  };
  var s0 = '<div style="text-align:center;padding:20px 0">' +
    '<div style="font-size:56px;margin-bottom:6px">' + (di.icon||'') + '</div>' +
    '<h2 style="color:var(--primary);margin:0 0 20px;font-size:22px">' + esc(di.nombre||deptoId) + '</h2>' +
    '<div style="display:flex;justify-content:center;gap:14px;margin-bottom:26px;flex-wrap:wrap">' +
      kpiCard(pct + '%', 'Daily (' + llenados + '/' + forms.length + ')', pct===100?'var(--green)':'var(--orange)') +
      kpiCard(acts.total||0, 'Actividades', 'var(--primary)') +
      ((acts.atrasadas||[]).length ? kpiCard(acts.atrasadas.length, 'Atrasadas', 'var(--red)') : '') +
      ((acts.pendientes||[]).length ? kpiCard(acts.pendientes.length, 'Pendientes', 'var(--orange)') : '') +
    '</div>' +
    '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px">' +
      forms.map(function(f, fi) {
        var fm = (DAILY_FORMS_META[deptoId]||[]).find(function(x) { return x.id === f.id; });
        var nm = fm ? fm.nombre : f.id;
        var isTF = DS_TASK_FORMS.indexOf(f.id) >= 0;
        var borderC = isTF ? 'var(--accent)' : (f.llenado ? 'var(--green)' : 'var(--line)');
        var colorC = isTF ? 'var(--accent)' : (f.llenado ? 'var(--green)' : 'var(--muted)');
        var bgC = isTF ? '#eef6ff' : (f.llenado ? '#f0fdf4' : '#fafafa');
        var icon = isTF ? '📋' : (f.llenado ? '✓' : '○');
        return '<span onclick="_ds.idx=' + (fi+1) + ';paintSlide()" style="padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid ' + borderC + ';color:' + colorC + ';background:' + bgC + '" onmouseover="this.style.transform=\'scale(1.05)\'" onmouseout="this.style.transform=\'\'">' + icon + ' ' + nm + '</span>';
      }).join('') +
    '</div></div>';
  _ds.slides.push({ titulo: 'Resumen', tipo: 'resumen', html: s0 });

  // ── Slides 1..N: formularios ──
  forms.forEach(function(f) {
    var fm = (DAILY_FORMS_META[deptoId]||[]).find(function(x) { return x.id === f.id; });
    var nombre = fm ? fm.icon + ' ' + fm.nombre : f.id;
    var isTaskForm = DS_TASK_FORMS.indexOf(f.id) >= 0;
    var html;
    if (isTaskForm) {
      // Formularios tipo actividad — no guardan datos, gestionan tareas
      var linkedActs = (acts.pendientes||[]).concat(acts.atrasadas||[]).filter(function(a) { return a.origen_formulario === f.id; });
      html = '<div style="text-align:center;padding:40px 0">' +
        '<div style="font-size:40px;margin-bottom:10px">📋</div>' +
        '<h3 style="color:var(--primary);margin:0 0 8px;font-size:17px">' + nombre + '</h3>' +
        '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">Este formulario gestiona actividades vinculadas</div>' +
        '<div style="font-size:24px;font-weight:800;color:var(--accent)">' + linkedActs.length + '</div>' +
        '<div style="font-size:12px;color:var(--muted)">actividades abiertas</div></div>';
    } else if (!f.llenado) {
      html = '<div style="text-align:center;padding:50px 0">' +
        '<div style="width:80px;height:80px;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;color:var(--muted)">○</div>' +
        '<h3 style="color:var(--muted);margin:0 0 8px;font-size:18px">' + nombre + '</h3>' +
        '<div style="font-size:14px;color:var(--red);font-weight:600">Pendiente de llenado</div></div>';
    } else {
      html = '<div style="padding:6px 0">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--line)">' +
        '<h3 style="color:var(--primary);margin:0;font-size:17px">' + nombre + '</h3>' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<span style="background:#f0fdf4;color:var(--green);padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700">LLENADO</span>' +
          '<span style="font-size:12px;color:var(--muted)">' + esc(f.llenado_por||'') + ' &middot; ' + (f.hora||'') + '</span>' +
        '</div></div>' +
        dsFormBody(f.datos || {}) + '</div>';
    }
    _ds.slides.push({ titulo: nombre, tipo: isTaskForm ? 'tareas' : (f.llenado ? 'llenado' : 'pendiente'), html: html });
  });

  // ── Slide final: actividades ──
  var ah = '<div style="padding:6px 0">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--line)">' +
    '<h3 style="color:var(--primary);margin:0;font-size:17px">Actividades del area</h3>' +
    '<button class="btn btn-accent btn-sm" onclick="openNewActModal({departamento:\'' + deptoId + '\'})">+ Nueva actividad</button></div>';
  if ((acts.atrasadas||[]).length) {
    ah += '<div style="margin-bottom:18px">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="width:4px;height:18px;background:var(--red);border-radius:2px"></div>' +
      '<h4 style="font-size:13px;color:var(--red);margin:0">Atrasadas (' + acts.atrasadas.length + ')</h4></div>' +
      '<div style="border-radius:8px;overflow:hidden;border:1px solid var(--line)">' +
      '<table style="font-size:12px;width:100%;margin:0"><thead><tr><th>ID</th><th>Actividad</th><th>Responsable</th><th>Compromiso</th><th>Urgencia</th><th></th></tr></thead><tbody>' +
      acts.atrasadas.map(dsActRow).join('') + '</tbody></table></div></div>';
  }
  if ((acts.pendientes||[]).length) {
    ah += '<div style="margin-bottom:18px">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="width:4px;height:18px;background:var(--orange);border-radius:2px"></div>' +
      '<h4 style="font-size:13px;color:var(--orange);margin:0">Pendientes (' + acts.pendientes.length + ')</h4></div>' +
      '<div style="border-radius:8px;overflow:hidden;border:1px solid var(--line)">' +
      '<table style="font-size:12px;width:100%;margin:0"><thead><tr><th>ID</th><th>Actividad</th><th>Responsable</th><th>Compromiso</th><th>Estatus</th><th></th></tr></thead><tbody>' +
      acts.pendientes.map(dsActRow).join('') + '</tbody></table></div></div>';
  }
  if (!(acts.atrasadas||[]).length && !(acts.pendientes||[]).length) {
    ah += '<div style="text-align:center;padding:40px 0;color:var(--muted)"><div style="font-size:36px;margin-bottom:8px">✓</div><div style="font-size:14px">Sin actividades pendientes ni atrasadas</div></div>';
  }
  ah += '</div>';
  _ds.slides.push({ titulo: 'Actividades', tipo: 'actividades', html: ah });

  _ds.idx = 0;
  paintSlide();
}

function paintSlide() {
  var m = document.getElementById('mainContent');
  var s = _ds.slides[_ds.idx];
  var total = _ds.slides.length;
  var di = DEPTOS.find(function(x) { return x.id === _ds.deptoId; }) || {};
  var deptoId = _ds.deptoId;

  // ── Header bar ──
  var hdr = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px">' +
    '<button class="btn btn-outline btn-sm" onclick="renderDashboard()" style="padding:5px 10px;font-size:12px">← Dashboard</button>' +
    '<div style="width:1px;height:24px;background:var(--line)"></div>' +
    '<span style="font-size:18px">' + (di.icon||'') + '</span>' +
    '<b style="color:var(--primary);font-size:14px">' + esc(di.nombre||deptoId) + '</b>' +
    '<div style="flex:1"></div>' +
    '<button class="btn btn-outline btn-sm" onclick="dsChangeDate(-1)" style="padding:4px 10px;font-size:15px;font-weight:700" title="Dia anterior">◄</button>' +
    '<input type="date" value="' + _ds.fecha + '" onchange="_ds.fecha=this.value;openDeptoSlides(\'' + deptoId + '\')" style="padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:13px;font-weight:600;color:var(--primary);cursor:pointer">' +
    '<button class="btn btn-outline btn-sm" onclick="dsChangeDate(1)" style="padding:4px 10px;font-size:15px;font-weight:700" title="Dia siguiente">►</button>' +
    '<div style="width:1px;height:24px;background:var(--line);margin:0 4px"></div>' +
    '<span style="font-size:13px;color:var(--muted);font-weight:700;min-width:38px;text-align:center">' + (_ds.idx+1) + '/' + total + '</span>' +
  '</div>';

  // ── Progress bar + dots ──
  var pctBar = Math.round((_ds.idx / (total - 1)) * 100);
  var nav = '<div style="margin-bottom:14px">' +
    '<div style="height:3px;background:var(--line);border-radius:2px;margin-bottom:10px;overflow:hidden"><div style="height:100%;width:' + pctBar + '%;background:var(--accent);border-radius:2px;transition:width .3s ease"></div></div>' +
    '<div style="display:flex;justify-content:center;gap:4px;flex-wrap:wrap">';
  _ds.slides.forEach(function(sl, i) {
    var active = i === _ds.idx;
    var bg, border;
    if (active) { bg = 'var(--primary)'; border = 'var(--primary)'; }
    else if (sl.tipo === 'llenado') { bg = 'var(--green)'; border = 'var(--green)'; }
    else if (sl.tipo === 'pendiente') { bg = '#e0e4ea'; border = '#e0e4ea'; }
    else { bg = 'var(--accent)'; border = 'var(--accent)'; }
    var size = active ? 'width:28px;height:10px' : (sl.tipo === 'resumen' || sl.tipo === 'actividades' ? 'width:18px;height:10px' : 'width:10px;height:10px');
    nav += '<div onclick="_ds.idx=' + i + ';paintSlide()" style="' + size + ';border-radius:5px;cursor:pointer;transition:all .2s ease;background:' + bg + ';opacity:' + (active?'1':'.65') + '" title="' + esc(sl.titulo) + '"></div>';
  });
  nav += '</div></div>';

  // ── Slide content with animation ──
  var content = '<div id="dsSlideBox" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;min-height:340px;animation:dsFadeIn .25s ease">' + s.html + '</div>';

  // ── Footer navigation ──
  var prevDis = _ds.idx === 0 ? 'opacity:.4;pointer-events:none;' : '';
  var nextDis = _ds.idx === total - 1 ? 'opacity:.4;pointer-events:none;' : '';
  var footer = '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">' +
    '<button onclick="_ds.idx=Math.max(0,_ds.idx-1);paintSlide()" style="display:flex;align-items:center;gap:6px;padding:8px 18px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--primary);transition:all .15s;' + prevDis + '" onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'var(--line)\'">' +
      '<span style="font-size:16px">←</span> Anterior</button>' +
    '<div style="display:flex;gap:4px">' +
      DEPTOS.map(function(d) {
        var isCur = d.id === deptoId;
        return '<button onclick="openDeptoSlides(\'' + d.id + '\')" title="' + d.nombre + '" style="width:34px;height:34px;border-radius:8px;border:1.5px solid ' + (isCur?'var(--accent)':'var(--line)') + ';background:' + (isCur?'var(--accent)':'var(--card)') + ';cursor:pointer;font-size:15px;transition:all .15s;display:flex;align-items:center;justify-content:center" onmouseover="if(!' + isCur + ')this.style.borderColor=\'var(--accent)\'" onmouseout="if(!' + isCur + ')this.style.borderColor=\'var(--line)\'">' + d.icon + '</button>';
      }).join('') +
    '</div>' +
    '<button onclick="_ds.idx=Math.min(' + (total-1) + ',_ds.idx+1);paintSlide()" style="display:flex;align-items:center;gap:6px;padding:8px 18px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--primary);transition:all .15s;' + nextDis + '" onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'var(--line)\'">Siguiente <span style="font-size:16px">→</span></button>' +
  '</div>';

  m.innerHTML = '<style>@keyframes dsFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}</style>' + hdr + nav + content + footer;
}

// ── Init ─────────────────────────────────────────────────────────────────────
initApp();
</script>
</body>
</html>
