<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Staff — CUESTO</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--primary:#1a3a5c;--primary-light:#2c5f8a;--accent:#2980b9;--text:#1e1e1e;--muted:#888;--line:#e0e4ea;--green:#27ae60;--red:#c0392b;--orange:#e67e22;--yellow:#f1c40f;--tag-alta:#fce4e4;--tag-media:#fef9e7;--tag-baja:#d5f5e3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--accent);text-decoration:none}

/* Layout */
.app{display:flex;height:100vh}
.sidebar{width:230px;background:var(--primary);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-header{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar-header h2{font-size:15px;font-weight:700;letter-spacing:.5px}
.sidebar-header small{font-size:11px;opacity:.6}
.nav-item{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:background .15s}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:rgba(255,255,255,.15);border-left:3px solid #fff}
.nav-group-title{padding:14px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.45;font-weight:700}
.nav-sub{padding:7px 16px 7px 36px;cursor:pointer;font-size:12px;opacity:.75;transition:background .15s}
.nav-sub:hover{background:rgba(255,255,255,.08);opacity:1}
.nav-sub.active{background:rgba(255,255,255,.12);opacity:1}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;opacity:.5}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-title{font-size:15px;font-weight:700;color:var(--primary)}
.topbar-user{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar-user button{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* Cards & KPIs */
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:var(--card);border-radius:10px;padding:14px 18px;min-width:120px;flex:1;border:1px solid var(--line)}
.kpi label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;color:var(--primary);margin-top:2px}
.kpi .sub{font-size:11px;color:var(--muted)}
.kpi.red .val{color:var(--red)}
.kpi.green .val{color:var(--green)}
.kpi.orange .val{color:var(--orange)}

/* Table */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;font-size:13px}
thead{background:#f0f3f7}
th{padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:hover{background:#f8fafc}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge.alta{background:var(--tag-alta);color:var(--red)}
.badge.media{background:var(--tag-media);color:#b7770d}
.badge.baja{background:var(--tag-baja);color:var(--green)}
.badge.sin_empezar{background:#eaecee;color:#7f8c8d}
.badge.en_proceso{background:#d6eaf8;color:#2471a3}
.badge.cerrada{background:#d5f5e3;color:#1e8449}
.badge.atrasada{background:var(--tag-alta);color:var(--red)}
.badge.pospuesta{background:#f5eef8;color:#7d3c98}
.badge.cancelada{background:#f2f3f4;color:#95a5a6;text-decoration:line-through}

/* Buttons */
.btn{padding:7px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:none;border:1.5px solid var(--line);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:12px}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding:14px;background:var(--card);border-radius:10px;border:1px solid var(--line)}
.filters label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;font-weight:600;text-transform:uppercase}
.filters select,.filters input[type=text],.filters input[type=date]{padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:13px;background:#fff}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--muted);transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:flex-start;padding-top:60px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border-radius:12px;width:95%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box.wide{max-width:900px}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-header h3{font-size:15px;font-weight:700;color:var(--primary)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:0 4px}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Trazabilidad */
.traza-list{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px}
.traza-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
.traza-item:last-child{border-bottom:none}
.traza-fecha{color:var(--muted);white-space:nowrap;min-width:100px}
.traza-user{font-weight:600;min-width:110px;color:var(--primary)}
.traza-detalle{color:var(--text)}

/* Sub-actividades */
.sub-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sub-item{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.sub-item:last-child{border-bottom:none}
.sub-item:hover{background:#f8fafc}

/* Spinner */
.spinner{border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;width:28px;height:28px;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Login */
.login-wrap{display:flex;justify-content:center;align-items:center;height:100vh;background:var(--bg)}
.login-box{background:var(--card);border-radius:14px;padding:36px;width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-box h2{font-size:18px;color:var(--primary);margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:20px}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}

/* Responsive */
@media(max-width:768px){.sidebar{width:56px}.sidebar-header h2,.sidebar-header small,.nav-item span,.nav-sub,.nav-group-title,.sidebar-footer{display:none}.nav-item{justify-content:center;padding:12px}.content{padding:12px}.filters{flex-direction:column}.form-row{grid-template-columns:1fr}.kpi-row{flex-direction:column}}

/* Empty */
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.planner-deck{--primary:#13343d;--accent:#137e91;--green:#16764a;--red:#b63239;--muted:#62777d;max-width:1480px;margin:auto;color:var(--primary)}
.planner-deck-toolbar,.planner-date-nav,.planner-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.planner-deck-toolbar{justify-content:space-between;margin-bottom:22px}.planner-date-nav input,.planner-period-controls select{padding:10px 14px;border:1px solid #ccdadd;border-radius:9px;background:white;font:inherit;color:#13343d}.planner-deck-header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 32px;border-radius:20px;background:#12343e;color:#fff}.planner-eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.14em}.planner-deck-header .planner-eyebrow{color:#a2d4d5}.planner-deck-header h1{font-size:clamp(24px,3vw,38px);margin:10px 0 7px}.planner-deck-header p{font-size:18px;color:#d0e6e7;margin:0}.planner-deck-status{text-align:right}.planner-deck-status>strong{display:block;font-size:42px;margin-top:12px;font-variant-numeric:tabular-nums}.planner-deck-status small{font-size:17px;color:#a2c0c6}.planner-status{display:inline-block;padding:7px 12px;border-radius:20px;background:#234d55;color:#d7f2e7;font-size:12px}.planner-status.pending{background:#69452b;color:#ffdbac}.planner-slide-tabs{display:flex;gap:8px;overflow-x:auto;padding:18px 0}.planner-slide-tabs button,.planner-department-tabs button{border:1px solid #d0dfe1;border-radius:10px;background:#fff;color:#405f66;padding:10px 13px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer}.planner-slide-tabs button span{margin-right:7px;opacity:.6}.planner-slide-tabs button.active,.planner-department-tabs button.active{background:#137e91;border-color:#137e91;color:white}.planner-slide-content{background:white;border:1px solid #d6e3e5;border-radius:18px;padding:clamp(18px,2.5vw,36px);min-height:390px;overflow-x:auto;box-shadow:0 8px 28px #153b4610}.planner-slide-content h3{font-size:22px!important}.planner-slide-content h4{font-size:17px!important}.planner-slide-content table{width:100%;border-collapse:collapse;font-size:14px!important}.planner-slide-content th{background:#edf4f4;color:#4b646a;font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:12px}.planner-slide-content td{padding:12px;border-bottom:1px solid #e3eded;line-height:1.45;font-size:14px!important}.planner-slide-content td small{font-size:11px}.planner-slide-content tr:last-child td{border-bottom:0}.planner-deck-footer{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px}.planner-deck-footer div{text-align:center;font-size:13px}.planner-deck-footer small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.planner-department-tabs{display:flex;gap:7px;flex-wrap:wrap;padding-top:16px;border-top:1px solid #d6e3e5}.planner-metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:16px 0}.planner-metric{padding:26px 22px;border:1px solid #d7e4e5;border-radius:14px;background:#f7fafb;display:flex;flex-direction:column;gap:9px}.planner-metric strong{font-size:clamp(32px,4vw,54px);letter-spacing:-.03em;font-variant-numeric:tabular-nums}.planner-metric.good{border-top:5px solid #26865b;background:#f2faf5}.planner-metric.bad{border-top:5px solid #bd4249;background:#fdf5f5}.planner-metric.neutral{border-top:5px solid #9aafb4}.planner-metric.good strong{color:#16764a}.planner-metric.bad strong{color:#b63239}.planner-metric footer{border-top:1px solid #d7e4e5;padding-top:12px;margin-top:8px;font-size:13px;color:#62777d}.planner-period-controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #d7e4e5}.planner-period-controls span{color:#62777d;font-size:13px}.planner-history-entry{padding:18px;border:1px solid #d7e4e5;border-radius:10px;margin:12px 0;overflow-x:auto}.planner-history-entry>div:first-child{margin-bottom:12px}.planner-history-entry span{color:#62777d}.planner-revision{padding:12px;border-left:3px solid #adcbcf;margin:10px}.planner-period-history{margin-top:20px}.planner-period-history summary{cursor:pointer;font-weight:700;padding:12px;background:#eef5f5;border-radius:8px}.planner-task-group{margin-bottom:24px}.planner-task-group h3{margin:12px 0}.planner-form-card{padding:18px;border:1px solid #d6e3e5;border-radius:12px;background:white}.planner-form-card h3{margin-bottom:14px}.planner-form-card label{display:block;font-size:12px;margin:10px 0 5px}.planner-form-card input{width:100%;padding:10px;border:1px solid #ccdadd;border-radius:7px}.planner-big-number{font-size:32px}.planner-help{color:#62777d;font-size:13px;margin-bottom:14px}.planner-actions{margin-top:16px}.planner-mention{color:#13697d;background:#e3f2f6;padding:2px 5px;border-radius:4px}.planner-focus .sidebar,.planner-focus .topbar{display:none}.planner-focus .main{margin-left:0!important}.planner-focus .content{padding:18px 30px}.planner-deck button:disabled{opacity:.4;cursor:default}.planner-deck button:focus-visible{outline:3px solid #df9e44;outline-offset:2px}
@media(max-width:800px){.planner-deck-header{padding:22px}.planner-deck-status>strong{font-size:30px}.planner-period-controls{flex-wrap:wrap}.planner-focus .content{padding:12px}.planner-slide-content [style*="grid-template-columns:repeat(4"]{grid-template-columns:repeat(2,1fr)!important}.planner-deck-footer small{display:none}.planner-deck-toolbar{gap:10px}.planner-date-nav input{max-width:150px}}
.planner-week-total{display:block;font-size:28px;color:#13343d;margin:8px 0;font-variant-numeric:tabular-nums}.planner-metric footer small{display:block;line-height:1.5}.planner-selected-day{background:#eaf6f6}.planner-selected-day td{font-weight:700}.planner-open-tasks{margin-top:26px;padding-top:20px;border-top:1px solid #d6e3e5}.planner-slide-content td:first-child{white-space:nowrap}.planner-slide-content canvas{max-height:330px}.planner-slide-content .planner-help{margin:12px 0}
@media(max-width:800px){.planner-slide-content [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}.planner-deck-status{min-width:100px}}
.planner-data-list{margin:0}.planner-data-list>div{padding:8px 0;border-bottom:1px solid #e4eded}.planner-data-list dt{font-weight:600;color:#526f75}.planner-data-list dd{margin:5px 0 0 12px;line-height:1.5}.planner-data-list ol{padding-left:22px}
.planner-comment-field{margin-top:18px}.planner-comment-field small{display:block;color:var(--muted);margin-top:5px}.planner-slide-comments{margin-top:22px;padding:20px;border:1px solid #bcdadd;border-left:4px solid #137e91;border-radius:12px;background:#f2f9f9;text-align:left}.planner-slide-comments h3{margin:0 0 16px}.planner-slide-comments article+article{margin-top:16px;padding-top:16px;border-top:1px solid #d5e6e7}.planner-slide-comments h4,.planner-slide-comments header{margin:0 0 8px;color:#46636b;font-size:13px!important}.planner-comment-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:16px;font-weight:400;color:#13343d}.planner-activity-comments td{white-space:normal!important}.planner-activity-comments .planner-slide-comments{margin:0;border:0}.planner-period-comments{margin-top:24px}
@media(prefers-reduced-motion:reduce){.planner-deck *{animation:none!important;transition:none!important}}


.planner-pending-panel{position:sticky;top:0;z-index:50;margin-bottom:20px;border:1px solid #d7e4e5;border-radius:14px;background:#f7fafb;box-shadow:0 5px 18px #153b460b;padding:10px 14px;color:#48616a}
.planner-pending-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.planner-pending-heading h2{font-size:12px;font-weight:600;letter-spacing:.02em}.planner-pending-heading h2 span{font-weight:400;color:#60777f}.planner-pending-add{width:30px;height:30px;flex-shrink:0;border:1px solid #c6dadc;border-radius:50%;background:#e9f3f3;color:#176b78;font-size:24px;line-height:1;cursor:pointer}.planner-pending-add:hover{background:#dbeeee}
.planner-pending-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;max-height:108px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#bdd0d3 transparent;list-style:none;padding:0;margin:0}.planner-pending-list li{min-width:0}.planner-pending-item{display:block;width:100%;height:100%;padding:9px 11px;text-align:left;border:1px solid #e0e9eb;border-radius:9px;background:#fff;color:#324e58;cursor:pointer;font:inherit}.planner-pending-item:hover{border-color:#9fbdc2;background:#f0f7f8}.planner-pending-item strong{display:block;font-size:12px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}.planner-pending-item small{display:block;margin-top:5px;font-size:11px;color:#61777d;line-height:1.4}.planner-pending-item.late{border-left:3px solid #cd9290}.planner-pending-item.is-new{background:#eaf6f0;border-color:#9ac9b1}.planner-pending-new{font-size:10px;color:#26714f;font-weight:600;margin-right:5px}.planner-pending-empty,.planner-pending-message{font-size:12px;line-height:1.5}.planner-pending-message:empty{display:none}.planner-pending-message{margin-top:6px;color:#26714f}
@media(max-width:600px){.planner-pending-panel{padding:8px 10px;margin-bottom:12px}.planner-pending-list{grid-template-columns:1fr;max-height:92px}.planner-pending-heading h2 span{display:block;margin-top:2px}}

.planner-lodos-field,.planner-scrap-capture{display:flex;align-items:center;justify-content:space-between;gap:24px;background:#f0f7f5;border:1px solid #d5e5df;border-radius:14px;padding:20px;margin:16px 0}.planner-lodos-field h3,.planner-scrap-capture h3{color:#24594b;margin:8px 0}.planner-lodos-field p,.planner-scrap-capture p{font-size:13px;color:#627b73;line-height:1.6}.planner-lodos-field .form-group,.planner-scrap-capture .form-group{margin:0;min-width:180px}.planner-lodos-field input,.planner-scrap-capture input{font-size:24px;font-variant-numeric:tabular-nums}.planner-scrap-title{margin:24px 0 16px}.planner-scrap-title h3{margin:8px 0;color:#244f49}.planner-scrap-title p{font-size:13px;color:#647d77}.planner-scrap-summary .planner-eyebrow,.planner-lodos-field .planner-eyebrow,.planner-scrap-capture .planner-eyebrow{color:#64847a}
.planner-scrap-metrics{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}.planner-scrap-metrics>div,.planner-lodos-metric{border:1px solid #d4e5df;background:#f3f9f6;border-radius:14px;padding:22px}.planner-scrap-metrics>div:last-child{background:#edf5f7;border-color:#d1e3e8}.planner-scrap-metrics span,.planner-lodos-metric>span{display:block;color:#59736b;font-size:13px}.planner-scrap-metrics strong,.planner-lodos-metric strong{display:block;margin-top:8px;font-size:clamp(28px,3vw,42px);color:#285e4e;font-variant-numeric:tabular-nums}.planner-scrap-metrics strong small,.planner-lodos-metric strong small{font-size:14px;font-weight:400;color:#6a837a}.planner-scrap-metrics p,.planner-lodos-metric p{font-size:12px;color:#6a837a;margin-top:8px}.planner-lodos-metric{margin-bottom:16px}.planner-scrap-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.planner-scrap-days article{border:1px solid #dfe9e6;padding:12px 9px;border-radius:10px;background:#fff;min-width:0}.planner-scrap-days article.selected{border-color:#93b6aa;background:#f1f8f5}.planner-scrap-days span{font-size:12px;color:#647b73}.planner-scrap-days strong{display:block;font-size:19px;color:#35594c;margin:10px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.planner-scrap-days small{display:block;font-size:10px;line-height:1.6;color:#72877f}.planner-scrap-bar{height:4px;background:#eaf0ed;border-radius:4px;margin-bottom:9px;overflow:hidden}.planner-scrap-bar i{display:block;height:100%;background:#87b2a2;border-radius:4px}
@media(max-width:850px){.planner-scrap-days{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){.planner-scrap-metrics{grid-template-columns:1fr}.planner-scrap-days{grid-template-columns:repeat(2,minmax(0,1fr))}.planner-lodos-field,.planner-scrap-capture{flex-direction:column;align-items:stretch;gap:14px}}
</style>

<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
<script>
const API = '';
let token = localStorage.getItem('planner_token');
let currentUser = null;
let _currentView = 'tareas';
let _currentDepto = '';
let _actividadesCache = [];

function apiFetch(path, opts = {}) {
  return fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
      ...(opts.headers || {})
    }
  }).then(async r => {
    if (r.status === 401) { doLogout(); return null; }
    if (r.status === 403) {
      const d = await r.json().catch(() => null);
      alert(d?.error || 'Sin permisos');
      return null;
    }
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.error) || r.statusText);
    if (data?.objetivos) _plannerObjectives = data.objetivos;
    return data;
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function tryLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if (!r.ok || !d.token) throw new Error(d.error || 'Error de login');
    token = d.token;
    localStorage.setItem('planner_token', token);
    await initApp();
  } catch (e) {
    document.getElementById('loginErr').textContent = e.message;
  }
}

function doLogout() {
  token = null;
  currentUser = null;
  localStorage.removeItem('planner_token');
  renderLogin();
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h2>Planner Staff</h2>
        <p>Inicia sesion con tu cuenta del sistema</p>
        <div class="form-group"><label>Correo</label><input type="text" id="loginEmail" onkeydown="if(event.key==='Enter')tryLogin()"></div>
        <div class="form-group"><label>Contrasena</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter')tryLogin()"></div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="tryLogin()">Iniciar sesion</button>
        <div class="login-err" id="loginErr"></div>
      </div>
    </div>`;
}

async function initApp() {
  if (!token) return renderLogin();
  try {
    currentUser = await apiFetch('/api/planner/me');
    if (!currentUser) return renderLogin();
    renderApp();
    navigateTo('tareas');
  } catch (e) {
    renderLogin();
  }
}

function navigateTo(view) {
  _ds.loadRequest = (_ds.loadRequest || 0) + 1;
  document.body.classList.remove('planner-focus');
  disposePlannerCharts();
  _currentView = view;
  // Update sidebar active
  document.querySelectorAll('.nav-item,.nav-sub').forEach(el => el.classList.remove('active'));
  const navEl = document.querySelector(`[data-view="${view}"]`);
  if (navEl) navEl.classList.add('active');

  const titles = { tareas: 'Tareas del STAFF', dashboard: 'Dashboard', equipo: 'Gestión de Equipo' };
  if (view.startsWith('daily-')) {
    const d = DEPTOS.find(x => x.id === view.replace('daily-', ''));
    document.getElementById('topbarTitle').textContent = `Daily ${d ? d.nombre : ''}`;
  } else {
    document.getElementById('topbarTitle').textContent = titles[view] || view;
  }

  if (view === 'tareas') renderTareas();
  else if (view === 'dashboard') renderDashboard();
  else if (view === 'equipo') renderEquipo();
  else if (view.startsWith('daily-')) renderDaily(view.replace('daily-', ''));
}

async function cargarActividades() {
  const tabla = document.getElementById('tareasTabla');
  if (tabla) tabla.innerHTML = '<div class="spinner"></div>';

  const params = new URLSearchParams();
  const depto = document.getElementById('fDepto')?.value;
  const estatus = document.getElementById('fEstatus')?.value;
  const urgencia = document.getElementById('fUrgencia')?.value;
  const buscar = document.getElementById('fBuscar')?.value;
  if (depto) params.set('depto', depto);
  if (estatus) params.set('estatus', estatus);
  if (urgencia) params.set('urgencia', urgencia);
  if (buscar) params.set('buscar', buscar);
  if (_tareasFilterMode === 'mis' && currentUser) params.set('mis', currentUser.usuario_id);
  if (_tareasFilterMode === 'creadas' && currentUser) params.set('creadas_por', currentUser.usuario_id);

  const data = await apiFetch('/api/planner/actividades?' + params.toString());
  if (!data) return;
  _actividadesCache = data;

  // KPIs
  const kpisEl = document.getElementById('kpisRow');
  if (kpisEl) {
    const total = data.length;
    const sinEmp = data.filter(a => a.estatus === 'sin_empezar').length;
    const enProc = data.filter(a => a.estatus === 'en_proceso').length;
    const cerradas = data.filter(a => a.estatus === 'cerrada').length;
    const atrasadas = data.filter(a => a.estatus === 'atrasada').length;
    kpisEl.innerHTML = `
      <div class="kpi-row">
        <div class="kpi"><label>Total</label><div class="val">${total}</div></div>
        <div class="kpi"><label>Sin empezar</label><div class="val">${sinEmp}</div></div>
        <div class="kpi orange"><label>En proceso</label><div class="val">${enProc}</div></div>
        <div class="kpi green"><label>Cerradas</label><div class="val">${cerradas}</div></div>
        <div class="kpi red"><label>Atrasadas</label><div class="val">${atrasadas}</div></div>
      </div>`;
  }

  if (!tabla) return;
  if (data.length === 0) {
    tabla.innerHTML = '<div class="empty">No hay actividades que mostrar</div>';
    return;
  }

  if (_tareasFilterMode === 'mis') { tabla.innerHTML = renderMyTasks(data); return; }
  const showRol = false;
  tabla.innerHTML = `
    <table>
      <thead><tr>
        <th>ID</th><th>Actividad</th><th>Responsable</th><th>Depto</th><th>Compromiso</th><th>Urgencia</th><th>Estatus</th><th>Avance</th>${showRol ? '<th>Rol</th>' : ''}<th></th>
      </tr></thead>
      <tbody>
        ${data.map(a => {
          const deptoName = (DEPTOS.find(d => d.id === a.departamento) || {}).nombre || a.departamento;
          const dailyTag = a.correlacion_daily ? `<br><span style="font-size:10px;color:var(--accent)">[Daily: ${a.correlacion_daily.departamento}]</span>` : '';
          let rolTag = '';
          if (showRol && currentUser) {
            if (a.responsable_id === currentUser.usuario_id) rolTag = '<span style="font-size:11px;color:var(--primary);font-weight:600">Responsable</span>';
            else {
              const mySub = (a.sub_responsables || []).find(s => s.id === currentUser.usuario_id);
              rolTag = mySub ? '<span style="font-size:11px;color:var(--accent)">Sub-tarea</span>' : '';
            }
          }
          return `<tr>
            <td style="font-family:monospace;font-size:12px;font-weight:700;color:var(--primary)">${esc(a.id)}</td>
            <td><b>${esc(a.titulo)}</b>${dailyTag}</td>
            <td>${esc(a.responsable_nombre)}${(a.colaboradores||[]).length ? ' <span style="font-size:10px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:8px" title="' + (a.colaboradores||[]).map(c=>c.nombre).join(', ') + '">+' + a.colaboradores.length + '</span>' : ''}</td>
            <td style="font-size:12px">${esc(deptoName)}</td>
            <td style="font-size:12px;white-space:nowrap">${a.fecha_compromiso || '<span style="color:var(--muted)">—</span>'}</td>
            <td><span class="badge ${a.urgencia}">${a.urgencia}</span></td>
            <td><span class="badge ${a.estatus}">${a.estatus.replace('_', ' ')}</span></td>
            <td style="text-align:center">${a.avance}%</td>
            ${showRol ? '<td>' + rolTag + '</td>' : ''}
            <td style="white-space:nowrap">
              <button class="btn btn-primary btn-sm" onclick="verDetalle('${a.id}')">Detalle</button>
            </td>
          </tr>`;
        }).join('')}

}

async function saveNewAct(sendEmail) {
  if (_savingNewActivity) return;
  const titulo = document.getElementById('naTitle').value.trim();
  const descripcion = document.getElementById('naDesc').value.trim();
  const responsable_id = Number(document.getElementById('naResp').value);
  const departamento = document.getElementById('naDepto').value;
  const fecha_compromiso = document.getElementById('naFecha').value || null;
  const urgencia = document.getElementById('naUrg').value;

  if (!titulo || !responsable_id || !departamento) {
    document.getElementById('naErr').textContent = 'Completa los campos obligatorios';
    return;
  }

  _savingNewActivity = true;
  const saveButtons = document.querySelectorAll('#newActModal .modal-footer button');
  saveButtons.forEach(b => b.disabled = true);
  let created = false;
  try {
    const colabSel = document.getElementById('naColabs');
    const colaboradores = colabSel ? Array.from(colabSel.selectedOptions).map(o => Number(o.value)) : [];
    const act = await apiFetch('/api/planner/actividades', {
      method: 'POST',
      body: JSON.stringify({ titulo, descripcion, responsable_id, departamento, fecha_compromiso, urgencia, colaboradores, correlacion_daily: window._newActPresets?.correlacion_daily || null, origen_formulario: window._newActPresets?.correlacion_daily?.formulario || window._newActPresets?.origen_formulario || null, correlacion_compras: window._newActPresets?.correlacion_compras || null })
    });
    if (!act) return;

    created = true;
    const presenting = showCreatedPresentationActivity(act);
    closeModal('newActModal');
    if (presenting) await refreshPresentationActivities();
    else {
      alert('Actividad creada: ' + act.id);
      if (_currentView === 'tareas') cargarActividades();
      else if (_currentView.startsWith('daily-')) selectDailyForm(_dailyDepto, _dailyActiveForm);
    }
    if (sendEmail) {
      const r = await apiFetch(`/api/planner/actividades/${act.id}/mailto?accion=Nueva+actividad+asignada`);
      if (r && r.mailto) window.open(r.mailto, '_blank');
    }
  } catch (e) {
    const error = document.getElementById('naErr');
    if (!created && error) error.textContent = e.message;
    else alert('La actividad fue guardada, pero no se pudo completar la acción posterior: ' + e.message);
  } finally {
    _savingNewActivity = false;
    saveButtons.forEach(b => b.disabled = false);
  }
}

const VALID_URGENCIAS = ['alta', 'media', 'baja'];
const VALID_ESTADOS = ['sin_empezar', 'en_proceso', 'cerrada', 'atrasada', 'pospuesta', 'cancelada'];

async function guardarDetalle(actId) {
  const titulo = document.getElementById('deTitulo').value.trim();
  const estatus = document.getElementById('deEstatus').value;
  const urgencia = document.getElementById('deUrg').value;
  const avance = Number(document.getElementById('deAvance').value);
  const fecha_compromiso = document.getElementById('deFecha').value || null;
  const fecha_inicio = document.getElementById('deFechaInicio').value || null;
  const fecha_fin = document.getElementById('deFechaFin').value || null;
  const colabSel = document.getElementById('deColabs');
  const colaboradores = colabSel ? Array.from(colabSel.selectedOptions).map(o => Number(o.value)) : undefined;

  if (!titulo) { alert('El titulo no puede estar vacio'); return; }

  try {
    const r = await apiFetch('/api/planner/actividades/' + actId, {
      method: 'PATCH',
      body: JSON.stringify({ titulo, estatus, urgencia, avance, fecha_compromiso, fecha_inicio, fecha_fin, colaboradores, responsable_id: Number(document.getElementById('deResp').value) || undefined })
    });
    if (!r) return;

    if (r.mailto) {
      if (confirm('Se actualizo la actividad. ¿Desea enviar correo de notificacion al responsable?')) {
        window.open(r.mailto, '_blank');
      }
    }

    closeModal('detalleModal');
    if (_currentView === 'tareas') cargarActividades();
    else if (_currentView.startsWith('daily-')) selectDailyForm(_dailyDepto, _dailyActiveForm);
    else if (document.getElementById('plannerPendingPanel')) await refreshPresentationActivities();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function enviarCorreo(actId) {
  try {
    const r = await apiFetch(`/api/planner/actividades/${actId}/mailto?accion=Actualizacion+de+actividad`);
    if (r && r.mailto) window.open(r.mailto, '_blank');
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function eliminarActividad(actId) {
  if (!confirm('¿Eliminar actividad ' + actId + '? Esta accion no se puede deshacer.')) return;
  try {
    const r = await apiFetch('/api/planner/actividades/' + actId, { method: 'DELETE' });
    if (r && r.ok) {
      closeModal('detalleModal');
      alert('Actividad eliminada');
      if (_currentView === 'tareas') cargarActividades();
    else if (_currentView.startsWith('daily-')) selectDailyForm(_dailyDepto, _dailyActiveForm);
    else if (document.getElementById('plannerPendingPanel')) await refreshPresentationActivities();
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

let _mentionQuery = '';
function onCommentInput(ta) {
  const val = ta.value;
  const cursor = ta.selectionStart;
  const before = val.slice(0, cursor);
  const atMatch = before.match(/@([a-zA-ZáéíóúñÁÉÍÓÚÑ ]*)$/);
  const listEl = document.getElementById('cmMentionList');
  if (!atMatch) { listEl.style.display = 'none'; return; }
  _mentionQuery = atMatch[1].toLowerCase();
  const filtered = _staffDisponibles.filter(u => u.nombre.toLowerCase().includes(_mentionQuery)).slice(0, 8);
  if (!filtered.length) { listEl.style.display = 'none'; return; }
  listEl.style.display = 'block';
  listEl.innerHTML = filtered.map(u => `<div style="padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)" onmousedown="insertMention(${u.id},'${esc(u.nombre)}')">${esc(u.nombre)}</div>`).join('');
}

function insertMention(userId, name) {
  const ta = document.getElementById('cmTexto');
  if (!ta) return;
  const cursor = ta.selectionStart;
  const before = ta.value.slice(0, cursor);
  const after = ta.value.slice(cursor);
  const atIdx = before.lastIndexOf('@');
  ta.value = before.slice(0, atIdx) + `@[${name}](${userId}) ` + after;
  document.getElementById('cmMentionList').style.display = 'none';
  ta.focus();
  const newPos = atIdx + `@[${name}](${userId}) `.length;
  ta.setSelectionRange(newPos, newPos);
}

async function submitComment(actId, subId) {
  const texto = document.getElementById('cmTexto')?.value?.trim();
  if (!texto) { document.getElementById('cmErr').textContent = 'Escribe un comentario'; return; }
  const url = subId
    ? `/api/planner/actividades/${actId}/sub/${subId}/comentario`
    : `/api/planner/actividades/${actId}/comentario`;
  try {
    const result = await apiFetch(url, { method: 'POST', body: JSON.stringify({ texto }) });
    if (result?.mailto && confirm('Comentario guardado. ¿Preparar correo para las personas mencionadas?')) window.open(result.mailto, '_blank');
    closeModal('commentModal');
    closeModal('detalleModal');
    await refreshPlannerCommentSlides();
    verDetalle(actId);
  } catch (e) { document.getElementById('cmErr').textContent = e.message; }
}

function addSubComment(actId, subId) {
  openCommentModal(actId, subId);
}

let _dailyDate = '';
let _dailyDepto = '';
let _dailyActiveForm = '';
let _dailyResumen = null;
let _dailyRegistro = null;
let _ptarConfig = null;

function getDailyForms(deptoId) {
  return DAILY_FORMS_META[deptoId] || null;
}

async function renderDaily(deptoId) {
  _dailyDepto = deptoId;
  _dailyDate = _dailyDate || yesterdayMx();
  _dailyActiveForm = '';
  _dailyRegistro = null;

  const forms = getDailyForms(deptoId);
  if (!forms) {
    renderDailyPlaceholder(deptoId);
    return;
  }

  const m = document.getElementById('mainContent');
  m.innerHTML = '<div class="spinner"></div>';

  _dailyResumen = await apiFetch(`/api/planner/daily/${deptoId}/resumen?fecha=${_dailyDate}`);
  if (!_dailyResumen) return;

  const d = DEPTOS.find(x => x.id === deptoId);
  const llenados = _dailyResumen.formularios.filter(f => f.llenado).length;
  const total = _dailyResumen.formularios.length;

  m.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap">
      <div class="form-group" style="margin:0">
        <label>Fecha</label>
        <input type="date" id="dailyDatePick" value="${_dailyDate}" onchange="_dailyDate=this.value;renderDaily('${deptoId}')" style="padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:13px">
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:24px">${d ? d.icon : ''}</span>
        <span style="font-weight:700;font-size:15px;color:var(--primary)">${d ? d.nombre : deptoId}</span>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <span class="badge ${llenados === total ? 'cerrada' : llenados > 0 ? 'en_proceso' : 'sin_empezar'}" style="font-size:12px;padding:5px 12px">
          ${llenados}/${total} formularios
        </span>
      </div>
    </div>
    <div class="tabs" id="dailyTabs">
      ${forms.map(f => {
        const info = _dailyResumen.formularios.find(x => x.id === f.id);
        const dot = info && info.llenado ? '🟢' : '⚪';
        return `<div class="tab" data-form="${f.id}" onclick="selectDailyForm('${deptoId}','${f.id}')">${dot} ${f.icon} ${f.nombre}</div>`;
      }).join('')}
    </div>
    <div id="dailyFormContent">
      <div class="empty">Selecciona un formulario arriba</div>
    </div>`;
}

function todayMx() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
}
function yesterdayMx() {
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Mexico_City' }));
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

async function selectDailyForm(deptoId, formId) {
  _dailyActiveForm = formId;
  document.querySelectorAll('#dailyTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.form === formId));

  const container = document.getElementById('dailyFormContent');
  container.innerHTML = '<div class="spinner"></div>';

  const data = await apiFetch(`/api/planner/daily/${deptoId}/${formId}?fecha=${_dailyDate}`);
  if (!data) return;
  _dailyRegistro = data.registro || (data.datos_sugeridos ? { datos: data.datos_sugeridos, sugerido: true } : null);
  _dailyVersion = data.registro?.version || 0;
  _rhhPlantillaSnapshot = data.registro?.datos?.plantilla || null;
  _rhhHorasSnapshot = data.registro?.datos?.registros || null;

  // Render form based on department + form
  if (deptoId === 'smya') renderSmyaForm(formId, container);
  else if (deptoId === 'rhh') renderRhhForm(formId, container);
  else if (deptoId === 'produccion') renderProduccionForm(formId, container);
  else if (deptoId === 'calidad') renderCalidadForm(formId, container);
  else if (deptoId === 'mantenimiento') renderMantenimientoForm(formId, container);
  else if (deptoId === 'compras') renderComprasForm(formId, container);
  else if (deptoId === 'procesos') renderProcesosForm(formId, container);
  else if (deptoId === 'sgc') renderSgcForm(formId, container);
  else if (deptoId === 'operaciones') renderOperacionesForm(formId, container);
  else container.innerHTML = '<div class="empty">Formulario no disponible aun</div>';
}

function openPtarConfigModal() {
  const cfg = (_ptarConfig && _ptarConfig.dias_retrolavado) || [1, 3, 5];
  const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado'];
  const html = `

      <div class="modal-box" style="max-width:400px">

          <h3>Config. Retrolavado PTAR</h3>
          <button class="modal-close" onclick="closeModal('ptarConfigModal')">&times;</button>
        </div>
        <div class="modal-body">
          <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Selecciona los dias de la semana en que aplica retrolavado:</p>
          ${dayNames.map((name, i) => `
            <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;cursor:pointer">
              <input type="checkbox" class="ptarDayChk" value="${i}" ${cfg.includes(i) ? 'checked' : ''}>
              ${name}
            </label>
          `).join('')}
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal('ptarConfigModal')">Cancelar</button>
          <button class="btn btn-primary" onclick="savePtarConfig()">Guardar</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function savePtarConfig() {
  const checked = [...document.querySelectorAll('.ptarDayChk:checked')].map(c => Number(c.value));
  try {
    const r = await apiFetch('/api/planner/config/ptar', {
      method: 'PATCH',
      body: JSON.stringify({ dias_retrolavado: checked })
    });
    if (r && r.ok) {
      _ptarConfig = r.config_ptar;
      closeModal('ptarConfigModal');
      selectDailyForm(_dailyDepto, 'ptar');
    }
  } catch (e) { alert(e.message); }
}

const STATUS_LABELS = {
  retardo: 'Retardo', falta: 'Falta', vacaciones: 'Vacaciones', incapacidad: 'Incapacidad',
  permiso: 'Permiso', permiso_con_goce: 'Permiso C/G', permiso_sin_goce: 'Permiso S/G',
  tiempo_extra: 'Tiempo Extra', cumpleanos: 'Cumpleaños'
};

async function _loadRhhAusentismo() {
  const data = await apiFetch('/api/planner/integracion/rhh/ausentismo?fecha=' + _dailyDate);
  if (!data) return;
  const { registros, resumen } = data;

  // Update KPI counters
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('df_kpi_retardos', resumen.retardo || 0);
  set('df_kpi_faltas', resumen.falta || 0);
  set('df_kpi_vac', resumen.vacaciones || 0);
  set('df_kpi_incap', resumen.incapacidad || 0);
  const permisos = (resumen.permiso || 0) + (resumen.permiso_con_goce || 0) + (resumen.permiso_sin_goce || 0);
  set('df_kpi_perm', permisos);
  const otros = (resumen.tiempo_extra || 0) + (resumen.cumpleanos || 0);
  set('df_kpi_otros', otros);

  // Hidden inputs
  const si = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  si('df_retardos', resumen.retardo || 0);
  si('df_faltas', resumen.falta || 0);
  si('df_vacaciones', resumen.vacaciones || 0);
  si('df_incapacidad', resumen.incapacidad || 0);
  si('df_permisos', permisos);
  si('df_otros', otros);
  si('df_registros_json', JSON.stringify(registros));

  // Build table
  const tbl = document.getElementById('df_ausen_table');
  if (tbl) {
    if (registros.length === 0) {
      tbl.innerHTML = '<p style="color:var(--green);font-weight:600">Sin incidencias registradas para este dia</p>';
    } else {
      tbl.innerHTML = '<table style="width:100%;font-size:12px"><thead><tr><th>Nombre</th><th>Puesto</th><th>Incidencia</th><th>Notas</th></tr></thead><tbody>' +
        registros.map(r => '<tr><td><strong>' + esc(r.nombre) + '</strong></td><td style="color:var(--muted)">' + esc(r.puesto_nombre || '') + '</td><td><span class="badge atrasada" style="font-size:10px">' + (STATUS_LABELS[r.status] || r.status) + '</span></td><td style="color:var(--muted);font-size:11px">' + esc(r.notes || '') + '</td></tr>').join('') +
        '</tbody></table>';
    }
  }
}

async function _loadRhhPlantilla() {
  const data = await apiFetch('/api/planner/integracion/rhh/plantilla');
  if (!data) return;
  const { puestos, resumen } = data;
  _rhhPlantillaSnapshot = data;

  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('df_kpi_req', resumen.total_requerido);
  set('df_kpi_act', resumen.total_actual);
  set('df_kpi_cob', resumen.porcentaje_global + '%');
  const cobEl = document.getElementById('df_kpi_cob');
  if (cobEl) cobEl.style.color = resumen.porcentaje_global >= 100 ? 'var(--green)' : 'var(--red)';
  set('df_kpi_vacantes', resumen.vacantes_abiertas);

  const si = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  si('df_requeridos', resumen.total_requerido);
  si('df_disponibles', resumen.total_actual);
  si('df_vacantes_ab', resumen.vacantes_abiertas);

  const tbl = document.getElementById('df_plantilla_table');
  if (tbl) {
    const vacantes = puestos.filter(p => p.vacantes_abiertas > 0);
    if (vacantes.length === 0) {
      tbl.innerHTML = '<p style="color:var(--green);font-weight:600">Plantilla completa — sin vacantes abiertas</p>';
    } else {
      tbl.innerHTML = '<table style="width:100%;font-size:12px"><thead><tr><th>Puesto</th><th>Depto</th><th style="text-align:center">Req</th><th style="text-align:center">Act</th><th style="text-align:center">%</th><th style="text-align:center">Vacantes</th></tr></thead><tbody>' +
        vacantes.map(p => '<tr><td><strong>' + esc(p.puesto) + '</strong></td><td style="color:var(--muted)">' + esc(p.departamento) + '</td><td style="text-align:center">' + p.requerido + '</td><td style="text-align:center">' + p.actual + '</td><td style="text-align:center;color:' + (p.porcentaje >= 100 ? 'var(--green)' : 'var(--red)') + ';font-weight:700">' + p.porcentaje + '%</td><td style="text-align:center;color:var(--red);font-weight:700">' + p.vacantes_abiertas + '</td></tr>').join('') +
        '</tbody></table>';
    }
  }
}

async function _loadRhhVacantes() {
  const data = await apiFetch('/api/planner/integracion/rhh/plantilla');
  if (!data) return;
  const vacantes = data.puestos.filter(p => p.vacantes_abiertas > 0);
  const registradas = data.vacantes || [];
  const list = document.getElementById('df_vacantes_list');
  if (!list) return;
  list.innerHTML = '';
  vacantes.forEach(v => {
    for (let i = 0; i < v.vacantes_abiertas; i++) {
      list.insertAdjacentHTML('beforeend', vacantRow(0, { puesto: v.puesto + ' (' + v.departamento + ')', fecha_apertura: registradas.filter(r => r.puesto === v.puesto)[i]?.fecha_apertura || '', prioridad: registradas.filter(r => r.puesto === v.puesto)[i]?.prioridad || 'media' }));
    }
  });
  if (vacantes.length === 0) {
    list.innerHTML = '<p style="color:var(--green);font-size:12px">Sin vacantes abiertas segun plantilla</p>';
  }
}

async function _loadRhhHorasExtra() {
  const data = await apiFetch('/api/planner/integracion/rhh/horas-extra?fecha=' + _dailyDate);
  _rhhHorasSnapshot = data?.registros || [];
  if (!data) return;
  const { registros, resumen } = data;

  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('df_kpi_hrs_aut', resumen.horas_autorizadas || 0);
  set('df_kpi_hrs_pend', resumen.horas_pendientes || 0);
  set('df_kpi_personas', resumen.total || 0);

  const si = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  si('df_total_he', (resumen.horas_autorizadas || 0) + (resumen.horas_pendientes || 0));
  si('df_personas_he', resumen.total || 0);
  si('df_hrs_aut', resumen.horas_autorizadas || 0);
  si('df_hrs_pend', resumen.horas_pendientes || 0);

  const tbl = document.getElementById('df_he_table');
  if (tbl) {
    if (registros.length === 0) {
      tbl.innerHTML = '<p style="color:var(--muted)">Sin vales de tiempo extra esta semana (' + data.semana.inicio + ' a ' + data.semana.fin + ')</p>';
    } else {
      const statusBadge = s => s === 'autorizado' ? 'cerrada' : s === 'pendiente' ? 'en_proceso' : 'sin_empezar';
      tbl.innerHTML = '<p style="font-size:11px;color:var(--muted);margin-bottom:6px">Semana: ' + data.semana.inicio + ' a ' + data.semana.fin + '</p>' +
        '<table style="width:100%;font-size:12px"><thead><tr><th>Nombre</th><th>Fecha</th><th>Horas</th><th>Razon</th><th>Status</th></tr></thead><tbody>' +
        registros.map(r => '<tr><td><strong>' + esc(r.nombre) + '</strong></td><td>' + r.fecha + '</td><td style="font-weight:700">' + r.horas + 'h</td><td style="color:var(--muted)">' + esc(r.razon || '') + '</td><td><span class="badge ' + statusBadge(r.status) + '" style="font-size:10px">' + r.status + '</span></td></tr>').join('') +
        '</tbody></table>';
    }
  }

function plannerPurchasesHtml(comp) {
  if (!comp) return '<p class="planner-help">No se pudieron cargar las compras pendientes.</p>';
  const groups = Array.isArray(comp.por_estatus) ? comp.por_estatus : Object.entries(comp.por_estatus || {}).map(([estatus,g])=>({...g,estatus}));
  const items = groups.flatMap(g=>(g.items || []).filter(i=>i.vencida || i.urgente).map(i=>({...i,estatus:g.estatus})));
  return `<h3>Compras pendientes · Vencidas o urgentes</h3><p class="planner-help">Pendientes al ${plannerDate(comp.fecha)}. Vencidas: compromiso anterior a esta fecha. Urgentes: prioridad alta.</p>
    ${dsKpiGrid([[items.length,'Partidas pendientes','var(--primary)'],[items.filter(i=>i.vencida).length,'Vencidas','var(--red)'],[items.filter(i=>i.urgente).length,'Urgentes','var(--orange)']])}

async function renderCpkForm(container) {
  const datos = (_dailyRegistro && _dailyRegistro.datos) || {};
  const commentsDraft = document.getElementById('df_wrap_comments')?.value ?? datos.comentarios ?? '';
  const observationsDraft = document.getElementById('df_obs_cpk')?.value ?? datos.observaciones ?? '';
  // Leer y validar antes de reemplazar los campos por el indicador de carga.
  const cpkDesde = document.getElementById('cpk_desde')?.value || '';
  const cpkHasta = document.getElementById('cpk_hasta')?.value || '';
  if ((cpkDesde || cpkHasta) && !(cpkDesde && cpkHasta)) {
    alert('Selecciona ambas fechas: Desde y Hasta.');
    return;
  }
  if (cpkDesde && cpkHasta && cpkDesde > cpkHasta) {
    alert('La fecha Desde no puede ser posterior a la fecha Hasta.');
    return;
  }
  container.innerHTML = '<div class="spinner"></div>';
  const cpkQs = cpkDesde && cpkHasta ? `?desde=${cpkDesde}&hasta=${cpkHasta}` : '';
  const [cpkData, empData] = await Promise.all([
    apiFetch('/api/planner/integracion/vales/cpk' + cpkQs),
    apiFetch('/api/planner/integracion/empaque/cpk' + cpkQs)
  ]);
  const tits = cpkData ? cpkData.titulaciones : {};
  const cpkParamsList = cpkData ? (cpkData.cpk_params || []) : [];
  const cpkSemana = cpkData && cpkData.semana ? cpkData.semana : null;
  const empPartes = empData ? empData.partes : [];
  const lineas = ['Baker', 'L1', 'L3', 'L4'];

  function cpkBadge(val) {
    if (val == null) return '<span style="color:var(--muted)">—</span>';
    const v = Math.round(val * 100) / 100;
    if (v >= 1.67) return '<span style="color:#059669;font-weight:700">' + v.toFixed(2) + '</span>';
    if (v >= 1.33) return '<span style="color:#059669;font-weight:600">' + v.toFixed(2) + '</span>';
    if (v >= 1.0) return '<span style="color:#b45309;font-weight:600">' + v.toFixed(2) + '</span>';
    return '<span style="color:#b91c1c;font-weight:700">' + v.toFixed(2) + '</span>';
  }

  container.innerHTML = dailyFormWrap('CP / CPK — Titulaciones + Empaque', `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <p style="font-size:12px;color:var(--muted);margin:0">Datos de Vales/Calidad + Flujo Materiales (Empaque)</p>
      <div style="display:flex;align-items:center;gap:6px">
        <label style="font-size:11px;color:var(--muted)">Desde</label>
        <input type="date" id="cpk_desde" value="${cpkData?.semana?.ini || ''}" style="font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:4px">
        <label style="font-size:11px;color:var(--muted)">Hasta</label>
        <input type="date" id="cpk_hasta" value="${cpkData?.semana?.fin || ''}" style="font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:4px">
        <button class="btn btn-outline btn-sm" onclick="renderCpkForm(document.getElementById('dailyFormContent'))">Consultar</button>
      </div>
    </div>
    <h4 style="margin:0 0 10px;font-size:14px;color:var(--primary)">Titulaciones por Proceso</h4>
    ${lineas.map(l => {
      const headers = tits[l] || [];
      if (headers.length === 0) return '<div style="font-size:12px;color:var(--muted);margin-bottom:8px"><b>' + l + ':</b> Sin titulaciones recientes</div>';
      return '<div style="margin-bottom:14px;border:1px solid var(--line);border-radius:8px;padding:12px">' +
        '<b style="font-size:13px;color:var(--primary)">' + l + '</b>' +
        '<table style="font-size:11px;margin-top:6px"><thead><tr><th>Fecha</th><th>Turno</th><th>#</th><th>Estado</th><th>Params</th><th>Fuera</th><th>Analista</th></tr></thead><tbody>' +
        headers.map(h => '<tr><td>' + h.fecha + '</td><td>' + h.turno + '</td><td>' + h.numero + '</td>' +
          '<td><span class="badge ' + (h.estado === 'completo' ? 'cerrada' : h.estado === 'fuera_de_rango' ? 'atrasada' : 'sin_empezar') + '" style="font-size:10px">' + h.estado + '</span></td>' +
          '<td>' + h.parametros_total + '</td><td style="color:' + (h.parametros_fuera > 0 ? 'var(--red)' : 'var(--green)') + ';font-weight:700">' + h.parametros_fuera + '</td>' +
          '<td style="font-size:10px">' + esc(h.analista || '') + '</td></tr>').join('') +
        '</tbody></table></div>';
    }).join('')}
    <h4 style="margin:20px 0 10px;font-size:14px;color:var(--primary)">CPK Peso Fosfato ${cpkSemana ? '<span style="font-size:11px;color:var(--muted);font-weight:400">(Periodo ' + cpkSemana.ini + ' al ' + cpkSemana.fin + ')</span>' : ''}</h4>
    ${cpkParamsList.length === 0 ? '<p style="font-size:12px;color:var(--muted)">Sin datos de Peso Fosfato disponibles</p>' :
      '<table style="font-size:11px;width:100%"><thead><tr><th>Tanque</th><th>n</th><th style="text-align:center">Media</th><th style="text-align:center">Sigma</th><th style="text-align:center">LSL – USL</th><th style="text-align:center">Cp</th><th style="text-align:center">Cpk</th></tr></thead><tbody>' +
      cpkParamsList.map(p => '<tr>' +
        '<td><strong>' + esc(p.tanque || '') + '</strong> <span style="font-size:10px;color:var(--muted)">' + esc(p.unidad || '') + '</span></td>' +
        '<td>' + p.n + '</td>' +
        '<td style="text-align:center">' + (p.mean != null ? p.mean : '—') + '</td>' +
        '<td style="text-align:center">' + (p.sigma != null ? p.sigma : '—') + '</td>' +
        '<td style="text-align:center;font-size:10px;color:var(--muted)">' + (p.lsl ?? '—') + ' – ' + (p.usl ?? '—') + '</td>' +
        '<td style="text-align:center">' + cpkBadge(p.cp) + '</td>' +
        '<td style="text-align:center">' + cpkBadge(p.cpk) + '</td>' +
      '</tr>').join('') +
      '</tbody></table>'}
    <h4 style="margin:20px 0 10px;font-size:14px;color:var(--primary)">CPK Empaque (Tenneco) ${cpkSemana ? '<span style="font-size:11px;color:var(--muted);font-weight:400">(Periodo ' + cpkSemana.ini + ' al ' + cpkSemana.fin + ')</span>' : ''}</h4>
    ${empPartes.length === 0 ? '<p style="font-size:12px;color:var(--muted)">Sin datos de empaque disponibles</p>' :
      '<table style="font-size:11px;width:100%"><thead><tr><th>N. Parte</th><th>n</th><th style="text-align:center">Rugosidad CPK</th><th style="text-align:center">Rug. Media</th><th style="text-align:center">Rug. Limites</th><th style="text-align:center">Alt. Axial CPK</th><th style="text-align:center">Alt. Media</th><th style="text-align:center">Alt. Limites</th></tr></thead><tbody>' +
      empPartes.map(p => '<tr>' +
        '<td><strong>' + esc(p.numero_parte) + '</strong></td>' +
        '<td>' + p.muestras + '</td>' +
        '<td style="text-align:center">' + (p.rugosidad.na ? '<span style="color:var(--muted)">N/A</span>' : cpkBadge(p.rugosidad.cpk)) + '</td>' +
        '<td style="text-align:center">' + (p.rugosidad.mean != null ? p.rugosidad.mean : '—') + '</td>' +
        '<td style="text-align:center;font-size:10px;color:var(--muted)">' + (p.rugosidad.na ? 'N/A' : (p.rugosidad.lsl ?? '—') + ' – ' + (p.rugosidad.usl ?? '—')) + '</td>' +
        '<td style="text-align:center">' + cpkBadge(p.altura_axial.cpk) + '</td>' +
        '<td style="text-align:center">' + (p.altura_axial.mean != null ? p.altura_axial.mean : '—') + '</td>' +
        '<td style="text-align:center;font-size:10px;color:var(--muted)">' + (p.altura_axial.lsl ?? '—') + ' – ' + (p.altura_axial.usl ?? '—') + '</td>' +
      '</tr>').join('') +
      '</tbody></table>'}
    <div class="form-group" style="margin-top:12px"><label>Observaciones</label><textarea id="df_obs_cpk" rows="2">${esc(observationsDraft)}</textarea></div>
  `, () => ({
    observaciones: document.getElementById('df_obs_cpk').value.trim(),
    periodo: cpkSemana,
    titulaciones: tits,
    cpk_params: cpkParamsList.map(function(p) { return { tanque: p.tanque, unidad: p.unidad, n: p.n, mean: p.mean, sigma: p.sigma, lsl: p.lsl, usl: p.usl, cp: p.cp, cpk: p.cpk }; }),
    empaque_partes: empPartes.map(function(p) { return { numero_parte: p.numero_parte, muestras: p.muestras, rug_cpk: p.rugosidad.cpk, rug_na: !!p.rugosidad.na, alt_cpk: p.altura_axial.cpk }; })
  }), commentsDraft);
}

async function saveSinNovedadForm(deptoId, formId, label) {
  if (_dailySaving) return;
  const current = _currentDailyGetData ? _currentDailyGetData() : {};
  const hasRows = ['items', 'issues', 'equipos', 'registros'].some(k => current[k]?.length);
  if (hasRows && !confirm('Hay datos capturados. ¿Confirmas registrar "' + label + '" y retirar las filas actuales? La version guardada anterior se conserva en el historial.')) return;
  const datos = { sin_novedad: true, items: [], issues: [], equipos: [], comentarios: current.comentarios || '' };
  _dailySaving = true;
  try {
    const r = await apiFetch('/api/planner/daily/' + deptoId + '/' + formId, { method: 'POST', body: JSON.stringify({ fecha: _dailyDate, version: _dailyVersion, datos }) });

async function saveDailyForm() {
  if (!_currentDailyGetData || _dailySaving) return;
  const datos = _currentDailyGetData();
  const msg = document.getElementById('dailySaveMsg') || document.createElement('span');
  _dailySaving = true;

  try {
    msg.textContent = 'Guardando...';
    msg.style.color = 'var(--accent)';
    const r = await apiFetch(`/api/planner/daily/${_dailyDepto}/${_dailyActiveForm}`, {
      method: 'POST',
      body: JSON.stringify({ fecha: _dailyDate, version: _dailyVersion, datos })
    });
    if (r && r.ok) {
      _dailyRegistro = r.registro;
      _dailyVersion = r.registro.version;
      msg.textContent = 'Guardado correctamente';
      msg.style.color = 'var(--green)';
      if (_dailyDepto === 'smya' && _dailyActiveForm === 'scrap') await refreshScrapSummary();
      // Refresh resumen badges
      const resumen = await apiFetch(`/api/planner/daily/${_dailyDepto}/resumen?fecha=${_dailyDate}`);
      if (resumen) {
        _dailyResumen = resumen;
        const tabs = document.querySelectorAll('#dailyTabs .tab');
        tabs.forEach(t => {
          const fid = t.dataset.form;
          const info = resumen.formularios.find(x => x.id === fid);
          const forms = getDailyForms(_dailyDepto);
          const fm = forms.find(f => f.id === fid);
          if (info && fm) {
            const dot = info.llenado ? '🟢' : '⚪';
            t.innerHTML = `${dot} ${fm.icon} ${fm.nombre}`;
          }
        });
        // Update header badge
        const llenados = resumen.formularios.filter(f => f.llenado).length;
        const total = resumen.formularios.length;
        const headerBadge = document.querySelector('.content .badge');
        if (headerBadge) {
          headerBadge.className = `badge ${llenados === total ? 'cerrada' : llenados > 0 ? 'en_proceso' : 'sin_empezar'}`;
          headerBadge.textContent = `${llenados}/${total} formularios`;
        }
      }
    }
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = 'var(--red)';
    alert(e.message);
  } finally { _dailySaving = false; }
}

function formatDailyDatos(datos) {
  function valueHtml(value, key = '') {
    if (value == null || value === '') return '—';
    if (typeof value === 'boolean') return value ? 'Sí' : 'No';
    if (typeof value === 'number') return /(^id$|_id$|numero_parte)/.test(key) ? esc(String(value)) : plannerFmt(value, 2);
    if (typeof value === 'string') return /^\d{4}-\d{2}-\d{2}$/.test(value) ? plannerDate(value) : esc(plannerLabel(value));
    if (Array.isArray(value)) return value.length ? '<ol>' + value.map(v => '<li>' + valueHtml(v) + '</li>').join('') + '</ol>' : 'Sin registros';
    return '<dl class="planner-data-list">' + Object.entries(value).filter(([k]) => !['_plantilla_html','_he_html'].includes(k)).map(([k,v]) => '<div><dt>' + esc(dsLabel(k)) + '</dt><dd>' + valueHtml(v,k) + '</dd></div>').join('') + '</dl>';
  }
  return valueHtml(datos || {});
}

    m.innerHTML = '<div class="empty-state"><h3>Acceso restringido</h3><p>Solo administradores del Planner pueden gestionar el equipo.</p></div>';
    return;
  }
  m.innerHTML = '<div class="spinner"></div>';

  const [staff, disponibles] = await Promise.all([
    apiFetch('/api/planner/staff'),
    apiFetch('/api/planner/staff/disponibles?todos=1')
  ]);
  if (!disponibles) { m.innerHTML = '<div class="empty-state"><p>Error cargando usuarios</p></div>'; return; }

  const asigMap = {};
  (staff || []).forEach(s => { asigMap[s.usuario_id] = s; });

  const deptoOpts = DEPTOS.map(d => `<option value="${d.id}">${d.icon} ${d.nombre}</option>`).join('');

  m.innerHTML = `
    <div style="margin-bottom:18px">
      <h3 style="margin:0 0 4px">Asignación de usuarios al Planner</h3>
      <p style="margin:0;font-size:13px;color:var(--muted)">Asigna rol y departamentos a cada usuario para darle acceso al módulo.</p>
    </div>
    <div style="overflow-x:auto">
      <table class="table">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Email</th>
            <th>Rol sistema</th>
            <th style="min-width:120px">Rol Planner</th>
            <th style="min-width:200px">Departamentos</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${disponibles.map(u => {
            const a = asigMap[u.id];
            const role = a ? a.planner_role : '';
            const deptos = a ? (a.departamentos || []) : [];
            return `<tr id="eq-row-${u.id}">
              <td><strong>${esc(u.nombre)}</strong></td>
              <td style="font-size:12px;color:var(--muted)">${esc(u.email)}</td>
              <td><span class="badge sin_empezar">${esc(u.role)}</span></td>
              <td>
                <select id="eq-role-${u.id}" style="padding:5px 8px;border:1.5px solid var(--line);border-radius:6px;font-size:12px;width:100%">
                  <option value=""${!role ? ' selected' : ''}>— Sin acceso —</option>
                  <option value="admin"${role === 'admin' ? ' selected' : ''}>Admin</option>
                  <option value="staff"${role === 'staff' ? ' selected' : ''}>Staff</option>
                </select>
              </td>
              <td>
                <div style="display:flex;flex-wrap:wrap;gap:4px" id="eq-deptos-${u.id}">
                  ${DEPTOS.map(d => `
                    <label style="font-size:11px;display:flex;align-items:center;gap:2px;cursor:pointer;background:${deptos.includes(d.id) ? 'var(--primary)' : 'var(--bg-alt)'};color:${deptos.includes(d.id) ? '#fff' : 'var(--text)'};padding:2px 7px;border-radius:10px;transition:all .15s">
                      <input type="checkbox" value="${d.id}" ${deptos.includes(d.id) ? 'checked' : ''} style="display:none" onchange="toggleDeptoPill(this)">
                      ${d.icon} ${d.nombre}
                    </label>
                  `).join('')}
                </div>
              </td>
              <td>
                <button class="btn btn-sm" onclick="guardarAsignacion(${u.id})" style="white-space:nowrap">Guardar</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function toggleDeptoPill(cb) {
  const lbl = cb.parentElement;
  if (cb.checked) {
    lbl.style.background = 'var(--primary)';
    lbl.style.color = '#fff';
  } else {
    lbl.style.background = 'var(--bg-alt)';
    lbl.style.color = 'var(--text)';
  }
}

async function guardarAsignacion(userId) {
  const roleEl = document.getElementById('eq-role-' + userId);
  const deptoCont = document.getElementById('eq-deptos-' + userId);
  if (!roleEl || !deptoCont) return;

  const planner_role = roleEl.value || null;
  const departamentos = [...deptoCont.querySelectorAll('input:checked')].map(c => c.value);

  const res = await apiFetch('/api/planner/staff/asignar', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario_id: userId, planner_role, departamentos })
  });
  if (res && res.ok) {
    const row = document.getElementById('eq-row-' + userId);
    if (row) {
      row.style.transition = 'background .3s';
      row.style.background = 'rgba(16,185,129,.12)';
      setTimeout(() => { row.style.background = ''; }, 1200);
    }
  }
}

  const canvasId = 'weekChart_' + deptoId;

  card.innerHTML =

function renderWeeklyDeptoChart(deptoId, data) {
  if (typeof Chart === 'undefined') return;
  const labels = data.semana.dias.map(d => d.slice(5));

  // Daily compliance + actividades
  const ctx = document.getElementById('weekChart_' + deptoId);
  if (ctx) {
    const dailyPcts = data.daily_compliance.map(d => d.total > 0 ? Math.round(d.llenados / d.total * 100) : 0);
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Creadas', data: data.actividades_trend.map(t => t.creadas), backgroundColor: 'rgba(41,128,185,.6)', borderRadius: 3, order: 2 },
          { label: 'Cerradas', data: data.actividades_trend.map(t => t.cerradas), backgroundColor: 'rgba(39,174,96,.6)', borderRadius: 3, order: 2 },
          { label: 'Daily %', data: dailyPcts, type: 'line', borderColor: 'rgba(142,68,173,.8)', backgroundColor: 'transparent', tension: .3, pointRadius: 3, yAxisID: 'pct', order: 1 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } }, position: 'left' },
          pct: { beginAtZero: true, max: 100, position: 'right', ticks: { callback: v => v + '%', font: { size: 10 } }, grid: { drawOnChartArea: false } },
          x: { ticks: { font: { size: 10 } } }
        }
      }
    });
  }

  // Integracion chart
  const int = data.integracion;
  const ctxInt = document.getElementById('weekIntChart_' + deptoId);
  if (!ctxInt || !int) return;

  if (int.paros_por_dia) {
    new Chart(ctxInt, {
      type: 'bar',
      data: { labels, datasets: [
        { label: 'Paros', data: int.paros_por_dia.map(d => d.count), backgroundColor: 'rgba(192,57,43,.6)', borderRadius: 3 },
        { label: 'Min. paro', data: int.paros_por_dia.map(d => d.min_total), type: 'line', borderColor: 'rgba(192,57,43,.8)', backgroundColor: 'transparent', tension: .3, pointRadius: 3, yAxisID: 'y2' }
      ]},
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }, title: { display: true, text: 'Paros de produccion', font: { size: 11 } } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } } }, y2: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
    });
  }
  if (int.ots_por_dia) {
    new Chart(ctxInt, {
      type: 'bar',
      data: { labels, datasets: [
        { label: 'OTs creadas', data: int.ots_por_dia.map(d => d.creadas), backgroundColor: 'rgba(41,128,185,.6)', borderRadius: 3 },
        { label: 'OTs cerradas', data: int.ots_por_dia.map(d => d.cerradas), backgroundColor: 'rgba(39,174,96,.6)', borderRadius: 3 }
      ]},
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }, title: { display: true, text: 'Ordenes de trabajo', font: { size: 11 } } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
    });
  }
  if (int.reqs_por_dia) {
    new Chart(ctxInt, {
      type: 'bar',
      data: { labels, datasets: [
        { label: 'Requisiciones', data: int.reqs_por_dia.map(d => d.creadas), backgroundColor: 'rgba(41,128,185,.6)', borderRadius: 3 }
      ]},
      options: { responsive: true, plugins: { legend: { display: false }, title: { display: true, text: 'Requisiciones creadas', font: { size: 11 } } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
    });
  }
  if (int.titulaciones_por_dia) {
    new Chart(ctxInt, {
      type: 'bar',
      data: { labels, datasets: [
        { label: 'Titulaciones', data: int.titulaciones_por_dia.map(d => d.count), backgroundColor: 'rgba(41,128,185,.6)', borderRadius: 3 },
        { label: 'Fuera rango', data: int.titulaciones_por_dia.map(d => d.fuera), backgroundColor: 'rgba(192,57,43,.6)', borderRadius: 3 }
      ]},
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }, title: { display: true, text: 'Titulaciones calidad', font: { size: 11 } } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
    });
  }
}

// Keyboard nav
document.addEventListener('keydown', function(e) {
  if (!_ds.slides.length || _currentView !== 'dashboard') return;
  if (document.querySelector('.modal-overlay.open') || e.target.closest?.('button,[contenteditable="true"]')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (_ds.idx < _ds.slides.length - 1) { _ds.idx++; paintSlide(); } }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (_ds.idx > 0) { _ds.idx--; paintSlide(); } }
  else if (e.key === 'Home') { e.preventDefault(); _ds.idx = 0; paintSlide(); }
  else if (e.key === 'End') { e.preventDefault(); _ds.idx = _ds.slides.length - 1; paintSlide(); }
});
