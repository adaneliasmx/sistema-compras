<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Portal del Empleado</title>

  <!-- PWA -->
  <link rel="manifest" href="/empleados/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mi Portal" />
  <link rel="apple-touch-icon" href="/img/logo.png" />

  <link rel="stylesheet" href="/empleados/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="/empleados/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/empleados/sw.js', { scope: '/empleados/' })
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
