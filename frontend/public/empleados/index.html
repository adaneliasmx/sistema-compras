<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Portal del Empleado</title>

  <!-- PWA -->
  <link rel="manifest" id="pwa-manifest" href="/empleados/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mi Portal" />
  <link rel="apple-touch-icon" href="/img/logo.png" />

  <link rel="stylesheet" href="/empleados/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="/empleados/app.js"></script>
  <script>
    // Detectar base path (opaco o normal) para PWA
    (function() {
      var base = '/empleados';
      if (location.pathname.indexOf('/apps/e6v3m8/empleados') === 0) base = '/apps/e6v3m8/empleados';
      var ml = document.getElementById('pwa-manifest');
      if (ml) ml.href = base + '/manifest.json';
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register(base + '/sw.js', { scope: base + '/' })
            .catch(function(err) { console.warn('SW registration failed:', err); });
        });
      }
    })();
  </script>
  <script src="/demo-sandbox.js"></script>
</body>
</html>
